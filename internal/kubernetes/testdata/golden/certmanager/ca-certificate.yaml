apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: fastgateway
  name: ca-abc
  namespace: fastgateway-system
spec:
  commonName: FastGateway Root
  duration: 87600h
  isCA: true
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: fgw-selfsigned
  privateKey:
    algorithm: RSA
    size: 4096
  secretName: ca-abc
