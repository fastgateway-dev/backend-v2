apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: fastgateway
  name: cert-client-abc
  namespace: fastgateway-system
spec:
  dnsNames: []
  duration: 2160h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: iss-1
  privateKey:
    algorithm: RSA
    size: 2048
  secretName: cert-client-abc
  uris:
  - spiffe://fastgateway/proj/client-1
  usages:
  - client auth
  - digital signature
  - key encipherment
