apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: fastgateway
    fastgateway.dev/gateway-id: 22222222-2222-2222-2222-222222222222
    fastgateway.dev/route-id: 11111111-1111-1111-1111-111111111111
  name: grpc-method-only-headers-11111111
  namespace: gateway-ns
spec:
  hostnames:
  - example.com
  parentRefs:
  - name: eg
    namespace: gateway-ns
  rules:
  - backendRefs:
    - name: my-svc
      namespace: default
      port: 8080
    matches:
    - headers:
      - name: x-tenant
        type: Exact
        value: acme
      - name: x-trace
        type: RegularExpression
        value: ^[0-9]+$
      method:
        method: Ping
        type: Exact
status:
  parents: null
