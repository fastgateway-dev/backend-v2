apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: fastgateway
    fastgateway.dev/gateway-id: 22222222-2222-2222-2222-222222222222
    fastgateway.dev/route-id: 11111111-1111-1111-1111-111111111111
  name: direct-multi-match-11111111
  namespace: gateway-ns
spec:
  hostnames:
  - example.com
  parentRefs:
  - name: eg
    namespace: gateway-ns
  rules:
  - filters:
    - extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: direct-multi-match-11111111-hrf
      type: ExtensionRef
    matches:
    - method: GET
      path:
        type: PathPrefix
        value: /a
  - filters:
    - extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: direct-multi-match-11111111-hrf
      type: ExtensionRef
    matches:
    - headers:
      - name: x-tenant
        type: Exact
        value: acme
      path:
        type: Exact
        value: /b
status:
  parents: null
