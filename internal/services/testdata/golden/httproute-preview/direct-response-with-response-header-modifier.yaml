apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: fastgateway
    fastgateway.dev/gateway-id: 22222222-2222-2222-2222-222222222222
    fastgateway.dev/route-id: 11111111-1111-1111-1111-111111111111
  name: direct-resp-headers-11111111
  namespace: gateway-ns
spec:
  hostnames:
  - example.com
  parentRefs:
  - name: eg
    namespace: gateway-ns
  rules:
  - filters:
    - responseHeaderModifier:
        set:
        - name: x-maintenance
          value: "true"
      type: ResponseHeaderModifier
    - extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: direct-resp-headers-11111111-hrf
      type: ExtensionRef
    matches:
    - path:
        type: PathPrefix
        value: /api
status:
  parents: null
