name: e2e

# Manual only -- this is the full compatibility matrix across every
# Envoy Gateway / Gateway API pair FastGateway is designed to support,
# including EG 1.8.0 / Gateway API 1.5.1, which is not yet verified
# against real infrastructure and therefore does not run on every push
# (see main.yml's `e2e` job, which only runs today's SupportedVersionPairs:
# EG 1.6.2 and 1.7.0, both on Gateway API 1.4.1).
#
# Retires the manual E2E_TEST-v1.6.2-v1.4.1.md process: run this before a
# release instead of hand-testing against a cluster and writing up the
# results in a markdown log.
on:
  workflow_dispatch: {}

jobs:
  # Steps are intentionally identical to main.yml's `e2e` job -- only the
  # matrix (widened to the full support surface) and the trigger (manual
  # only, no push/pull_request) differ. See main.yml for the rationale
  # behind each step.
  e2e:
    name: E2E (Envoy Gateway ${{ matrix.envoy-gateway-version }})
    runs-on: ubuntu-latest
    # go test arms a fresh 10-minute-per-package timeout by default; -p 1
    # serializes packages but doesn't raise that timer, and
    # e2e/suites/domain and e2e/suites/platform each run long enough
    # serially to blow it (see the -timeout 60m below). Without an
    # explicit job timeout here this job would otherwise inherit GitHub's
    # 360-minute default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - envoy-gateway-version: "1.6.2"
            gateway-api-version: "1.4.1"
          - envoy-gateway-version: "1.7.0"
            gateway-api-version: "1.4.1"
          - envoy-gateway-version: "1.8.0"
            gateway-api-version: "1.5.1"
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fastgateway
          POSTGRES_PASSWORD: fastgateway
          POSTGRES_DB: fastgateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastgateway -d fastgateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KIND_CLUSTER: fastgateway-e2e
      GATEWAY_API_VERSION: ${{ matrix.gateway-api-version }}
      ENVOY_GATEWAY_VERSION: ${{ matrix.envoy-gateway-version }}
      KIND_VERSION: "v0.27.0"
      CLOUD_PROVIDER_KIND_VERSION: "0.11.1"
      STEP_CLI_VERSION: "0.28.7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Install kind
        run: |
          curl -fLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster --name "$KIND_CLUSTER" --wait 120s

      - name: Start cloud-provider-kind (LoadBalancer support)
        run: |
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fLo /tmp/cpk.tar.gz "https://github.com/kubernetes-sigs/cloud-provider-kind/releases/download/v${CLOUD_PROVIDER_KIND_VERSION}/cloud-provider-kind_${CLOUD_PROVIDER_KIND_VERSION}_linux_${arch}.tar.gz"
          tar -xzf /tmp/cpk.tar.gz -C /tmp cloud-provider-kind
          chmod +x /tmp/cloud-provider-kind
          sudo mv /tmp/cloud-provider-kind /usr/local/bin/cloud-provider-kind
          sudo nohup cloud-provider-kind > /tmp/cloud-provider-kind.log 2>&1 &
          sleep 3

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/v${GATEWAY_API_VERSION}/standard-install.yaml"

      - name: Deploy Redis for Envoy Gateway rate limiting
        run: |
          kubectl create namespace envoy-gateway-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n envoy-gateway-system create deployment redis --image=redis:6-alpine --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n envoy-gateway-system expose deployment redis --port=6379 --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n envoy-gateway-system rollout status deployment/redis --timeout=120s

      - name: Install Envoy Gateway (Helm)
        run: |
          cat > /tmp/envoy-gateway-values.yaml <<'EOF'
          config:
            envoyGateway:
              apiVersion: gateway.envoyproxy.io/v1alpha1
              kind: EnvoyGateway
              provider:
                type: Kubernetes
              gateway:
                controllerName: gateway.envoyproxy.io/gatewayclass-controller
              # REQUIRED. FastGateway emits Envoy Gateway `Backend` CRDs for
              # external backends, backend TLS/mTLS, and failover routes. The
              # CRD ships with the chart regardless, so those objects apply
              # cleanly -- but without this flag the EG translator refuses to
              # resolve a backendRef of kind: Backend, marks the HTTPRoute
              # ResolvedRefs=False, and Envoy serves a bare 500. Symptom is a
              # 500 with an EMPTY body (EG's synthetic direct response), as
              # distinct from a 503 carrying "upstream connect error".
              extensionApis:
                enableBackend: true
              rateLimit:
                backend:
                  type: Redis
                  redis:
                    url: redis.envoy-gateway-system.svc.cluster.local:6379
          EOF
          helm install eg oci://docker.io/envoyproxy/gateway-helm \
            --version "v${ENVOY_GATEWAY_VERSION}" \
            -n envoy-gateway-system --create-namespace \
            -f /tmp/envoy-gateway-values.yaml
          kubectl -n envoy-gateway-system rollout status deployment/envoy-gateway --timeout=180s
          # The rate-limit Deployment is reconciled separately by
          # envoy-gateway itself once it observes the Redis backend config
          # above, not created by this Helm install directly -- so it isn't
          # covered by the rollout status wait above. e2e/suites/traffic's
          # rate-limit tests use global rate limiting, which routes through
          # this Deployment; without waiting for it, those tests can run
          # against a not-yet-ready limiter and observe non-enforcement
          # (no 429) instead of a clean infra error. Name confirmed against
          # envoyproxy/gateway's ratelimit.InfraName ("envoy-ratelimit").
          kubectl -n envoy-gateway-system rollout status deployment/envoy-ratelimit --timeout=180s

      - name: Generate e2e test certificates
        run: |
          curl -fLo /tmp/step.tar.gz "https://github.com/smallstep/cli/releases/download/v${STEP_CLI_VERSION}/step_linux_${STEP_CLI_VERSION}_amd64.tar.gz"
          tar -xzf /tmp/step.tar.gz -C /tmp
          sudo mv "/tmp/step_${STEP_CLI_VERSION}/bin/step" /usr/local/bin/step
          (cd e2e/testdata/certificate && chmod +x generate.sh && ./generate.sh)

      - name: Apply RBAC and create secrets
        run: |
          kubectl apply -f e2e/deps/rbac.yaml
          kubectl -n fastgateway-system wait --for=jsonpath='{.data.token}' secret/fastgateway-token --timeout=60s
          bash e2e/deps/create-secrets.sh

      - name: Deploy static e2e dependencies (nginx, podinfo, backend TLS/mTLS)
        run: |
          kubectl apply -f e2e/deps/nginx.yaml
          kubectl apply -f e2e/deps/podinfo.yaml
          kubectl apply -f e2e/deps/backend-tls-server.yaml
          kubectl apply -f e2e/deps/backend-mtls-server.yaml
          kubectl -n default rollout status deployment/nginx-deployment --timeout=120s
          kubectl -n default rollout status deployment/podinfo --timeout=120s
          kubectl -n default rollout status deployment/backend-tls-server-1 --timeout=120s
          kubectl -n default rollout status deployment/backend-mtls-server-1 --timeout=120s

      - name: Build and load the four test doubles into kind
        run: |
          for svc in jwt-server external-auth grpc-external-auth ext-proc-server; do
            docker build -t "fastgateway-${svc}:latest" "e2e/servers/${svc}"
            kind load docker-image "fastgateway-${svc}:latest" --name "$KIND_CLUSTER"
          done
          kubectl apply -f e2e/deps/jwt-server.yaml
          kubectl apply -f e2e/deps/external-auth.yaml
          kubectl apply -f e2e/deps/grpc-external-auth.yaml
          kubectl apply -f e2e/deps/ext-proc-server.yaml
          kubectl -n default rollout status deployment/jwt-server --timeout=120s
          kubectl -n default rollout status deployment/external-auth --timeout=120s
          kubectl -n default rollout status deployment/grpc-external-auth --timeout=120s
          kubectl -n default rollout status deployment/ext-proc-server --timeout=120s

      - name: Resolve kind API server URL and FastGateway service-account token
        id: kube-creds
        run: |
          # bash -e (GHA's default shell) does NOT imply pipefail: without
          # it, a failing `kubectl ... | base64 -d` reports base64's exit
          # status (0, on empty input), so a kubectl failure would silently
          # produce an empty, masked token instead of failing this step --
          # surfacing two steps later as a confusing "K8S_API_URL and
          # K8S_TOKEN must both be set". Guard against that explicitly.
          set -o pipefail
          api_url="$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          token="$(kubectl -n fastgateway-system get secret fastgateway-token -o jsonpath='{.data.token}' | base64 -d)"
          [ -n "$api_url" ] || { echo "failed to resolve the kind API server URL" >&2; exit 1; }
          [ -n "$token" ] || { echo "failed to resolve the FastGateway service-account token" >&2; exit 1; }
          echo "::add-mask::${token}"
          echo "api_url=${api_url}" >> "$GITHUB_OUTPUT"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Run backend (go run ./cmd/server)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: fastgateway
          DATABASE_PASSWORD: fastgateway
          DATABASE_NAME: fastgateway
          API_PORT: "8081"
          JWT_SECRET: e2e-ci-jwt-secret-not-for-production-use
          ENCRYPTION_KEY: e2e-ci-encryption-key-not-for-prod
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin123
          ADMIN_EMAIL: admin@fastgateway.local
        run: |
          nohup go run ./cmd/server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          cat /tmp/backend.log >&2
          exit 1

      - name: Seed FastGateway (go run ./cmd/e2e-seed)
        env:
          FASTGATEWAY_API_URL: http://localhost:8081/api/v1
          K8S_API_URL: ${{ steps.kube-creds.outputs.api_url }}
          K8S_TOKEN: ${{ steps.kube-creds.outputs.token }}
        run: go run ./cmd/e2e-seed

      - name: Wait for the seeded Gateway and resolve GATEWAY_IP
        run: |
          # FastGateway creates Gateway resources in fastgateway-system, not
          # default -- models.Domain.Namespace defaults to it and
          # domain_service.go defines FastGatewayNamespace = "fastgateway-system".
          ns="${FG_NAMESPACE:-fastgateway-system}"

          # Gateway creation is asynchronous: e2e-seed returns as soon as the
          # domain is accepted, before the Gateway object exists. Poll for it.
          # (`kubectl get` with a jsonpath index EXITS NON-ZERO on an empty
          # list, so swallow that and retry rather than failing the step.)
          gw=""
          for i in $(seq 1 60); do
            gw="$(kubectl -n "$ns" get gateway -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            [ -n "$gw" ] && break
            sleep 2
          done
          if [ -z "$gw" ]; then
            echo "no Gateway appeared in namespace ${ns} within 120s of seeding" >&2
            echo "--- gateways in all namespaces ---" >&2
            kubectl get gateway -A >&2 || true
            echo "--- backend log ---" >&2
            tail -100 /tmp/backend.log >&2 || true
            exit 1
          fi
          echo "found Gateway ${gw} in namespace ${ns}"
          kubectl -n "$ns" wait --for=condition=Programmed "gateway/${gw}" --timeout=180s
          ip=""
          for i in $(seq 1 30); do
            ip="$(kubectl -n envoy-gateway-system get svc \
              -l "gateway.envoyproxy.io/owning-gateway-name=${gw},gateway.envoyproxy.io/owning-gateway-namespace=${ns}" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            [ -n "$ip" ] && break
            sleep 2
          done
          if [ -z "$ip" ]; then
            echo "Gateway LoadBalancer IP never appeared" >&2
            kubectl -n envoy-gateway-system get svc >&2
            exit 1
          fi
          echo "GATEWAY_IP=${ip}" >> "$GITHUB_ENV"

      # e2e/suites/security and e2e/suites/grpcroute mint JWT test tokens
      # from the go test process running on the runner, POSTing to
      # jwt-server -- not from inside the cluster. jwt-server's in-cluster
      # FQDN (jwt-server.default.svc.cluster.local, the JWT_SERVER_URL
      # fallback the tests use) only resolves inside the cluster, so
      # port-forward the Service to localhost here and point
      # JWT_SERVER_URL at that below. The issuer/JWKS values handed to
      # Envoy must stay the in-cluster FQDN (e2e/deps/jwt-server.yaml's
      # JWT_SERVER_HOST) since those are resolved by the Envoy pods, not
      # by this test process.
      - name: Port-forward jwt-server for JWT token minting
        run: |
          kubectl -n default port-forward svc/jwt-server 9000:9000 > /tmp/jwt-port-forward.log 2>&1 &
          echo $! > /tmp/jwt-port-forward.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "jwt-server port-forward is up"
              exit 0
            fi
            sleep 1
          done
          echo "jwt-server port-forward never became ready" >&2
          cat /tmp/jwt-port-forward.log >&2
          exit 1

      # -p 1 is NOT optional here either -- same shared-podinfo race as
      # main.yml's e2e job.
      #
      # -timeout 60m: go test arms a fresh 10-minute timer per package by
      # default. -p 1 only serializes packages, it doesn't raise that
      # timer, and e2e/suites/domain and e2e/suites/platform each run
      # ~11 mostly-serial tests with up to a 90s route-readiness wait
      # apiece -- comfortably over 10 minutes per package.
      # Start policy watches BEFORE the suite. A point-in-time snapshot taken
      # after `go test` exits is useless: every test's t.Cleanup has already
      # deleted its routes and policies, so the cluster is empty by then (this
      # was observed -- the snapshot printed only empty section headers).
      # These watches record every ADDED/MODIFIED event with timestamps, so the
      # gap between creationTimestamp and Accepted=True is measurable, which
      # distinguishes "policy attached late" (readiness race) from "policy
      # never attached" (real bug).
      - name: Start policy watches (diagnostics)
        run: |
          mkdir -p /tmp/diag
          for kind in securitypolicies backendtrafficpolicies envoyextensionpolicies; do
            nohup kubectl get "${kind}.gateway.envoyproxy.io" -A \
              --watch --output-watch-events -o json \
              > "/tmp/diag/${kind}.json" 2>/dev/null &
          done
          nohup kubectl get httproute -A --watch --output-watch-events -o json \
            > /tmp/diag/httproutes.json 2>/dev/null &
          nohup kubectl get grpcroute -A --watch --output-watch-events -o json \
            > /tmp/diag/grpcroutes.json 2>/dev/null &
          sleep 2
          echo "policy watches started"

      - name: Run e2e suite (go test -tags e2e ./e2e/... -p 1)
        env:
          JWT_SERVER_URL: http://localhost:9000
        run: go test -tags e2e ./e2e/... -p 1 -count=1 -v -timeout 60m

      - name: Backend log (always, for debugging)
        if: always()
        run: cat /tmp/backend.log || true

      - name: Policy convergence diagnostics (on failure)
        if: failure()
        run: |
          for f in /tmp/diag/*.json; do
            [ -s "$f" ] || { echo "=== $(basename "$f"): no events ==="; continue; }
            echo "=================== $(basename "$f") ==================="
            jq -rs '
              [ .[] | select(.type=="ADDED" or .type=="MODIFIED") | .object ]
              | group_by(.metadata.uid)
              | map({
                  name:     (.[0].metadata.namespace + "/" + .[0].metadata.name),
                  created:  .[0].metadata.creationTimestamp,
                  accepted: ([ .[] | (.status.ancestors // .status.parents // [])[]?
                                    | (.conditions // [])[]?
                                    | select(.type=="Accepted" and .status=="True")
                                    | .lastTransitionTime ] | sort | first),
                  states:   ([ .[] | (.status.ancestors // .status.parents // [])[]?
                                    | (.conditions // [])[]?
                                    | select(.type=="Accepted")
                                    | (.status + "/" + (.reason // "-")) ] | unique | join(","))
                })
              | .[] | "\(.name)\n    created=\(.created) accepted=\(.accepted // "NEVER") [\(.states)]"
            ' "$f" 2>/dev/null | head -100 || echo "  (jq failed)"
          done

      - name: Envoy Gateway logs (on failure)
        if: failure()
        run: |
          kubectl -n envoy-gateway-system logs deploy/envoy-gateway --tail=500 2>&1 \
            | command grep -iE 'wasm|coraza|oci|lua|mirror|translat|error|unable|fail' \
            | tail -80 || echo "  (no envoy-gateway logs)"
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true
