name: main

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  unit:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      # Every mock in internal/mocks is generated from the interface it
      # implements (.mockery.yml). Hand-maintained mocks are how
      # SetClientHeaderRepository and SetProjectRepository drifted out of
      # their interfaces unnoticed; regenerating here and failing on a diff
      # makes that class of defect impossible.
      #
      # `make mocks` builds the generator from tools/go.mod, a separate
      # module, so nothing about mockery reaches the product's go.mod.
      #
      # mocks-check detects drift with `git status --porcelain`, not
      # `git diff`. `git diff` is blind to UNTRACKED files, so a .mockery.yml
      # edit that emits a new generated file which is never committed produced
      # no diff and this step went green on a mock that is not in the repo.
      # See the comment on the target in the Makefile.
      - name: Verify mocks are up to date
        run: make mocks-check

      # cmd/server/openapi.yaml is a bundle of docs/openapi/ (see `make
      # openapi`), //go:embed-ed into the server binary and checked against
      # the live router by TestRouteSpecParity in cmd/server. Without this
      # check, a docs/openapi/ edit that is never re-bundled would leave the
      # committed cmd/server/openapi.yaml -- and therefore the spec served at
      # /api/v1/docs/openapi.yaml -- silently stale, the same class of drift
      # mocks-check exists to catch for internal/mocks.
      - name: Verify OpenAPI bundle is up to date
        run: make openapi-check

      - name: Test
        run: go test ./... -count=1

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Builds and pushes the backend-v2 image to ghcr.io. Gated on `unit` so a
  # failing build/test/lint never gets published. The e2e suites live in
  # their own workflows (e2e.yml, e2e-certificate.yml, and the on-demand
  # e2e-compatibility.yml) and deliberately do not gate this push -- they
  # run in parallel on their own clusters, not in front of every image push.
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Set up QEMU (multi-platform build support)
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
