          description: Source manifest dialect hint, used when mode is manifest_import
    AIYamlSet:
      type: object
      description: Set of YAML strings for different resource types
      properties:
        httpRoute:
          type: string
          description: HTTPRoute or GRPCRoute YAML
        securityPolicy:
          type: string
          description: SecurityPolicy YAML
        backendTrafficPolicy:
          type: string
          description: BackendTrafficPolicy YAML
        envoyExtensionPolicy:
          type: string
          description: EnvoyExtensionPolicy YAML
        backend:
          type: string
          description: Backend CRD YAML
    AIChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          maxLength: 10000
          description: User message to the AI assistant
        context:
          $ref: '#/components/schemas/AIChatContext'
        history:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AIChatMessage'
          description: Previous conversation messages
    AIChatContext:
      type: object
      properties:
        type:
          type: string
          enum:
            - route
            - domain
          description: Type of entity the user is currently configuring
        route:
          type: object
          description: Current route configuration context
        domain:
          type: object
          description: Current domain configuration context
    AIChatMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
    AIReviewRequest:
      type: object
      required:
        - action
      description: At least one of proposedYaml or currentYaml is required.
      properties:
        action:
          type: string
          enum:
            - create
            - update
            - delete
          description: Type of route change being reviewed
        description:
          type: string
          description: Optional human description of the changes
        proposedYaml:
          $ref: '#/components/schemas/AIYamlSet'
        currentYaml:
          $ref: '#/components/schemas/AIYamlSet'
    AIReviewResult:
      type: object
      required:
        - summary
      properties:
        summary:
          type: string
          description: Plain language summary of the changes
        risks:
          type: array
          items:
            $ref: '#/components/schemas/AIReviewNote'
          description: Potential risks and issues
        securityNotes:
          type: array
          items:
            $ref: '#/components/schemas/AIReviewNote'
          description: Security-related observations
        suggestions:
          type: array
          items:
            type: string
          description: Actionable improvement suggestions
        configHighlights:
          type: array
          items:
            type: string
          description: Key facts about the configuration
    AIReviewNote:
      type: object
      required:
        - severity
        - message
      properties:
        severity:
          type: string
          enum:
            - warning
            - info
          description: Severity level of the note
        message:
          type: string
          description: Description of the risk or observation
    WafPolicyConfig:
      type: object
      required:
        - mode
      description: WAF (Web Application Firewall) configuration using coraza-proxy-wasm
      properties:
        mode:
          type: string
          enum:
            - block
            - detect
          description: WAF mode - block malicious requests or detect-only (log)
        rulesets:
          type: array
          items:
            type: string
          description: List of enabled rulesets (e.g., owasp-crs)
        anomalyThreshold:
          type: integer
          minimum: 1
          description: Anomaly score threshold before blocking (default 5)
        paranoiaLevel:
          type: integer
          minimum: 1
          maximum: 4
          description: OWASP CRS paranoia level 1-4 (default 1)
        disabledRuleIDs:
          type: array
          items:
            type: integer
          description: Specific rule IDs to disable
        customDirectives:
          type: array
          items:
            type: string
          description: Raw SecRule directives (advanced escape hatch)
    WafPolicy:
      type: object
      description: WAF policy for a route
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        config:
          $ref: '#/components/schemas/WafPolicyConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EnvoyExtensionPolicyInput:
      type: object
      description: Envoy extension policy input for Lua, Wasm, and ext_proc extensions
      properties:
        lua:
          $ref: '#/components/schemas/LuaExtensionConfig'
        wasm:
          $ref: '#/components/schemas/WasmExtensionConfig'
        extProc:
          $ref: '#/components/schemas/ExtProcExtensionConfig'
    LuaExtensionConfig:
      type: object
      required:
        - type
      description: Lua extension configuration
      properties:
        type:
          type: string
          enum:
            - Inline
            - ValueRef
          description: Lua script source type
        inline:
          type: string
          description: Inline Lua script (when type is Inline)
        valueRef:
          $ref: '#/components/schemas/ValueRef'
    WasmExtensionConfig:
      type: object
      required:
        - name
        - code
      description: Wasm extension configuration
      properties:
        name:
          type: string
          description: Wasm filter name
        rootID:
          type: string
          description: Wasm root ID (optional)
        code:
          $ref: '#/components/schemas/WasmCodeSource'
        config:
          type: string
          description: JSON configuration for the Wasm module
    WasmCodeSource:
      type: object
      required:
        - type
      description: Wasm code source
      properties:
        type:
          type: string
          enum:
            - HTTP
            - Image
          description: Source type
        http:
          $ref: '#/components/schemas/WasmHTTPSource'
        image:
          $ref: '#/components/schemas/WasmImageSource'
    WasmHTTPSource:
      type: object
      required:
        - url
        - sha256
      description: HTTP source for Wasm module
      properties:
        url:
          type: string
          description: URL to download the Wasm module
        sha256:
          type: string
          description: SHA256 checksum of the module (64-character hex string)
    WasmImageSource:
      type: object
      required:
        - url
      description: OCI image source for Wasm module
      properties:
        url:
          type: string
          description: OCI image URL (e.g., "oci://ghcr.io/example/wasm:v1.0")
        sha256:
          type: string
          description: SHA256 checksum (optional for images)
        pullSecret:
          $ref: '#/components/schemas/ValueRef'
          description: Reference to Secret containing registry credentials
    SSOPublicConfig:
      type: object
      properties:
        enabled:
          type: boolean
        providerName:
          type: string
        forceSSO:
          type: boolean
        allowedDomains:
          type: array
          items:
            type: string
    SSOConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        enabled:
          type: boolean
        providerName:
          type: string
        issuerUrl:
          type: string
        clientId:
          type: string
        scopes:
          type: array
          items:
            type: string
        allowedDomains:
          type: array
          items:
            type: string
        allowedEmails:
          type: array
          items:
            type: string
            format: email
        autoRegister:
          type: boolean
        forceSSO:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SSOConfigInput:
      type: object
      required:
        - providerName
        - issuerUrl
        - clientId
        - clientSecret
      properties:
        providerName:
          type: string
          description: Identity provider name (e.g., google, okta)
        issuerUrl:
          type: string
          description: OIDC issuer URL
        clientId:
          type: string
          description: OAuth2 client ID
        clientSecret:
          type: string
          description: OAuth2 client secret
        scopes:
          type: array
          items:
            type: string
          description: OAuth2 scopes (default - openid, email, profile)
        allowedDomains:
          type: array
          items:
            type: string
          description: Restrict SSO to these email domains
        allowedEmails:
          type: array
          items:
            type: string
            format: email
          description: Restrict SSO to these specific email addresses
        autoRegister:
          type: boolean
          description: Auto-create users on first SSO login
        forceSSO:
          type: boolean
          description: Force SSO for non-owner users
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          description: Notification type (e.g., mention)
        title:
          type: string
        link:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'
    RouteVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        version:
          type: integer
        configSnapshot:
          type: object
          description: Full route configuration at this version
        routeDescription:
          type: string
        protocol:
          type: string
          enum:
            - http
            - grpc
        securityMode:
          type: string
          enum:
            - general
            - client
        changeDescription:
          type: string
        approvalId:
          type: string
          format: uuid
        deployedBy:
          type: string
          format: uuid
        deployer:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
    RouteVersionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RouteVersion'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    ApprovalComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        approvalId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    CreateCommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          maxLength: 10000
    CommentList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalComment'
        total:
          type: integer
    Labels:
      type: object
      additionalProperties:
        type: string
      description: Arbitrary key/value labels (Kubernetes-style) attached to a resource.
    VersionStatus:
      type: string
      enum:
        - supported
        - untested
        - unknown
      description: |
        - `supported`: the detected (envoyGateway, gatewayAPI) pair is in `supportedPairs`.
        - `untested`: both versions were detected but the pair is not one FastGateway has tested against.
        - `unknown`: detection failed for one or both components.
    ProbeResult:
      type: object
      description: The detected version of one component (Envoy Gateway or Gateway API).
      properties:
        version:
          type: string
          description: Detected version string (e.g. "1.8.4"), empty if detection failed.
        image:
          type: string
          description: Container image the version was detected from, if applicable.
        source:
          type: string
          description: How the version was detected (e.g. deployment image, CRD version).
        detected:
          type: boolean
          description: Whether a version was successfully detected.
        error:
          type: string
          nullable: true
          description: Error message if detection failed; null otherwise.
    VersionPair:
      type: object
      description: A tested (Envoy Gateway, Gateway API) version combination.
      properties:
        envoyGateway:
          type: string
          example: 1.8.4
        gatewayAPI:
          type: string
          example: 1.5.1
    VersionInfo:
      type: object
      description: Detected Envoy Gateway / Gateway API versions for a project's cluster, with compatibility classification against the versions FastGateway has been tested with.
      properties:
        status:
          $ref: '#/components/schemas/VersionStatus'
        envoyGateway:
          $ref: '#/components/schemas/ProbeResult'
        gatewayAPI:
          $ref: '#/components/schemas/ProbeResult'
        supportedPairs:
          type: array
          items:
            $ref: '#/components/schemas/VersionPair'
        checkedAt:
          type: string
          format: date-time
        cacheExpiresAt:
          type: string
          format: date-time
    NamespaceCapability:
      type: string
      enum:
        - deploy_gateway
        - backend_service
        - tls_secret
      description: |
        - `deploy_gateway`: Gateway / HTTPRoute / GRPCRoute can be deployed in this namespace.
        - `backend_service`: HTTPRoutes can forward to Services in this namespace.
        - `tls_secret`: Gateway can mount TLS Secrets stored in this namespace.
    UpdateProjectNamespaceRequest:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NamespaceCapability'
    ExtProcBackendRef:
      type: object
      required:
        - name
        - namespace
        - port
      description: gRPC service to send request/response traffic to for ext_proc processing
      properties:
        name:
          type: string
          description: Service name of the ext_proc gRPC backend
        namespace:
          type: string
          description: Namespace of the ext_proc gRPC backend
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Port of the ext_proc gRPC backend
    ExtProcBodyMode:
      type: object
      description: Body processing mode for a request or response phase
      properties:
        body:
          type: string
          enum:
            - None
            - Buffered
            - Streamed
          description: How the body is sent to the ext_proc processor
    ExtProcProcessingMode:
      type: object
      description: Controls which request/response parts are sent to the ext_proc processor
      properties:
        request:
          $ref: '#/components/schemas/ExtProcBodyMode'
        response:
          $ref: '#/components/schemas/ExtProcBodyMode'
    ExtProcExtensionConfig:
      type: object
      required:
        - backendRef
      description: External processing (ext_proc) extension configuration - sends request/response traffic to a gRPC processor service
      properties:
        backendRef:
          $ref: '#/components/schemas/ExtProcBackendRef'
        processingMode:
          $ref: '#/components/schemas/ExtProcProcessingMode'
        failOpen:
          type: boolean
          default: false
          description: If true, traffic is allowed through when the ext_proc server is unavailable
    EnvoyExtensionPolicyConfig:
      type: object
      description: Lua, Wasm, and ext_proc extension configuration stored for a route
      properties:
        lua:
          $ref: '#/components/schemas/LuaExtensionConfig'
        wasm:
          $ref: '#/components/schemas/WasmExtensionConfig'
        extProc:
          $ref: '#/components/schemas/ExtProcExtensionConfig'
    DefaultBackend:
      type: object
      required:
        - port
      description: |
        Backend applied to every route parsed from the spec. Exactly one of
        (service+namespace) or address must be provided.
      properties:
        service:
          type: string
          description: Kubernetes Service name (mutually exclusive with address; requires namespace)
        namespace:
          type: string
          description: Kubernetes namespace of the service (required when service is set)
        address:
          type: string
          description: External FQDN or IP address (mutually exclusive with service+namespace)
        port:
          type: integer
          description: Backend port
    OpenAPIImportRequest:
      type: object
      required:
        - spec
        - defaultBackend
      description: Request body for importing routes from an OpenAPI spec
      properties:
        spec:
          type: string
          description: Raw OpenAPI 3.0/3.1 spec content (JSON or YAML)
        defaultBackend:
          $ref: '#/components/schemas/DefaultBackend'
    ParsedRoute:
      type: object
      required:
        - name
        - protocol
        - securityMode
        - config
      description: A route generated from one OpenAPI operation, ready for review before creation
      properties:
        name:
          type: string
        description:
          type: string
        protocol:
          type: string
          enum:
            - http
          description: Always "http" for v1 of the importer
        securityMode:
          type: string
          enum:
            - general
          description: Always "general" for v1 of the importer
        config:
          $ref: '#/components/schemas/RouteConfig'
        tag:
          type: string
          description: OpenAPI tag the source operation belonged to, if any
    ImportWarning:
      type: object
      required:
        - level
        - source
        - message
      description: Parser-level info or a per-operation skip surfaced to the importing user
      properties:
        level:
          type: string
          enum:
            - info
            - warning
        source:
          type: string
          description: Where the warning originated, e.g. "POST /webhook" or "spec"
        message:
          type: string
    Rename:
      type: object
      required:
        - original
        - final
        - reason
      description: Records when a generated route name was changed from its source-derived form
      properties:
        original:
          type: string
        final:
          type: string
        reason:
          type: string
          enum:
            - duplicate
            - sanitized
            - truncated
    SpecInfo:
      type: object
      required:
        - title
        - version
        - format
      description: Summary of the input spec for UI display
      properties:
        title:
          type: string
        version:
          type: string
        format:
          type: string
          enum:
            - openapi-3.0
            - openapi-3.1
    OpenAPIImportResponse:
      type: object
      required:
        - routes
        - warnings
        - renames
        - specInfo
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/ParsedRoute'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ImportWarning'
        renames:
          type: array
          items:
            $ref: '#/components/schemas/Rename'
        specInfo:
          $ref: '#/components/schemas/SpecInfo'
    ImportError:
      type: object
      required:
        - error
        - message
      description: Error response for the OpenAPI import endpoint
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - openapi_parse_failed
            - spec_too_large
        message:
          type: string
    ApprovalStageReview:
      type: object
      description: An individual reviewer decision on a multi-approver stage
      properties:
        id:
          type: string
          format: uuid
        stageId:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
        reviewer:
          $ref: '#/components/schemas/User'
        decision:
          type: string
          enum:
            - approved
            - rejected
        createdAt:
          type: string
          format: date-time
    AuthorizationHeaderMatch:
      type: object
      required:
        - name
        - values
      description: Required header match rule for general-mode authorization
      properties:
        name:
          type: string
          description: Header name to match
        values:
          type: array
          items:
            type: string
          description: Allowed values for the header
    RouteResponse:
      type: object
      description: Route returned by createRoute/updateRoute, with any non-fatal warnings generated while assembling the route.
      allOf:
        - $ref: '#/components/schemas/Route'
        - type: object
          properties:
            warnings:
              type: array
              items:
                type: string
              description: Non-fatal warnings (e.g. backend TLS configuration, direct-response percentage) generated while creating/updating the route
    EnvoyExtensionPolicy:
      type: object
      description: Envoy Gateway EnvoyExtensionPolicy resource (Lua, Wasm, and/or ext_proc extensions configured on a route)
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        config:
          $ref: '#/components/schemas/EnvoyExtensionPolicyConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RouteWithPolicies:
      type: object
      description: |
        Route detail response (GET /routes/{routeId} only) - the plain Route plus
        its associated policies, each only present when configured for the route.
      allOf:
        - $ref: '#/components/schemas/Route'
        - type: object
          properties:
            securityPolicy:
              $ref: '#/components/schemas/SecurityPolicy'
            backendTrafficPolicy:
              $ref: '#/components/schemas/BackendTrafficPolicy'
            extensionPolicy:
              $ref: '#/components/schemas/EnvoyExtensionPolicy'
            wafPolicy:
              $ref: '#/components/schemas/WafPolicy'
    APIKeyClientResourceYAMLs:
      type: object
      required:
        - clientId
        - clientName
        - httpRouteYaml
        - securityPolicyYaml
      description: Kubernetes resources generated for a single API-key client attachment, with secrets redacted
      properties:
        clientId:
          type: string
          format: uuid
        clientName:
          type: string
        httpRouteYaml:
          type: string
          description: Per-client HTTPRoute/GRPCRoute Kubernetes YAML
        securityPolicyYaml:
          type: string
          description: Per-client SecurityPolicy Kubernetes YAML
        backendTrafficPolicyYaml:
          type: string
          description: Per-client BackendTrafficPolicy Kubernetes YAML (if configured)
        envoyExtensionPolicyYaml:
          type: string
          description: Per-client EnvoyExtensionPolicy Kubernetes YAML (if configured)
    CheckConflictsRequest:
      type: object
      required:
        - match
      description: Request body for checking whether a route matcher conflicts with existing routes in the domain
      properties:
        match:
          $ref: '#/components/schemas/RouteMatch'
        excludeRouteId:
          type: string
          format: uuid
          description: Route ID to exclude from conflict checking (e.g., when checking conflicts while editing an existing route)
    ConflictResult:
      type: object
      description: An existing route whose matcher conflicts with the one being checked
      properties:
        routeId:
          type: string
          format: uuid
        routeName:
          type: string
    CheckConflictsResponse:
      type: object
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictResult'
