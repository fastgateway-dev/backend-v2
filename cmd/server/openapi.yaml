    ExtAuthConfig:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - http
            - grpc
          description: External auth service type
        http:
          $ref: '#/components/schemas/ExtAuthHTTPConfig'
        grpc:
          $ref: '#/components/schemas/ExtAuthGRPCConfig'
        failOpen:
          type: boolean
          description: Allow traffic if auth service is unavailable
        headersToExtAuth:
          type: array
          items:
            type: string
          description: Additional client request headers to forward to ext-auth service
        headersToDownstreamOnDeny:
          type: array
          items:
            type: string
          description: Headers to send to client on auth deny
        headersToDownstreamOnAllow:
          type: array
          items:
            type: string
          description: Headers to send to client on auth allow
        headersToUpstreamOnAllow:
          type: array
          items:
            type: string
          description: Headers to send to backend on auth allow
        withRequestBody:
          $ref: '#/components/schemas/ExtAuthRequestBody'
    ExtAuthHTTPConfig:
      type: object
      required:
        - backendRef
        - path
      properties:
        backendRef:
          $ref: '#/components/schemas/ExtAuthBackendRef'
        path:
          type: string
          description: Path on the auth service to call
        headersToBackend:
          type: array
          items:
            type: string
          description: Headers to forward to auth service
    ExtAuthGRPCConfig:
      type: object
      required:
        - backendRef
      properties:
        backendRef:
          $ref: '#/components/schemas/ExtAuthBackendRef'
    ExtAuthBackendRef:
      type: object
      required:
        - name
        - port
      properties:
        name:
          type: string
          description: Service name
        namespace:
          type: string
          description: Namespace (optional, defaults to route namespace)
        port:
          type: integer
          description: Service port
    ExtAuthRequestBody:
      type: object
      required:
        - maxBytes
      properties:
        maxBytes:
          type: integer
          description: Maximum request body bytes to forward
    BackendTrafficPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        config:
          $ref: '#/components/schemas/BackendTrafficPolicyConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BackendTrafficPolicyConfig:
      type: object
      properties:
        compression:
          type: array
          items:
            $ref: '#/components/schemas/CompressionConfig'
          description: List of compression configurations
        retry:
          $ref: '#/components/schemas/RetryConfig'
        loadBalancer:
          $ref: '#/components/schemas/LoadBalancerConfig'
        circuitBreaker:
          $ref: '#/components/schemas/CircuitBreakerConfig'
        healthCheck:
          $ref: '#/components/schemas/HealthCheckConfig'
        faultInjection:
          $ref: '#/components/schemas/FaultInjectionConfig'
        rateLimit:
          $ref: '#/components/schemas/RateLimitConfig'
        requestBuffer:
          $ref: '#/components/schemas/RequestBufferConfig'
        responseOverride:
          type: array
          items:
            $ref: '#/components/schemas/ResponseOverrideRule'
          description: Rules for overriding backend responses based on status codes
        timeout:
          $ref: '#/components/schemas/BTPTimeoutConfig'
    BackendTrafficPolicyInput:
      type: object
      properties:
        compression:
          type: array
          items:
            $ref: '#/components/schemas/CompressionConfig'
          description: List of compression configurations
        retry:
          $ref: '#/components/schemas/RetryConfig'
        loadBalancer:
          $ref: '#/components/schemas/LoadBalancerConfig'
        circuitBreaker:
          $ref: '#/components/schemas/CircuitBreakerConfig'
        healthCheck:
          $ref: '#/components/schemas/HealthCheckConfig'
        faultInjection:
          $ref: '#/components/schemas/FaultInjectionConfig'
        rateLimit:
          $ref: '#/components/schemas/RateLimitConfig'
        requestBuffer:
          $ref: '#/components/schemas/RequestBufferConfig'
        responseOverride:
          type: array
          items:
            $ref: '#/components/schemas/ResponseOverrideRule'
          description: Rules for overriding backend responses based on status codes
        timeout:
          $ref: '#/components/schemas/BTPTimeoutConfig'
    BTPTimeoutConfig:
      type: object
      description: Timeout configuration for BackendTrafficPolicy (works for both HTTP and gRPC routes)
      properties:
        tcp:
          $ref: '#/components/schemas/BTPTCPTimeoutConfig'
        http:
          $ref: '#/components/schemas/BTPHTTPTimeoutConfig'
    BTPTCPTimeoutConfig:
      type: object
      properties:
        connectTimeout:
          type: string
          description: TCP connect timeout (e.g. "10s", "500ms")
    BTPHTTPTimeoutConfig:
      type: object
      properties:
        requestTimeout:
          type: string
          description: Request timeout (e.g. "15s", "1m")
        connectionIdleTimeout:
          type: string
          description: Connection idle timeout (e.g. "1h")
        maxConnectionDuration:
          type: string
          description: Max connection duration (e.g. "0s" for unlimited)
        maxStreamDuration:
          type: string
          description: Max stream duration (e.g. "0s" for unlimited)
    CompressionConfig:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Gzip
            - Brotli
            - Zstd
          description: Compression algorithm type
        gzip:
          type: object
          description: Gzip-specific configuration (currently empty)
        brotli:
          type: object
          description: Brotli-specific configuration (currently empty)
        zstd:
          type: object
          description: Zstd-specific configuration (currently empty)
    RetryConfig:
      type: object
      description: Retry configuration for BackendTrafficPolicy
      properties:
        numRetries:
          type: integer
          minimum: 0
          description: Maximum number of retry attempts. Defaults to 2 if not set.
        retryOn:
          $ref: '#/components/schemas/RetryOn'
        perRetryPolicy:
          $ref: '#/components/schemas/PerRetryPolicy'
    RetryOn:
      type: object
      description: Conditions that trigger a retry
      properties:
        httpStatusCodes:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
          description: HTTP status codes that trigger a retry
        triggers:
          type: array
          items:
            type: string
            enum:
              - 5xx
              - gateway-error
              - connect-failure
              - retriable-status-codes
              - reset
              - reset-before-request
              - retriable-4xx
              - refused-stream
              - cancelled
              - deadline-exceeded
              - internal
              - resource-exhausted
              - unavailable
          description: Envoy retry trigger conditions
    PerRetryPolicy:
      type: object
      description: Per-attempt retry behavior
      properties:
        backOff:
          $ref: '#/components/schemas/BackOffPolicy'
        timeout:
          type: string
          description: Per-attempt timeout (Go duration format, e.g. 250ms, 1s)
    BackOffPolicy:
      type: object
      description: Backoff timing between retries
      properties:
        baseInterval:
          type: string
          description: Initial wait between retries (e.g. 25ms, 100ms)
        maxInterval:
          type: string
          description: Maximum wait between retries (e.g. 250ms, 10s). Must be >= baseInterval.
    LoadBalancerConfig:
      type: object
      required:
        - type
      description: Load balancer configuration for traffic distribution across backends
      properties:
        type:
          type: string
          enum:
            - RoundRobin
            - Random
            - LeastRequest
            - ConsistentHash
          description: Load balancing algorithm type
        consistentHash:
          $ref: '#/components/schemas/ConsistentHashConfig'
    ConsistentHashConfig:
      type: object
      required:
        - type
      description: Consistent hash configuration (required when load balancer type is ConsistentHash)
      properties:
        type:
          type: string
          enum:
            - SourceIP
            - Header
            - Cookie
          description: The hash key type for consistent hashing
        header:
          $ref: '#/components/schemas/ConsistentHashHeader'
        cookie:
          $ref: '#/components/schemas/ConsistentHashCookie'
    ConsistentHashHeader:
      type: object
      required:
        - name
      description: Header-based consistent hashing configuration
      properties:
        name:
          type: string
          description: The HTTP header name to hash on
    ConsistentHashCookie:
      type: object
      required:
        - name
      description: Cookie-based consistent hashing configuration
      properties:
        name:
          type: string
          description: The cookie name to hash on
        ttl:
          type: string
          description: Cookie TTL duration (Go duration format, e.g. "60s", "1h")
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Cookie attributes (e.g. SameSite=Strict, HttpOnly=true)
    CircuitBreakerConfig:
      type: object
      description: Circuit breaker configuration to protect backends from being overwhelmed
      properties:
        maxConnections:
          type: integer
          format: int64
          description: Maximum number of connections to the backend. Default 1024.
        maxPendingRequests:
          type: integer
          format: int64
          description: Maximum number of pending requests queued. Default 1024.
        maxParallelRequests:
          type: integer
          format: int64
          description: Maximum number of parallel requests. Default 1024.
        maxParallelRetries:
          type: integer
          format: int64
          description: Maximum number of parallel retries. Default 1024.
        maxRequestsPerConnection:
          type: integer
          format: int64
          description: Maximum requests per connection. Default unlimited. Set to 1 to disable keep-alive.
    HealthCheckConfig:
      type: object
      description: Health check configuration for backend services
      properties:
        active:
          $ref: '#/components/schemas/ActiveHealthCheckConfig'
        passive:
          $ref: '#/components/schemas/PassiveHealthCheckConfig'
        panicThreshold:
          type: integer
          format: uint32
          description: Panic threshold percentage. Below this, Envoy ignores health status.
    ActiveHealthCheckConfig:
      type: object
      required:
        - type
      description: Active health check - Envoy actively probes backends
      properties:
        timeout:
          type: string
          description: Time to wait for response. Default 1s.
        interval:
          type: string
          description: Time between checks. Default 3s.
        unhealthyThreshold:
          type: integer
          format: uint32
          description: Unhealthy checks to mark backend unhealthy. Default 3.
        healthyThreshold:
          type: integer
          format: uint32
          description: Healthy checks to mark backend healthy. Default 1.
        type:
          type: string
          enum:
            - HTTP
            - TCP
            - GRPC
        http:
          $ref: '#/components/schemas/HTTPActiveHealthCheckConfig'
        tcp:
          $ref: '#/components/schemas/TCPActiveHealthCheckConfig'
        grpc:
          $ref: '#/components/schemas/GRPCActiveHealthCheckConfig'
    HTTPActiveHealthCheckConfig:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: HTTP request path for health checks
        method:
          type: string
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          description: HTTP method. Default GET.
        expectedStatuses:
          type: array
          items:
            type: integer
          description: Expected HTTP status codes. Default [200].
    TCPActiveHealthCheckConfig:
      type: object
      properties:
        send:
          $ref: '#/components/schemas/HealthCheckPayload'
        receive:
          $ref: '#/components/schemas/HealthCheckPayload'
    GRPCActiveHealthCheckConfig:
      type: object
      properties:
        service:
          type: string
          description: gRPC service name for health checks
    HealthCheckPayload:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Text
        text:
          type: string
    PassiveHealthCheckConfig:
      type: object
      description: Passive health check (outlier detection)
      properties:
        consecutiveGatewayErrors:
          type: integer
          format: uint32
          description: Gateway error threshold to eject backend
        consecutive5xxErrors:
          type: integer
          format: uint32
          description: 5xx error threshold to eject backend
        interval:
          type: string
          description: Evaluation interval (e.g. "30s")
        baseEjectionTime:
          type: string
          description: Minimum ejection duration (e.g. "30s")
    FaultInjectionConfig:
      type: object
      description: Fault injection configuration for testing resilience
      properties:
        delay:
          $ref: '#/components/schemas/FaultInjectionDelayConfig'
        abort:
          $ref: '#/components/schemas/FaultInjectionAbortConfig'
    FaultInjectionDelayConfig:
      type: object
      required:
        - fixedDelay
      description: Delay fault injection - adds artificial latency
      properties:
        fixedDelay:
          type: string
          description: Duration to delay (e.g. "2s", "500ms")
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of requests to delay (0-100). Default 100.
    FaultInjectionAbortConfig:
      type: object
      description: Abort fault injection - returns error responses
      properties:
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code to return
        grpcStatus:
          type: integer
          minimum: 0
          maximum: 16
          description: gRPC status code to return
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of requests to abort (0-100). Default 100.
    RateLimitConfig:
      type: object
      description: Rate limit configuration for controlling request volume
      properties:
        global:
          $ref: '#/components/schemas/GlobalRateLimitConfig'
    GlobalRateLimitConfig:
      type: object
      required:
        - rules
      description: Global rate limit configuration
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RateLimitRule'
          minItems: 1
          description: List of rate limit rules
    RateLimitRule:
      type: object
      required:
        - limit
      description: A single rate limit rule
      properties:
        limit:
          $ref: '#/components/schemas/RateLimitValue'
        clientSelectors:
          type: array
          items:
            $ref: '#/components/schemas/RateLimitSelector'
          description: Optional client selectors to scope the rate limit
    RateLimitValue:
      type: object
      required:
        - requests
        - unit
      description: Rate limit value (requests per time unit)
      properties:
        requests:
          type: integer
          minimum: 1
          description: Number of requests allowed
        unit:
          type: string
          enum:
            - Second
            - Minute
            - Hour
            - Day
          description: Time unit for the rate limit
    RateLimitSelector:
      type: object
      description: Client selector criteria for rate limiting
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/RateLimitHeaderMatch'
          description: Header-based matching
        sourceCIDR:
          $ref: '#/components/schemas/RateLimitSourceCIDR'
        path:
          $ref: '#/components/schemas/RateLimitPathMatch'
        methods:
          type: array
          items:
            type: string
          description: HTTP methods to match (e.g., GET, POST)
    RateLimitHeaderMatch:
      type: object
      required:
        - name
      description: Header match for rate limiting
      properties:
        name:
          type: string
          description: Header name to match
        value:
          type: string
          description: Header value to match (optional)
        type:
          type: string
          enum:
            - Exact
            - Distinct
          description: Match type (Exact = match value, Distinct = unique per value)
        invert:
          type: boolean
          default: false
          description: Invert the match condition
    RateLimitSourceCIDR:
      type: object
      required:
        - value
      description: Source CIDR match for rate limiting
      properties:
        value:
          type: string
          description: CIDR notation or IP address (e.g., "192.168.1.0/24")
        type:
          type: string
          enum:
            - Exact
            - Distinct
          description: Match type (Exact = match CIDR, Distinct = unique per IP)
    RateLimitPathMatch:
      type: object
      required:
        - value
        - type
      description: Path match for rate limiting
      properties:
        value:
          type: string
          description: Path value to match
        type:
          type: string
          enum:
            - Exact
            - PathPrefix
            - RegularExpression
          description: Path match type
    RequestBufferConfig:
      type: object
      required:
        - limit
      description: Request buffering configuration
      properties:
        limit:
          type: string
          description: Buffer limit (e.g., "4Ki", "1Mi", "16Ki")
    ResponseOverrideRule:
      type: object
      required:
        - match
        - response
      description: Response override rule
      properties:
        match:
          $ref: '#/components/schemas/ResponseOverrideMatch'
        response:
          $ref: '#/components/schemas/ResponseOverrideResponse'
    ResponseOverrideMatch:
      type: object
      required:
        - statusCodes
      description: Match criteria for response override
      properties:
        statusCodes:
          type: array
          items:
            $ref: '#/components/schemas/StatusCodeMatch'
          description: Status codes to match
    StatusCodeMatch:
      type: object
      required:
        - type
      description: Status code match specification
      properties:
        type:
          type: string
          enum:
            - Value
            - Range
          description: Match type (single value or range)
        value:
          type: integer
          description: Single status code value (when type is Value)
        range:
          $ref: '#/components/schemas/StatusCodeRange'
    StatusCodeRange:
      type: object
      required:
        - start
        - end
      description: Status code range
      properties:
        start:
          type: integer
          description: Start of range (inclusive)
        end:
          type: integer
          description: End of range (inclusive)
    ResponseOverrideResponse:
      type: object
      required:
        - contentType
        - body
      description: Override response configuration
      properties:
        contentType:
          type: string
          description: Content-Type header for the response
        body:
          $ref: '#/components/schemas/ResponseOverrideBody'
    ResponseOverrideBody:
      type: object
      required:
        - type
      description: Response body configuration
      properties:
        type:
          type: string
          enum:
            - Inline
            - ValueRef
          description: Body source type
        inline:
          type: string
          description: Inline body content (when type is Inline)
        valueRef:
          $ref: '#/components/schemas/ValueRef'
    ValueRef:
      type: object
      required:
        - kind
        - name
      description: Reference to a ConfigMap or Secret
      properties:
        group:
          type: string
          description: API group (empty for core resources)
        kind:
          type: string
          enum:
            - ConfigMap
            - Secret
          description: Resource kind
        name:
          type: string
          description: Resource name
        namespace:
          type: string
          description: Resource namespace (optional)
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        ipAddressCount:
          type: integer
        headerCount:
          type: integer
        attachmentCount:
          type: integer
        apiKeyEnabled:
          type: boolean
          description: Whether the client has an API key configured
        apiKeyPrefix:
          type: string
          description: First few characters of the API key (e.g., "fg_live_xxxx")
        apiKeyHeaderName:
          type: string
          description: Header name used to send the API key (default "x-api-key")
        apiKeyCreatedAt:
          type: string
          format: date-time
          description: When the API key was generated
        apiKeyCreatedBy:
          type: string
          format: uuid
          description: User who generated the API key
        clientIdHeaderName:
          type: string
          description: Header name for client ID routing (default "x-client-id")
        jwtEnabled:
          type: boolean
          description: Whether the client has JWT authentication configured
        jwtIssuer:
          type: string
          description: JWT issuer URL
        jwtJwksUrl:
          type: string
          description: URL to fetch JWKS for JWT validation
        jwtAudiences:
          type: array
          items:
            type: string
          description: Expected JWT audience values
        jwtRequiredClaims:
          type: array
          items:
            $ref: '#/components/schemas/JWTRequiredClaim'
          description: Required JWT claims for authorization
        jwtClaimToHeaders:
          type: array
          items:
            $ref: '#/components/schemas/JWTClaimToHeader'
          description: JWT claims to map to HTTP headers
        jwtCreatedAt:
          type: string
          format: date-time
          description: When JWT was configured
        jwtCreatedBy:
          type: string
          format: uuid
          description: User who configured JWT
        jwtCreator:
          $ref: '#/components/schemas/User'
        mtlsEnabled:
          type: boolean
          description: Whether the client has mTLS authentication configured
        mtlsCaName:
          type: string
          description: mTLS CA certificate name
        mtlsCaSecret:
          type: string
          description: K8s Secret name containing CA cert
        mtlsCaSecretKey:
          type: string
          description: Key within the Secret
        mtlsSans:
          type: array
          items:
            $ref: '#/components/schemas/MTLSSANEntry'
          description: Subject Alternative Names for mTLS
        mtlsHashes:
          type: array
          items:
            type: string
          description: Certificate hash whitelist for mTLS
        mtlsCreatedAt:
          type: string
          format: date-time
          description: When mTLS was configured
        mtlsCreatedBy:
          type: string
          format: uuid
          description: User who configured mTLS
        mtlsCreator:
          $ref: '#/components/schemas/User'
        allowedMethods:
          type: array
          items:
            type: string
            enum:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - HEAD
              - OPTIONS
          description: Allowed HTTP methods for authorization
        createdBy:
          type: string
          format: uuid
        team:
          $ref: '#/components/schemas/Team'
        creator:
          $ref: '#/components/schemas/User'
        apiKeyCreator:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClientList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateClientRequest:
      type: object
      required:
        - name
        - teamId
      properties:
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
          format: uuid
        contactName:
          type: string
        contactEmail:
          type: string
        clientIdHeaderName:
          type: string
          description: Header name for client ID routing (default "x-client-id")
    UpdateClientRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        clientIdHeaderName:
          type: string
          description: Header name for client ID routing (default "x-client-id")
    ClientIPAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        cidr:
          type: string
          description: IP address or CIDR range (e.g. 10.0.0.1/32, 192.168.0.0/24)
        description:
          type: string
        createdBy:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
    CreateClientIPRequest:
      type: object
      required:
        - cidr
      properties:
        cidr:
          type: string
          description: IP address or CIDR range
        description:
          type: string
    GenerateAPIKeyRequest:
      type: object
      properties:
        headerName:
          type: string
          description: Header name to send the API key in requests (default "x-api-key")
          default: x-api-key
          example: x-api-key
    GenerateAPIKeyResponse:
      type: object
      properties:
        apiKey:
          type: string
          description: The generated API key (shown only once)
          example: fg_live_aB3cD4eF5gH6iJ7kL8mN9oP0qR1sT2u
        prefix:
          type: string
          description: First few characters of the key for display
          example: fg_live_aB3c
        headerName:
          type: string
          description: Header name to use when sending the key
          example: x-api-key
        createdAt:
          type: string
          format: date-time
          description: When the key was generated
    JWTRequiredClaim:
      type: object
      properties:
        name:
          type: string
          description: JWT claim name (e.g., "scope", "role")
        values:
          type: array
          items:
            type: string
          description: Required values for the claim
        valueType:
          type: string
          enum:
            - Exact
            - StringContains
          default: Exact
          description: How to match claim values
    JWTClaimToHeader:
      type: object
      properties:
        claim:
          type: string
          description: JWT claim name to extract
        header:
          type: string
          description: HTTP header name to set with the claim value
    ConfigureJWTRequest:
      type: object
      required:
        - issuer
        - jwksUrl
      properties:
        issuer:
          type: string
          description: JWT issuer URL
          example: https://accounts.google.com
        jwksUrl:
          type: string
          description: URL to fetch JWKS for JWT validation
          example: https://www.googleapis.com/oauth2/v3/certs
        audiences:
          type: array
          items:
            type: string
          description: Expected JWT audience values
        requiredClaims:
          type: array
          items:
            $ref: '#/components/schemas/JWTRequiredClaim'
          description: Required JWT claims for authorization
        claimToHeaders:
          type: array
          items:
