  /projects/{projectId}/audit:
    get:
      tags:
        - Audit
      summary: List audit logs
      description: Requires audit.view permission, Owner, or Project Admin role.
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: resourceType
          in: query
          schema:
            type: string
            enum:
              - domain
              - domain_template
              - route
              - team
              - user
              - project_namespace
        - name: action
          in: query
          schema:
            type: string
            enum:
              - create
              - update
              - delete
              - approve
              - reject
              - deploy
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
  /projects/{projectId}/audit/export:
    get:
      tags:
        - Audit
      summary: Export audit logs as CSV
      description: |
        Exports all matching audit logs as a CSV file. Supports the same filters as the list endpoint but returns all results without pagination. Requires audit.view permission, Owner, or Project Admin role.
      operationId: exportAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: resourceType
          in: query
          schema:
            type: string
            enum:
              - domain
              - domain_template
              - route
              - team
              - user
              - project_namespace
        - name: action
          in: query
          schema:
            type: string
            enum:
              - create
              - update
              - delete
              - approve
              - reject
              - deploy
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV file download
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename=audit-log.csv
          content:
            text/csv:
              schema:
                type: string
                description: |
                  CSV with columns: Timestamp, Username, Action, Resource Type, Resource Name, Resource ID, IP Address, Details
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{projectId}/audit/cleanup:
    delete:
      tags:
        - Audit
      summary: Delete old audit logs
      description: |
        Permanently deletes audit logs older than the specified number of days. This action cannot be undone. Requires Owner or Project Admin role.
      operationId: cleanupAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditCleanupRequest'
      responses:
        '200':
          description: Cleanup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCleanupResponse'
        '400':
          description: Invalid request (days must be >= 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ai/status:
    get:
      tags:
        - AI
      summary: Check AI service availability
      operationId: getAIStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatus'
  /ai/chat:
    post:
      tags:
        - AI
      summary: Chat with AI assistant (SSE stream)
      description: |
        Interactive AI chat with context about routes and domains. Supports
        conversation history. Returns Server-Sent Events (SSE) stream.
        Enterprise-only feature.
      operationId: aiChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200':
          description: SSE stream of chat response chunks
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectId}/domains/{domainId}/ai/generate:
    post:
      tags:
        - AI
      summary: Generate routes using AI (SSE stream)
      operationId: aiGenerateRoutes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerateRequest'
      responses:
        '200':
          description: SSE stream of generation chunks
          content:
            text/event-stream:
              schema:
                type: string
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectId}/domains/{domainId}/ai/review:
    post:
      tags:
        - AI
      summary: Review route YAML changes using AI
      description: Sends current and/or proposed YAML configurations to AI for structured review. Returns summary, risks, security notes, suggestions, and config highlights. Enterprise-only feature.
      operationId: aiReviewYaml
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReviewRequest'
      responses:
        '200':
          description: Structured AI review result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReviewResult'
        '400':
          description: Invalid request (missing YAML content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    teamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    domainTemplateId:
      name: domainTemplateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    domainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    namespaceId:
      name: namespaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    routeId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    clientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ipId:
      name: ipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    attachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    approvalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    stageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    headerId:
      name: headerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    policyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    tokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresAt
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: The user's current password
        newPassword:
          type: string
          minLength: 8
          description: The new password (minimum 8 characters)
    CreateApiTokenRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ApiTokenCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Full token (only shown once)
        expiresAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - user
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
        - role
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum:
            - owner
            - user
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        isActive:
          type: boolean
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateTeamRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    AddTeamMemberRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
    AddMemberByEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    AddMemberResult:
      type: object
      properties:
        type:
          type: string
          enum:
            - added
            - invited
        user:
          $ref: '#/components/schemas/Team'
        invite:
          $ref: '#/components/schemas/TeamEmailInvite'
    TeamEmailInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        email:
          type: string
        invitedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        team:
          $ref: '#/components/schemas/Team'
        inviter:
          $ref: '#/components/schemas/User'
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        k8sApiUrl:
          type: string
        isConnected:
          type: boolean
        lastConnectedAt:
          type: string
          format: date-time
        domainCount:
          type: integer
        routeCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateProjectRequest:
      type: object
      required:
        - name
