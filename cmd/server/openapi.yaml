            enum:
              - domain
              - domain_template
              - route
              - team
              - user
              - project_namespace
              - approval
        - name: action
          in: query
          schema:
            type: string
            enum:
              - create
              - update
              - delete
              - approve
              - reject
              - deploy
              - approve_stage
              - reject_stage
              - cancel_approval
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV file download
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename=audit-log.csv
          content:
            text/csv:
              schema:
                type: string
                description: |
                  CSV with columns: Timestamp, Username, Action, Resource Type, Resource Name, Resource ID, IP Address, Details
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{projectId}/audit/cleanup:
    delete:
      tags:
        - Audit
      summary: Delete old audit logs
      description: |
        Permanently deletes audit logs older than the specified number of days. This action cannot be undone. Requires Owner or Project Admin role.
      operationId: cleanupAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditCleanupRequest'
      responses:
        '200':
          description: Cleanup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCleanupResponse'
        '400':
          description: Invalid request (days must be >= 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ai/status:
    get:
      tags:
        - AI
      summary: Check AI service availability
      operationId: getAIStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatus'
  /ai/chat:
    post:
      tags:
        - AI
      summary: Chat with AI assistant (SSE stream)
      description: |
        Interactive AI chat with context about routes and domains. Supports
        conversation history. Returns Server-Sent Events (SSE) stream.
        Enterprise-only feature.
      operationId: aiChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200':
          description: SSE stream of chat response chunks
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectId}/domains/{domainId}/ai/generate:
    post:
      tags:
        - AI
      summary: Generate routes using AI (SSE stream)
      operationId: aiGenerateRoutes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerateRequest'
      responses:
        '200':
          description: SSE stream of generation chunks
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectId}/domains/{domainId}/ai/review:
    post:
      tags:
        - AI
      summary: Review route YAML changes using AI
      description: Sends current and/or proposed YAML configurations to AI for structured review. Returns summary, risks, security notes, suggestions, and config highlights. Enterprise-only feature.
      operationId: aiReviewYaml
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReviewRequest'
      responses:
        '200':
          description: Structured AI review result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReviewResult'
        '400':
          description: Invalid request (missing YAML content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    teamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    domainTemplateId:
      name: domainTemplateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    domainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    namespaceId:
      name: namespaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    routeId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    clientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ipId:
      name: ipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    attachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    approvalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    stageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    headerId:
      name: headerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    policyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    tokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresAt
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: The user's current password
        newPassword:
          type: string
          minLength: 8
          description: The new password (minimum 8 characters)
    CreateApiTokenRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ApiTokenCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Full token (only shown once)
        expiresAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - user
        isActive:
          type: boolean
        authProvider:
          type: string
          description: How the user authenticates (e.g., local, sso)
        providerSubject:
          type: string
          nullable: true
          description: Subject identifier from the SSO provider, if applicable
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CurrentUser:
      description: User profile returned by GET /auth/me, including how the caller authenticated this request
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            authMethod:
              type: string
              description: How the current request was authenticated (e.g., jwt, api_token)
    UserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
        - role
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum:
            - owner
            - user
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        isActive:
          type: boolean
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateTeamRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    AddTeamMemberRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
    AddMemberByEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    AddMemberResult:
      type: object
      properties:
        type:
          type: string
          enum:
            - added
            - invited
        user:
          $ref: '#/components/schemas/User'
        invite:
          $ref: '#/components/schemas/TeamEmailInvite'
    TeamEmailInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        email:
          type: string
        invitedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        team:
          $ref: '#/components/schemas/Team'
        inviter:
          $ref: '#/components/schemas/User'
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        connectionType:
          type: string
          enum:
            - in_cluster
            - kubeconfig
            - api_token
          description: Kubernetes connection type
        k8sApiUrl:
          type: string
        k8sTlsSkipVerify:
          type: boolean
          description: Whether TLS verification of the K8s API server is skipped
        isConnected:
          type: boolean
        lastConnectedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        domainCount:
          type: integer
        routeCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        labels:
          $ref: '#/components/schemas/Labels'
        approvalEnabled:
          type: boolean
          description: Whether route changes in this project require approval
        selfApprovalAllowed:
          type: boolean
          description: Whether the author of a change may also approve it
        metricsEndpointUrl:
          type: string
          description: Prometheus/VictoriaMetrics-compatible metrics endpoint URL
        metricsAuthType:
          type: string
          enum:
            - none
            - bearer
            - basic
          description: Authentication method for the metrics endpoint
        metricsUsername:
          type: string
          description: Username for basic auth against the metrics endpoint
        metricsTlsSkipVerify:
          type: boolean
          description: Whether TLS verification of the metrics endpoint is skipped
        metricsCaCert:
          type: string
          description: Custom CA certificate PEM for the metrics endpoint
    ProjectList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        connectionType:
          type: string
          enum:
            - in_cluster
            - kubeconfig
            - api_token
          description: Kubernetes connection type. The wire values use underscores (e.g. `in_cluster`, `api_token`), not hyphens.
        kubeconfig:
          type: string
          description: Kubeconfig content (for connectionType=kubeconfig)
        k8sApiUrl:
          type: string
          description: Kubernetes API URL (for connectionType=api_token)
        k8sToken:
          type: string
          description: Kubernetes bearer token (for connectionType=api_token)
        tlsVerification:
          type: string
          enum:
            - system_ca
            - custom_ca
            - skip
          description: TLS verification mode for the K8s API (connectionType=api_token only). Defaults to `skip` when omitted.
        k8sCaCert:
          type: string
          description: Custom CA certificate PEM (required when tlsVerification=custom_ca)
        labels:
          $ref: '#/components/schemas/Labels'
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        kubeconfig:
          type: string
          description: Kubeconfig content (for connectionType=kubeconfig)
        k8sApiUrl:
          type: string
          description: Kubernetes API URL (for connectionType=api_token)
        k8sToken:
          type: string
          description: Kubernetes bearer token (for connectionType=api_token)
        tlsVerification:
          type: string
          enum:
            - system_ca
            - custom_ca
            - skip
          description: TLS verification mode for the K8s API (connectionType=api_token only)
        k8sCaCert:
          type: string
          description: Custom CA certificate PEM (required when tlsVerification=custom_ca)
        labels:
          $ref: '#/components/schemas/Labels'
        approvalEnabled:
          type: boolean
          description: Whether route changes in this project require approval
        selfApprovalAllowed:
          type: boolean
          description: Whether the author of a change may also approve it
        metricsEndpointUrl:
          type: string
          description: Prometheus/VictoriaMetrics-compatible metrics endpoint URL
        metricsAuthType:
          type: string
          enum:
            - none
            - bearer
            - basic
          description: Authentication method for the metrics endpoint
        metricsUsername:
          type: string
          description: Username for basic auth against the metrics endpoint
        metricsPassword:
          type: string
          description: Password for basic auth against the metrics endpoint. Write-only; encrypted at rest and never returned.
        metricsToken:
          type: string
          description: Bearer token for the metrics endpoint. Write-only; encrypted at rest and never returned.
        metricsTlsSkipVerify:
          type: boolean
          description: Whether TLS verification of the metrics endpoint is skipped
        metricsCaCert:
          type: string
          description: Custom CA certificate PEM for the metrics endpoint
    ConnectionTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        kubernetesVersion:
          type: string
    ProjectPermissions:
