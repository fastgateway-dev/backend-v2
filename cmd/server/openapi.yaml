          properties:
            issuer:
              type: string
            authorizationURL:
              type: string
            tokenURL:
              type: string
        clientId:
          type: string
        clientSecret:
          type: string
        redirectURL:
          type: string
        logoutPath:
          type: string
        scopes:
          type: array
          items:
            type: string
        cookieDomain:
          type: string
    OIDCConfig:
      type: object
      properties:
        issuer:
          type: string
        clientId:
          type: string
        clientSecretName:
          type: string
        redirectURL:
          type: string
        logoutPath:
          type: string
        scopes:
          type: array
          items:
            type: string
        cookieDomain:
          type: string
    JWTPrincipal:
      type: object
