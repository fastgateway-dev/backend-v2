        mtlsCreatedAt:
          type: string
          format: date-time
          description: When mTLS was configured
        mtlsCreatedBy:
          type: string
          format: uuid
          description: User who configured mTLS
        mtlsCreator:
          $ref: '#/components/schemas/User'
        allowedMethods:
