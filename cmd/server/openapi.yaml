        canManageDomains:
          type: boolean
        canManageTeams:
          type: boolean
        canCreateRoutes:
          type: boolean
        canApproveRoutes:
          type: boolean
        canViewAudit:
          type: boolean
        permissions:
          type: array
          items:
            type: string
