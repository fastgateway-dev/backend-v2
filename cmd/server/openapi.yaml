  /projects/{projectId}/domains/{domainId}/import/openapi:
    post:
      tags:
        - Routes
      summary: Import routes from an OpenAPI spec
      description: |
        Parses an uploaded OpenAPI 3.0/3.1 spec and returns a list of candidate
        routes (not yet created) for the caller to review and submit individually
        via createRoute. The request body is capped at 5MB.
      operationId: importOpenAPI
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAPIImportRequest'
      responses:
        '200':
          description: Parsed routes, warnings, renames, and spec metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAPIImportResponse'
        '400':
          description: Invalid request body, invalid defaultBackend, or the spec failed to parse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '413':
          description: Spec body exceeded the 5MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
  /projects/{projectId}/domains/{domainId}/routes:
    get:
      tags:
        - Routes
      summary: List routes for domain
      operationId: listRoutes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/domainId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by team
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending_create
              - pending_update
              - pending_delete
              - approved
              - pending_deploy
              - active
              - rejected
          description: Filter by a single status value (unlike listProjectRoutes, this does not accept a comma-separated list)
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search term
        - name: searchField
          in: query
          schema:
            type: string
            enum:
              - all
              - name
              - path
              - owner
          description: Field to restrict the search term to (defaults to searching all fields)
        - name: labels
          in: query
          schema:
            type: string
          description: Label filter expression (e.g. "key=value,key2=value2") matched against the route's labels
