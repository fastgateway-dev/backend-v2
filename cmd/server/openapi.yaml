openapi: 3.0.3
info:
  title: FastGateway API
  description: API for managing Kubernetes Gateway API resources
  version: 1.0.0
  contact:
    name: FastGateway
servers:
  - url: http://localhost:8081/api/v1
    description: Local development server
tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management
  - name: Projects
    description: Project (Kubernetes cluster) management
  - name: Teams
    description: Global team management
  - name: Project Teams
    description: Team-project role assignments
  - name: Domain Templates
    description: Domain template management
  - name: Domains
    description: Domain (Gateway) management
  - name: Project Namespaces
    description: Project namespace whitelist management
  - name: Routes
    description: Route (HTTPRoute/GRPCRoute) management
  - name: Clients
    description: Global client management (API consumers)
  - name: Client Attachments
    description: Client-route attachment management
  - name: Client Approvals
    description: Stage-based approval workflow for client attachments
  - name: Approvals
    description: Approval workflow
  - name: Kubernetes
    description: Kubernetes resource discovery
  - name: Audit
    description: Audit logs
  - name: Client mTLS
    description: Client mTLS authentication management
  - name: AI
    description: AI-powered route generation and chat
  - name: Approval Policies
    description: Approval policy management (admin only)
  - name: Client Headers
    description: Client header authorization management
  - name: Client Methods
    description: Client HTTP method authorization management
  - name: SSO
    description: Single Sign-On configuration
  - name: Notifications
    description: User notifications
  - name: Health
    description: Service health check
  - name: Docs
    description: API documentation
paths:
  /docs/openapi.yaml:
    get:
      tags:
        - Docs
      summary: Get OpenAPI specification
      description: Returns the bundled OpenAPI 3.0.3 specification for the FastGateway API
      operationId: getOpenAPISpec
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OpenAPI specification in YAML format
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login with username and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout and invalidate token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user info
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/tokens:
    get:
      tags:
        - Auth
      summary: List API tokens for current user
      operationId: listApiTokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of API tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
    post:
      tags:
        - Auth
      summary: Create new API token
      operationId: createApiToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
  /auth/tokens/{tokenId}:
    delete:
      tags:
        - Auth
      summary: Revoke API token
      operationId: revokeApiToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tokenId'
      responses:
        '204':
          description: Token revoked
  /auth/password:
    put:
      tags:
        - Auth
      summary: Change password for current user
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password changed successfully
        '400':
          description: Invalid request (wrong current password or weak new password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/tokens/capabilities:
    get:
      tags:
        - Auth
      summary: Get API token capabilities
      operationId: getApiTokenCapabilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether API tokens feature is enabled
                  maxTokens:
                    type: integer
                    description: Maximum number of tokens allowed
                  currentCount:
                    type: integer
                    description: Current number of active tokens
  /my-teams:
    get:
      tags:
        - Teams
      summary: List teams the current user belongs to
      operationId: listMyTeams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user's teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
  /auth/sso/config:
    get:
      tags:
        - SSO
      summary: Get public SSO configuration
      operationId: getSSOPublicConfig
      responses:
        '200':
          description: Public SSO configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOPublicConfig'
  /auth/sso/authorize:
    get:
      tags:
        - SSO
      summary: Initiate SSO authorization flow
      description: Redirects user to the OIDC identity provider for authentication
      operationId: ssoAuthorize
      responses:
        '302':
          description: Redirect to identity provider
        '400':
          description: SSO not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/sso/callback:
    get:
      tags:
        - SSO
      summary: Handle SSO callback from identity provider
      description: Processes the callback from the OIDC identity provider and redirects to frontend with tokens
      operationId: ssoCallback
      parameters:
        - name: code
          in: query
          schema:
            type: string
          description: Authorization code from IdP
        - name: state
          in: query
          schema:
            type: string
          description: CSRF state token
        - name: error
          in: query
          schema:
            type: string
          description: Error from IdP (if any)
        - name: error_description
          in: query
          schema:
            type: string
          description: Error description from IdP
      responses:
        '302':
          description: Redirect to frontend with tokens or error
  /settings/sso:
    get:
      tags:
        - SSO
      summary: Get SSO configuration (Owner only)
      operationId: getSSOConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSO configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - SSO
      summary: Update SSO configuration (Owner only)
      operationId: updateSSOConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOConfigInput'
      responses:
        '200':
          description: SSO configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - SSO
      summary: Disable SSO (Owner only)
      operationId: disableSSO
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSO disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: SSO disabled
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications:
    get:
      tags:
        - Notifications
      summary: List notifications for current user
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: unread
          in: query
          schema:
            type: string
            enum:
              - 'true'
          description: Filter to unread notifications only
      responses:
        '200':
          description: Paginated notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/count:
    get:
      tags:
        - Notifications
      summary: Get unread notification count
      operationId: getUnreadNotificationCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notificationId}/read:
    put:
      tags:
        - Notifications
      summary: Mark notification as read
      operationId: markNotificationAsRead
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/read-all:
    put:
      tags:
        - Notifications
      summary: Mark all notifications as read
      operationId: markAllNotificationsAsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /users:
    get:
      tags:
        - Users
      summary: List all users (Owner only)
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: role
          in: query
          schema:
            type: string
            enum:
              - owner
              - user
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
    post:
      tags:
        - Users
      summary: Create new user (Owner only)
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by ID
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Users
      summary: Update user
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags:
        - Users
      summary: Delete user
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: User deleted
  /teams:
    get:
      tags:
        - Teams
      summary: List all global teams
      operationId: listTeams
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
    post:
      tags:
        - Teams
      summary: Create global team (Owner only)
      operationId: createTeam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
  /teams/{teamId}:
    get:
      tags:
        - Teams
      summary: Get team by ID
      operationId: getTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
    patch:
      tags:
        - Teams
      summary: Update team
      operationId: updateTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
    delete:
      tags:
        - Teams
      summary: Delete team
      operationId: deleteTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
      responses:
        '204':
          description: Team deleted
  /teams/{teamId}/members:
    get:
      tags:
        - Teams
      summary: List team members
      operationId: listTeamMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
      responses:
        '200':
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Teams
      summary: Add member to team
      operationId: addTeamMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTeamMemberRequest'
      responses:
        '201':
          description: Member added
  /teams/{teamId}/members/{userId}:
    delete:
      tags:
        - Teams
      summary: Remove member from team
      operationId: removeTeamMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Member removed
  /teams/{teamId}/projects:
    get:
      tags:
        - Teams
      summary: List projects a team is assigned to
      operationId: listTeamProjects
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
      responses:
        '200':
          description: List of projects the team is assigned to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTeamRole'
  /teams/{teamId}/members/email:
    post:
      tags:
        - Teams
      summary: Add member to team by email (Owner only)
      description: If user exists, adds directly. If not, creates a pending invite.
      operationId: addTeamMemberByEmail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberByEmailRequest'
      responses:
        '200':
          description: Member added or invited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddMemberResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /teams/{teamId}/invites:
    get:
      tags:
        - Teams
      summary: List pending invites for team (Owner only)
      operationId: listTeamInvites
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
      responses:
        '200':
          description: List of pending invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamEmailInvite'
  /teams/{teamId}/invites/{inviteId}:
    delete:
      tags:
        - Teams
      summary: Delete a pending invite (Owner only)
      operationId: deleteTeamInvite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teamId'
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invite deleted
  /projects:
    get:
      tags:
        - Projects
      summary: List projects
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
    post:
      tags:
        - Projects
      summary: Create new project (Owner only)
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}:
    get:
      tags:
        - Projects
      summary: Get project by ID
      operationId: getProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    patch:
      tags:
        - Projects
      summary: Update project
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      tags:
        - Projects
      summary: Delete project
      operationId: deleteProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '204':
          description: Project deleted
  /projects/{projectId}/test-connection:
    post:
      tags:
        - Projects
      summary: Test Kubernetes connection
      operationId: testProjectConnection
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
  /projects/{projectId}/capabilities:
    get:
      tags:
        - Projects
      summary: Get project capabilities
      description: Returns available features for the project based on Kubernetes cluster configuration
      operationId: getProjectCapabilities
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCapabilities'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{projectId}/permissions:
    get:
      tags:
        - Projects
      summary: Get current user permissions for project
      operationId: getProjectPermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: User permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPermissions'
  /projects/{projectId}/admins:
    get:
      tags:
        - Projects
      summary: List project admins
      operationId: listProjectAdmins
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: List of project admins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Projects
      summary: Add admin to project
      operationId: addProjectAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectAdminRequest'
      responses:
        '201':
          description: Admin added
  /projects/{projectId}/admins/{userId}:
    delete:
      tags:
        - Projects
      summary: Remove admin from project
      operationId: removeProjectAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Admin removed
  /projects/{projectId}/members:
    get:
      tags:
        - Projects
      summary: List project members
      description: Returns all users who have access to the project (admins, team members, etc.)
      operationId: listProjectMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: List of project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /projects/{projectId}/my-teams:
    get:
      tags:
        - Projects
      summary: List current user's teams in project
      operationId: listMyTeamsInProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: List of user's teams in the project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTeamRole'
  /projects/{projectId}/teams:
    get:
      tags:
        - Project Teams
      summary: List teams assigned to project
      operationId: listProjectTeams
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: List of project team roles
          content:
            application/json:
              schema:
