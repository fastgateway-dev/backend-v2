          description: Whether rate limiting is available (requires Redis backend in Envoy Gateway)
    ProjectTeamRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        presets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTeamPreset'
        effectivePermissions:
          type: array
          items:
            type: string
        team:
          $ref: '#/components/schemas/Team'
        createdAt:
          type: string
          format: date-time
    ProjectTeamPreset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectTeamRoleId:
          type: string
          format: uuid
        presetId:
          type: string
          format: uuid
        preset:
          $ref: '#/components/schemas/PermissionPreset'
        createdAt:
          type: string
          format: date-time
    AssignTeamRequest:
      type: object
      required:
        - teamId
        - presetIds
      properties:
        teamId:
          type: string
          format: uuid
        presetIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    UpdateTeamPresetsInput:
      type: object
      required:
        - presetIds
      properties:
        presetIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    Permission:
      type: string
      enum:
        - route.view
        - route.create
        - route.edit
        - route.delete
        - route.deploy
        - route.approve
        - client.view
        - client.create
        - client.edit
        - client.delete
        - client.manage_ip
        - client.manage_apikey
        - client.manage_jwt
        - client.attach
        - client.detach
        - client.approve
        - domain.view
        - domain.create
        - domain.edit
        - domain.delete
        - project.settings
        - project.teams
        - project.approval_policy
        - audit.view
    PermissionPreset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        isBuiltin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePresetRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    UpdatePresetRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    DomainTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        controllerName:
          type: string
        exposureType:
          type: string
          enum:
            - LoadBalancer
            - ClusterIP
        tlsMode:
          type: string
          enum:
            - tls_only
            - no_tls
            - both
        httpPort:
          type: integer
        httpsPort:
          type: integer
        tlsPolicy:
          type: string
          enum:
            - terminate
            - passthrough
        externalTrafficPolicy:
          type: string
          enum:
            - Cluster
            - Local
        loadBalancerClass:
          type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        podAnnotations:
          type: object
          additionalProperties:
            type: string
          description: Annotations applied to the Envoy proxy pods
        containerResources:
          $ref: '#/components/schemas/ContainerResourcesConfig'
        scalingConfig:
          $ref: '#/components/schemas/ScalingConfig'
        mergeGateways:
          type: boolean
          description: Merge all Gateways using this template into a single Envoy Deployment/Service
        telemetryAccessLog:
          $ref: '#/components/schemas/TelemetryAccessLogConfig'
        telemetryTracing:
          $ref: '#/components/schemas/TelemetryTracingConfig'
        telemetryMetrics:
          $ref: '#/components/schemas/TelemetryMetricsConfig'
        podPlacement:
          $ref: '#/components/schemas/PodPlacementConfig'
        pdbConfig:
          $ref: '#/components/schemas/PDBConfig'
        deploymentStrategy:
          $ref: '#/components/schemas/DeploymentStrategyConfig'
        status:
          type: string
          enum:
            - pending
            - active
            - error
        statusMessage:
          type: string
        k8sGatewayClassName:
          type: string
        k8sEnvoyProxyName:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DomainTemplateList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DomainTemplate'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateDomainTemplateRequest:
      type: object
      required:
        - name
        - exposureType
        - tlsMode
      properties:
        name:
          type: string
        description:
          type: string
        controllerName:
          type: string
          default: gateway.envoyproxy.io/gatewayclass-controller
        exposureType:
          type: string
          enum:
            - LoadBalancer
            - ClusterIP
        tlsMode:
