  /projects/{projectId}/routes:
    get:
      tags:
        - Routes
      summary: List routes across all domains in a project
      description: |
        Lists routes in a project, optionally filtered by backend service and
        namespace. When `backend_service` and `backend_namespace` are both set,
        only routes whose `config.backends[]` (and optionally `config.mirrors[]`
        when `include_mirrors=true`) contain a Kubernetes backend with that
        service+namespace are returned. Useful for answering "where is this
        service used?".
      operationId: listProjectRoutes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: backend_service
          in: query
          schema:
            type: string
          description: Match routes whose backends contain a Kubernetes backend with this service name. Must be paired with backend_namespace.
        - name: backend_namespace
          in: query
          schema:
            type: string
          description: Match routes whose backends contain a Kubernetes backend in this namespace. Must be paired with backend_service.
        - name: include_mirrors
          in: query
          schema:
            type: boolean
            default: false
          description: When true, also match against config.mirrors[].
        - name: status
          in: query
          schema:
            type: string
          description: Comma-separated list of statuses (pending_create, pending_update, pending_delete, approved, pending_deploy, active, rejected).
        - name: team_id
          in: query
          schema:
            type: string
            format: uuid
        - name: domain_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/page'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Paginated list of routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteList'
        '400':
          description: Invalid filter (e.g., backend_service without backend_namespace)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
