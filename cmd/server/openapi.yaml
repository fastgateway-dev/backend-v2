    ContainerResourcesConfig:
      type: object
      description: Container resource requests and limits for the Envoy proxy container
      properties:
        requests:
          $ref: '#/components/schemas/ResourceValues'
        limits:
          $ref: '#/components/schemas/ResourceValues'
    ResourceValues:
      type: object
      description: CPU and memory quantities (Kubernetes resource quantity strings, e.g. "500m", "256Mi")
      properties:
        cpu:
          type: string
        memory:
          type: string
    ScalingConfig:
      type: object
      description: Scaling configuration - fixed replica count, or HPA-managed
      properties:
        type:
          type: string
          enum:
            - fixed
            - hpa
        replicas:
          type: integer
          format: int32
          description: Replica count when type=fixed
        minReplicas:
          type: integer
          format: int32
          description: Minimum replicas when type=hpa
        maxReplicas:
          type: integer
          format: int32
          description: Maximum replicas when type=hpa
    TelemetryAccessLogConfig:
      type: object
      description: Access log configuration (spec.telemetry.accessLog)
      properties:
        format:
          $ref: '#/components/schemas/TelemetryAccessLogFormat'
        sink:
          $ref: '#/components/schemas/TelemetryAccessLogSink'
    TelemetryAccessLogFormat:
      type: object
      description: Access log format - the type-specific body is populated based on "type"
      properties:
        type:
          type: string
          enum:
            - text
            - json
            - disabled
        text:
          type: string
          description: Log format text template (present when type=text)
        json:
          type: object
          additionalProperties:
            type: string
          description: Log format JSON field map (present when type=json)
    TelemetryAccessLogSink:
      type: object
      description: Access log sink - the type-specific body is populated based on "type"
      properties:
        type:
          type: string
          enum:
            - file
            - otel
        file:
          $ref: '#/components/schemas/TelemetryAccessLogFileSink'
        otel:
          $ref: '#/components/schemas/TelemetryAccessLogOTelSink'
    TelemetryAccessLogFileSink:
      type: object
      description: File sink body (present when sink type=file)
      properties:
        path:
          type: string
          description: Must be /dev/stdout or /dev/stderr
    TelemetryAccessLogOTelSink:
      type: object
      description: OpenTelemetry sink body referencing an in-cluster Service (present when sink type=otel)
      properties:
        namespace:
          type: string
        service:
          type: string
        port:
          type: integer
          format: int32
    TelemetryTracingConfig:
      type: object
      description: Tracing configuration (spec.telemetry.tracing)
      properties:
        samplingRate:
          type: number
          format: double
        provider:
          $ref: '#/components/schemas/TelemetryServiceRef'
        customTags:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryTracingTag'
    TelemetryServiceRef:
      type: object
      description: Reference to an in-cluster Kubernetes Service
      properties:
        namespace:
          type: string
        service:
          type: string
        port:
          type: integer
          format: int32
    TelemetryTracingTag:
      type: object
      description: One custom tracing tag. "value" is populated when type=literal; "header" (and optional "defaultValue") when type=requestHeader.
      properties:
        type:
          type: string
          enum:
            - literal
            - requestHeader
        tag:
          type: string
        value:
          type: string
        header:
          type: string
        defaultValue:
          type: string
    TelemetryMetricsConfig:
      type: object
      description: Metrics configuration (spec.telemetry.metrics)
      properties:
        prometheus:
          $ref: '#/components/schemas/TelemetryPrometheusConfig'
        enableVirtualHostStats:
          type: boolean
        enablePerEndpointStats:
          type: boolean
        sinks:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryMetricsSink'
    TelemetryPrometheusConfig:
      type: object
      properties:
        disable:
          type: boolean
    TelemetryMetricsSink:
      type: object
      description: An additional metrics sink. Currently only "openTelemetry" is supported, with at most one entry.
      properties:
        type:
          type: string
          enum:
            - openTelemetry
        namespace:
          type: string
        service:
          type: string
        port:
          type: integer
          format: int32
    PodPlacementConfig:
      type: object
      properties:
        nodeSelector:
          type: object
          additionalProperties:
            type: string
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/TolerationConfig'
        topologySpreadConstraints:
          type: array
          items:
            $ref: '#/components/schemas/TopologySpreadConstraintConfig'
        priorityClassName:
          type: string
    TolerationConfig:
      type: object
      properties:
        key:
          type: string
        operator:
          type: string
        value:
          type: string
        effect:
          type: string
        tolerationSeconds:
          type: integer
          format: int64
    TopologySpreadConstraintConfig:
      type: object
      properties:
        maxSkew:
          type: integer
          format: int32
        topologyKey:
          type: string
        whenUnsatisfiable:
          type: string
    PDBConfig:
      type: object
      description: PodDisruptionBudget configuration - exactly one of minAvailable/maxUnavailable, selected by "kind"
      properties:
        kind:
          type: string
          enum:
            - minAvailable
            - maxUnavailable
        value:
          type: string
          description: Absolute number or percentage (e.g. "1", "50%")
    DeploymentStrategyConfig:
      type: object
      properties:
        type:
          type: string
          enum:
            - RollingUpdate
            - Recreate
        rollingUpdate:
          $ref: '#/components/schemas/RollingUpdateConfig'
    RollingUpdateConfig:
      type: object
      description: Present when type=RollingUpdate; omitted sub-fields let Kubernetes defaults apply
      properties:
        maxSurge:
          type: string
          description: Absolute number or percentage (e.g. "1", "25%")
        maxUnavailable:
          type: string
          description: Absolute number or percentage (e.g. "1", "25%")
    ProjectNamespace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        namespace:
          type: string
        capabilities:
          type: array
          description: Roles this namespace can play in the project.
          items:
            $ref: '#/components/schemas/NamespaceCapability'
        referenceGrantCreated:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectNamespaceRequest:
      type: object
      required:
        - namespace
        - capabilities
      properties:
        namespace:
          type: string
        capabilities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NamespaceCapability'
    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        domainTemplateId:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        httpPort:
          type: integer
        httpsPort:
          type: integer
        tlsMode:
          type: string
          enum:
            - tls_only
            - no_tls
            - both
        tlsSecretName:
          type: string
        tlsSecretNamespace:
          type: string
          description: Kubernetes namespace containing the TLS secret (defaults to the project's managed namespace)
        tlsPolicy:
          type: string
          enum:
            - terminate
            - passthrough
        namespace:
          type: string
          description: Kubernetes namespace for gateway resources
        k8sGatewayName:
          type: string
          description: Name of the Kubernetes Gateway resource
        k8sGatewayClassName:
          type: string
          description: Name of the GatewayClass
        status:
          type: string
          enum:
            - pending
            - active
            - error
        statusMessage:
          type: string
        createdBy:
          type: string
          format: uuid
        routeCount:
          type: integer
        labels:
          $ref: '#/components/schemas/Labels'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DomainList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateDomainRequest:
      type: object
      required:
        - name
        - hostname
        - domainTemplateId
      properties:
        name:
          type: string
        hostname:
          type: string
        domainTemplateId:
          type: string
          format: uuid
        tlsSecretName:
          type: string
        tlsSecretNamespace:
          type: string
          description: Kubernetes namespace containing the TLS secret. Must be managed by the project unless it is the default FastGateway namespace.
        namespace:
          type: string
          description: Kubernetes namespace to deploy the domain's gateway resources into. Defaults to the default FastGateway namespace; any other value must be registered for this project.
        labels:
          $ref: '#/components/schemas/Labels'
    UpdateDomainRequest:
      type: object
      properties:
        name:
          type: string
        tlsSecretName:
          type: string
        tlsSecretNamespace:
          type: string
          description: Kubernetes namespace containing the TLS secret. Must be managed by the project unless it is the default FastGateway namespace.
        labels:
          $ref: '#/components/schemas/Labels'
    DomainSettings:
      type: object
      description: |
        Domain-level settings (gateway-agnostic configuration), plus the domain's
        BackendTrafficPolicy and EnvoyExtensionPolicy configuration. Always returned
        as an object; fields are omitted (not null) when not configured.
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/DomainSettingsConfig'
        backendTrafficPolicy:
          $ref: '#/components/schemas/BackendTrafficPolicyConfig'
        extensionPolicy:
          $ref: '#/components/schemas/EnvoyExtensionPolicyConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DomainSettingsRecord:
      type: object
      description: Stored domain settings record, as returned directly by the mTLS CA endpoints (no BackendTrafficPolicy/EnvoyExtensionPolicy attached).
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/DomainSettingsConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateDomainSettingsResponse:
      type: object
      nullable: true
      description: |
        Domain settings written by updateDomainSettings, with any operator-facing
        warnings generated while applying the change (e.g. mTLS enabled with no CA
        configured). Null when the update disabled every CTP/BTP/extension setting
        for this domain.
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/DomainSettingsConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal, operator-facing warnings generated while writing the settings
    DomainSettingsConfig:
      type: object
      description: Gateway-agnostic domain configuration
      properties:
        clientConnection:
          $ref: '#/components/schemas/ClientConnectionConfig'
        clientIPDetection:
          $ref: '#/components/schemas/ClientIPDetectionConfig'
        timeout:
          $ref: '#/components/schemas/DomainTimeoutConfig'
        http3:
          $ref: '#/components/schemas/HTTP3Config'
        tls:
          $ref: '#/components/schemas/TLSSettingsConfig'
        mtls:
          $ref: '#/components/schemas/DomainMTLSConfig'
    ClientConnectionConfig:
      type: object
      description: Client connection settings
      properties:
        tcpKeepalive:
          $ref: '#/components/schemas/TCPKeepaliveConfig'
        proxyProtocol:
          $ref: '#/components/schemas/ProxyProtocolConfig'
        connectionLimit:
          $ref: '#/components/schemas/ConnectionLimitConfig'
        bufferLimit:
          type: string
          description: Buffer size limit (e.g., "32Ki")
    TCPKeepaliveConfig:
      type: object
      description: TCP keepalive configuration for downstream client connections
      properties:
        probes:
          type: integer
          format: int32
          description: Maximum number of keepalive probes before considering the connection dead
          example: 3
        idleTime:
          type: string
          description: Duration of idle time before keepalive probes start (e.g., "60s")
          example: 60s
        interval:
          type: string
          description: Duration between keepalive probes (e.g., "10s")
          example: 10s
    ClientIPDetectionConfig:
      type: object
      description: Client IP detection configuration for extracting client IP from HTTP headers
      properties:
        xForwardedFor:
          $ref: '#/components/schemas/XForwardedForConfig'
        customHeader:
          $ref: '#/components/schemas/CustomHeaderConfig'
    XForwardedForConfig:
      type: object
      description: Extract client IP from X-Forwarded-For header
      required:
        - numTrustedHops
      properties:
        numTrustedHops:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of trusted proxy hops in the XFF chain
    CustomHeaderConfig:
      type: object
      description: Extract client IP from a custom header
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the header containing client IP (e.g., CF-Connecting-IP)
        failClosed:
          type: boolean
          default: false
          description: Reject requests if the header is missing
    UpdateDomainSettingsRequest:
      type: object
      description: Request to update domain settings. Omit or null fields to disable features.
      properties:
        clientConnection:
          $ref: '#/components/schemas/ClientConnectionConfig'
        clientIPDetection:
          $ref: '#/components/schemas/ClientIPDetectionConfig'
        timeout:
          $ref: '#/components/schemas/DomainTimeoutConfig'
        http3:
          $ref: '#/components/schemas/HTTP3Config'
        tls:
          $ref: '#/components/schemas/TLSSettingsConfig'
        mtls:
          $ref: '#/components/schemas/DomainMTLSConfig'
        backendTrafficPolicy:
          $ref: '#/components/schemas/BackendTrafficPolicyConfig'
        extensionPolicy:
          $ref: '#/components/schemas/EnvoyExtensionPolicyConfig'
    ProxyProtocolConfig:
      type: object
      description: Proxy protocol configuration
      properties:
        enabled:
          type: boolean
          description: Enable proxy protocol
    ConnectionLimitConfig:
      type: object
      description: Connection limit configuration
      properties:
        maxConnections:
          type: integer
          description: Maximum number of connections
        closeDelay:
          type: string
          description: Delay before closing connections (e.g., "5s")
        maxConnectionDuration:
          type: string
          description: Maximum connection duration (e.g., "1h")
        maxRequestsPerConnection:
          type: integer
          description: Maximum requests per connection
    DomainTimeoutConfig:
      type: object
      description: Domain-level timeout configuration
      properties:
        http:
          $ref: '#/components/schemas/HTTPDomainTimeoutConfig'
    HTTPDomainTimeoutConfig:
      type: object
      description: HTTP timeout settings
      properties:
        requestReceivedTimeout:
          type: string
          description: Timeout for receiving the complete request (e.g., "30s")
        idleTimeout:
          type: string
          description: Idle connection timeout (e.g., "120s")
    HTTP3Config:
      type: object
      description: HTTP/3 configuration
      properties:
        enabled:
          type: boolean
          description: Enable HTTP/3
    TLSSettingsConfig:
      type: object
      description: TLS settings configuration
      properties:
        minVersion:
          type: string
          enum:
            - TLS1.0
            - TLSv1.0
            - TLS1.1
            - TLSv1.1
            - TLS1.2
            - TLSv1.2
            - TLS1.3
            - TLSv1.3
            - Auto
            - ''
          description: Minimum TLS version
        maxVersion:
          type: string
          enum:
            - TLS1.0
            - TLSv1.0
            - TLS1.1
            - TLSv1.1
            - TLS1.2
            - TLSv1.2
            - TLS1.3
            - TLSv1.3
            - Auto
            - ''
          description: Maximum TLS version
        ciphers:
          type: array
          items:
            type: string
          description: TLS cipher suites
        ecdhCurves:
          type: array
          items:
            type: string
          description: ECDH curves
        signatureAlgorithms:
          type: array
          items:
            type: string
          description: Signature algorithms
    DomainMTLSConfig:
      type: object
      description: Domain-level mTLS configuration
      properties:
        enabled:
          type: boolean
          description: Enable mTLS
        optional:
          type: boolean
          description: Make client certificate optional
        caCerts:
          type: array
          items:
            $ref: '#/components/schemas/MTLSCACert'
          description: CA certificates for client verification
        sanWhitelist:
          type: array
          items:
            $ref: '#/components/schemas/MTLSSANEntry'
          description: Subject Alternative Name whitelist
        hashWhitelist:
          type: array
          items:
            type: string
          description: Certificate hash whitelist
    MTLSCACert:
      type: object
      description: mTLS CA certificate reference
      properties:
        id:
          type: string
        name:
          type: string
          description: CA certificate display name
        secretName:
          type: string
          description: K8s Secret name containing the CA cert
        secretKey:
          type: string
          description: Key within the Secret
    MTLSSANEntry:
      type: object
      description: Subject Alternative Name entry
      properties:
        type:
          type: string
          enum:
            - DNS
            - URI
          description: SAN type
        value:
          type: string
          description: SAN value
    AddDomainMTLSCARequest:
      type: object
      required:
        - caPem
        - name
      description: Request to add CA certificate for domain mTLS
      properties:
        caPem:
          type: string
          description: CA certificate PEM content
        name:
          type: string
          description: Display name for the CA
    DomainYAMLs:
      type: object
      properties:
        gatewayYaml:
          type: string
        clientTrafficPolicyYaml:
          type: string
        backendTrafficPolicyYaml:
          type: string
        envoyExtensionPolicyYaml:
          type: string
    DomainSettingsPreviewInput:
      type: object
      properties:
        clientConnection:
          $ref: '#/components/schemas/ClientConnectionConfig'
