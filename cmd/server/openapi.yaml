              - POST
              - PUT
              - DELETE
              - PATCH
              - HEAD
              - OPTIONS
          description: Allowed HTTP methods for authorization
        headers:
          type: array
          items:
            $ref: '#/components/schemas/ClientHeader'
          description: Header authorization rules
        createdBy:
          type: string
          format: uuid
        team:
          $ref: '#/components/schemas/Team'
        creator:
          $ref: '#/components/schemas/User'
        apiKeyCreator:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
