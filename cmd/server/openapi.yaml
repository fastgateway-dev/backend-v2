        labels:
          $ref: '#/components/schemas/Labels'
        createdAt:
          type: string
          description: Secret creation timestamp (RFC3339), empty if unknown
    ListTLSSecretsResponse:
      type: object
      description: TLS secrets available in a namespace, plus the namespaces available to look up
      properties:
        namespace:
          type: string
          description: Namespace the secrets were listed from
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/TLSSecretInfo'
        availableNamespaces:
          type: array
          items:
            type: string
          description: Namespaces eligible for domain/TLS secret deployment in this project
    AvailableNamespacesResponse:
      type: object
      properties:
        namespaces:
          type: array
          items:
            type: string
          description: Namespaces eligible for domain deployment in this project
    Route:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        team:
          $ref: '#/components/schemas/Team'
        name:
          type: string
        description:
          type: string
        protocol:
          type: string
          enum:
            - http
            - grpc
        status:
          type: string
          enum:
            - pending_create
            - pending_update
            - pending_delete
            - approved
            - pending_deploy
            - active
            - rejected
        config:
          $ref: '#/components/schemas/RouteConfig'
        securityMode:
          $ref: '#/components/schemas/SecurityMode'
        pendingApproval:
          $ref: '#/components/schemas/Approval'
        clientCount:
          type: integer
          description: Number of clients attached to this route
        securityStatus:
          type: string
          description: Security status summary
        createdBy:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        labels:
          $ref: '#/components/schemas/Labels'
    RouteList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        pagination:
          $ref: '#/components/schemas/Pagination'
    RouteConfig:
      type: object
      properties:
        routeType:
          type: string
          enum:
            - backend
            - redirect
            - directResponse
          default: backend
        matches:
          type: array
          items:
            $ref: '#/components/schemas/RouteMatch'
        backends:
          type: array
          items:
            $ref: '#/components/schemas/RouteBackend'
        mirrors:
          type: array
          items:
            $ref: '#/components/schemas/MirrorBackend'
          description: Mirror destinations for request mirroring (traffic shadowing)
        redirect:
          $ref: '#/components/schemas/RedirectConfig'
        directResponse:
          $ref: '#/components/schemas/DirectResponseConfig'
        requestHeaderModifier:
          $ref: '#/components/schemas/HeaderModifier'
        responseHeaderModifier:
          $ref: '#/components/schemas/HeaderModifier'
        urlRewrite:
          $ref: '#/components/schemas/URLRewrite'
        defaultTrafficPolicy:
          type: string
          enum:
            - allow_all
            - deny
            - require_ip_allowlist
          description: How non-client traffic is handled when clients are attached
        defaultAllowedCIDRs:
          type: array
          items:
            type: string
          description: CIDRs allowed when defaultTrafficPolicy is require_ip_allowlist
    GRPCMethodMatch:
      type: object
      properties:
        type:
          type: string
          enum:
            - Exact
            - RegularExpression
          default: Exact
          description: How to match the service or method name
        value:
          type: string
          description: gRPC service or method name to match
    RouteMatch:
      type: object
      properties:
        path:
          type: object
          properties:
            type:
              type: string
              enum:
                - Exact
                - Prefix
                - RegularExpression
            value:
              type: string
        headers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                  - Exact
                  - RegularExpression
              value:
                type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - HEAD
            - OPTIONS
        queryParams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                  - Exact
                  - RegularExpression
              value:
                type: string
        grpcService:
          $ref: '#/components/schemas/GRPCMethodMatch'
          description: gRPC service name matcher (only for protocol=grpc)
        grpcMethod:
          $ref: '#/components/schemas/GRPCMethodMatch'
          description: gRPC method name matcher (only for protocol=grpc)
    RouteBackend:
      type: object
      required:
        - port
      properties:
        type:
          type: string
          enum:
            - kubernetes
            - external
          default: kubernetes
        service:
          type: string
          description: Service name (for kubernetes type)
        namespace:
          type: string
          description: Namespace (for kubernetes type)
        port:
          type: integer
        weight:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
          description: Weight for traffic splitting (ignored for fallback backends)
        fallback:
          type: boolean
          default: false
          description: If true, this backend only receives traffic when primary backends are unhealthy
        addressType:
          type: string
          enum:
            - fqdn
            - ip
          description: Address type (for external type)
        address:
          type: string
          description: FQDN or IP address (for external type)
        tls:
          $ref: '#/components/schemas/BackendTLSConfig'
          description: TLS configuration (only valid for external backends)
    MirrorBackend:
      type: object
      required:
        - service
        - port
      description: Mirror destination for request mirroring (traffic shadowing)
      properties:
        type:
          type: string
          enum:
            - kubernetes
          default: kubernetes
          description: Backend type (currently only kubernetes is supported)
        service:
          type: string
          description: Service name in the target namespace
        namespace:
          type: string
          description: Namespace of the target service
        port:
          type: integer
          description: Port number of the target service
    BackendTLSConfig:
      type: object
      required:
        - caCertificateRefs
      description: TLS configuration for external backends. Simple TLS requires only caCertificateRefs. mTLS additionally requires clientCertificateRef.
      properties:
        clientCertificateRef:
          $ref: '#/components/schemas/SecretRef'
          description: Client certificate for mTLS (optional - if set, enables mTLS)
        caCertificateRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CertificateRef'
          description: CA certificates for verifying backend (required for TLS)
    SecretRef:
      type: object
      required:
        - name
      description: Reference to a Kubernetes Secret
      properties:
        name:
          type: string
          description: Name of the Secret
        namespace:
          type: string
          description: Namespace of the Secret (defaults to fastgateway-system)
    CertificateRef:
      type: object
      required:
        - kind
        - name
      description: Reference to a Kubernetes Secret or ConfigMap containing certificates
      properties:
        kind:
          type: string
          enum:
            - Secret
            - ConfigMap
          description: Kind of the resource
        name:
          type: string
          description: Name of the resource
        namespace:
          type: string
          description: Namespace of the resource (defaults to fastgateway-system)
    RedirectConfig:
      type: object
      properties:
        scheme:
          type: string
          enum:
            - http
            - https
        hostname:
          type: string
        port:
          type: integer
        statusCode:
          type: integer
          enum:
            - 301
            - 302
          default: 302
        path:
          $ref: '#/components/schemas/PathRewrite'
    DirectResponseConfig:
      type: object
      required:
        - statusCode
      description: Direct response configuration - return a static response without forwarding to backend
      properties:
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code to return
        contentType:
          type: string
          description: Content-Type header value (e.g., "text/plain", "application/json")
        body:
          $ref: '#/components/schemas/DirectResponseBody'
    DirectResponseBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Inline
            - ValueRef
          description: Body type - Inline for direct content, ValueRef for ConfigMap reference
        inline:
          type: string
          maxLength: 4096
          description: Inline body content (max 4096 bytes)
    HeaderModifier:
      type: object
      properties:
        set:
          type: array
          items:
            $ref: '#/components/schemas/HeaderValue'
        add:
          type: array
          items:
            $ref: '#/components/schemas/HeaderValue'
        remove:
          type: array
          items:
            type: string
    HeaderValue:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
    URLRewrite:
      type: object
      properties:
        hostname:
          type: string
        path:
          $ref: '#/components/schemas/PathRewrite'
    PathRewrite:
      type: object
      properties:
        type:
          type: string
          enum:
            - ReplacePrefixMatch
            - ReplaceFullPath
        replacePrefixMatch:
          type: string
        replaceFullPath:
          type: string
    CreateRouteRequest:
      type: object
