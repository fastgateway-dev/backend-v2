        jwtIssuer:
          type: string
          description: JWT issuer URL
        jwtJwksUrl:
          type: string
          description: URL to fetch JWKS for JWT validation
        jwtAudiences:
          type: array
          items:
            type: string
          description: Expected JWT audience values
        jwtRequiredClaims:
          type: array
          items:
            $ref: '#/components/schemas/JWTRequiredClaim'
          description: Required JWT claims for authorization
        jwtClaimToHeaders:
          type: array
          items:
            $ref: '#/components/schemas/JWTClaimToHeader'
          description: JWT claims to map to HTTP headers
        jwtCreatedAt:
          type: string
          format: date-time
