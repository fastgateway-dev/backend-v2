        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RouteList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        pagination:
          $ref: '#/components/schemas/Pagination'
    RouteConfig:
      type: object
      properties:
        routeType:
          type: string
          enum:
            - backend
            - redirect
            - directResponse
          default: backend
        matches:
          type: array
          items:
            $ref: '#/components/schemas/RouteMatch'
        backends:
          type: array
          items:
            $ref: '#/components/schemas/RouteBackend'
        mirrors:
          type: array
          items:
            $ref: '#/components/schemas/MirrorBackend'
          description: Mirror destinations for request mirroring (traffic shadowing)
        redirect:
          $ref: '#/components/schemas/RedirectConfig'
        directResponse:
          $ref: '#/components/schemas/DirectResponseConfig'
        requestHeaderModifier:
          $ref: '#/components/schemas/HeaderModifier'
        responseHeaderModifier:
          $ref: '#/components/schemas/HeaderModifier'
        urlRewrite:
          $ref: '#/components/schemas/URLRewrite'
        defaultTrafficPolicy:
          type: string
          enum:
            - allow_all
            - deny
            - require_ip_allowlist
          description: How non-client traffic is handled when clients are attached
        defaultAllowedCIDRs:
          type: array
          items:
            type: string
          description: CIDRs allowed when defaultTrafficPolicy is require_ip_allowlist
    GRPCMethodMatch:
      type: object
      properties:
        type:
          type: string
          enum:
            - Exact
            - RegularExpression
          default: Exact
          description: How to match the service or method name
        value:
          type: string
          description: gRPC service or method name to match
    RouteMatch:
      type: object
      properties:
        path:
          type: object
          properties:
            type:
              type: string
              enum:
                - Exact
                - Prefix
                - RegularExpression
            value:
              type: string
        headers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                  - Exact
                  - RegularExpression
              value:
                type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - HEAD
            - OPTIONS
        queryParams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                  - Exact
                  - RegularExpression
              value:
                type: string
        grpcService:
          $ref: '#/components/schemas/GRPCMethodMatch'
          description: gRPC service name matcher (only for protocol=grpc)
        grpcMethod:
          $ref: '#/components/schemas/GRPCMethodMatch'
          description: gRPC method name matcher (only for protocol=grpc)
    RouteBackend:
      type: object
      required:
        - port
      properties:
        type:
          type: string
          enum:
            - kubernetes
            - external
          default: kubernetes
        service:
          type: string
          description: Service name (for kubernetes type)
        namespace:
          type: string
          description: Namespace (for kubernetes type)
        port:
          type: integer
        weight:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
          description: Weight for traffic splitting (ignored for fallback backends)
        fallback:
          type: boolean
          default: false
          description: If true, this backend only receives traffic when primary backends are unhealthy
        addressType:
          type: string
          enum:
            - fqdn
            - ip
          description: Address type (for external type)
        address:
          type: string
          description: FQDN or IP address (for external type)
        tls:
          $ref: '#/components/schemas/BackendTLSConfig'
          description: TLS configuration (only valid for external backends)
    MirrorBackend:
      type: object
      required:
        - service
        - port
      description: Mirror destination for request mirroring (traffic shadowing)
      properties:
        type:
          type: string
          enum:
            - kubernetes
          default: kubernetes
          description: Backend type (currently only kubernetes is supported)
        service:
          type: string
          description: Service name in the target namespace
        namespace:
          type: string
          description: Namespace of the target service
        port:
          type: integer
          description: Port number of the target service
    BackendTLSConfig:
      type: object
      required:
        - caCertificateRefs
      description: TLS configuration for external backends. Simple TLS requires only caCertificateRefs. mTLS additionally requires clientCertificateRef.
      properties:
        clientCertificateRef:
          $ref: '#/components/schemas/SecretRef'
          description: Client certificate for mTLS (optional - if set, enables mTLS)
        caCertificateRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CertificateRef'
          description: CA certificates for verifying backend (required for TLS)
    SecretRef:
      type: object
      required:
        - name
      description: Reference to a Kubernetes Secret
      properties:
        name:
          type: string
          description: Name of the Secret
        namespace:
          type: string
          description: Namespace of the Secret (defaults to fastgateway-system)
    CertificateRef:
      type: object
      required:
        - kind
        - name
      description: Reference to a Kubernetes Secret or ConfigMap containing certificates
      properties:
        kind:
          type: string
          enum:
            - Secret
            - ConfigMap
          description: Kind of the resource
        name:
          type: string
          description: Name of the resource
        namespace:
          type: string
          description: Namespace of the resource (defaults to fastgateway-system)
    RedirectConfig:
      type: object
      properties:
        scheme:
          type: string
          enum:
            - http
            - https
        hostname:
          type: string
        port:
          type: integer
        statusCode:
          type: integer
          enum:
            - 301
            - 302
          default: 302
        path:
          $ref: '#/components/schemas/PathRewrite'
    DirectResponseConfig:
      type: object
      required:
        - statusCode
      description: Direct response configuration - return a static response without forwarding to backend
      properties:
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code to return
        contentType:
          type: string
          description: Content-Type header value (e.g., "text/plain", "application/json")
        body:
          $ref: '#/components/schemas/DirectResponseBody'
    DirectResponseBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Inline
            - ValueRef
          description: Body type - Inline for direct content, ValueRef for ConfigMap reference
        inline:
          type: string
          maxLength: 4096
          description: Inline body content (max 4096 bytes)
    HeaderModifier:
      type: object
      properties:
        set:
          type: array
          items:
            $ref: '#/components/schemas/HeaderValue'
        add:
          type: array
          items:
            $ref: '#/components/schemas/HeaderValue'
        remove:
          type: array
          items:
            type: string
    HeaderValue:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
    URLRewrite:
      type: object
      properties:
        hostname:
          type: string
        path:
          $ref: '#/components/schemas/PathRewrite'
    PathRewrite:
      type: object
      properties:
        type:
          type: string
          enum:
            - ReplacePrefixMatch
            - ReplaceFullPath
        replacePrefixMatch:
          type: string
        replaceFullPath:
          type: string
    CreateRouteRequest:
      type: object
      required:
        - name
        - teamId
        - config
      properties:
        name:
          type: string
        description:
          type: string
        protocol:
          type: string
          enum:
            - http
            - grpc
          default: http
        teamId:
          type: string
          format: uuid
        config:
          $ref: '#/components/schemas/RouteConfig'
        securityMode:
          $ref: '#/components/schemas/SecurityMode'
        securityPolicy:
          $ref: '#/components/schemas/SecurityPolicyInput'
        backendTrafficPolicy:
          $ref: '#/components/schemas/BackendTrafficPolicyInput'
        extensionPolicy:
          $ref: '#/components/schemas/EnvoyExtensionPolicyInput'
        wafPolicy:
          $ref: '#/components/schemas/WafPolicyConfig'
        changeDescription:
          type: string
          description: Optional description of the changes for approval
        aiReview:
          $ref: '#/components/schemas/AIReviewResult'
    UpdateRouteRequest:
      type: object
      properties:
        description:
          type: string
        config:
          $ref: '#/components/schemas/RouteConfig'
        securityPolicy:
          $ref: '#/components/schemas/SecurityPolicyInput'
        backendTrafficPolicy:
          $ref: '#/components/schemas/BackendTrafficPolicyInput'
        extensionPolicy:
          $ref: '#/components/schemas/EnvoyExtensionPolicyInput'
        wafPolicy:
          $ref: '#/components/schemas/WafPolicyConfig'
        changeDescription:
          type: string
          description: Optional description of the changes for approval
        aiReview:
          $ref: '#/components/schemas/AIReviewResult'
    SecurityPolicyInput:
      type: object
      properties:
        cors:
          $ref: '#/components/schemas/CORSConfig'
        ipAllowlist:
          type: array
          items:
            $ref: '#/components/schemas/IPAllowlistEntry'
          description: Direct IP allowlist entries to configure on the route
        authorization:
          type: object
          properties:
            allowedCIDRs:
              type: array
              items:
                type: string
        apiKeyAuth:
          type: object
          properties:
            secretName:
              type: string
            headerName:
              type: string
        jwt:
          type: object
          properties:
            issuer:
              type: string
            jwksUrl:
              type: string
            audiences:
              type: array
              items:
                type: string
            claimToHeaders:
              type: array
              items:
                type: object
                properties:
                  claim:
                    type: string
                  header:
                    type: string
        oidc:
          type: object
          properties:
            issuer:
              type: string
            clientId:
              type: string
            clientSecretName:
              type: string
            redirectURL:
              type: string
            logoutPath:
              type: string
            scopes:
              type: array
              items:
                type: string
            cookieDomain:
              type: string
        extAuth:
          $ref: '#/components/schemas/ExtAuthConfig'
    SecurityMode:
      type: string
      enum:
        - general
        - client
      description: Security configuration mode. 'general' configures security directly on the route. 'client' uses client attachments.
    RouteYAMLsResponse:
      type: object
      required:
        - httpRouteYaml
      properties:
        httpRouteYaml:
          type: string
          description: HTTPRoute Kubernetes YAML
        securityPolicyYaml:
          type: string
          description: SecurityPolicy Kubernetes YAML (if configured)
        backendTrafficPolicyYaml:
          type: string
          description: BackendTrafficPolicy Kubernetes YAML (if configured)
        envoyExtensionPolicyYaml:
          type: string
          description: EnvoyExtensionPolicy Kubernetes YAML (if configured)
        backendYaml:
          type: string
          description: Backend CRD Kubernetes YAML for external service backends (if configured)
    PreviewCreateResponse:
      type: object
      required:
        - proposedYaml
      properties:
        proposedYaml:
          type: string
          description: Proposed HTTPRoute YAML
        proposedSecurityPolicyYaml:
          type: string
          description: Proposed SecurityPolicy YAML (if configured)
        proposedBackendTrafficPolicyYaml:
          type: string
          description: Proposed BackendTrafficPolicy YAML (if configured)
        proposedBackendYaml:
          type: string
          description: Proposed Backend CRD YAML for external service backends (if configured)
        proposedEnvoyExtensionPolicyYaml:
          type: string
          description: Proposed EnvoyExtensionPolicy YAML for Lua/Wasm extensions (if configured)
    PreviewUpdateResponse:
      type: object
      required:
        - currentYaml
        - proposedYaml
      properties:
        currentYaml:
          type: string
          description: Current HTTPRoute YAML
        proposedYaml:
          type: string
          description: Proposed HTTPRoute YAML
        currentSecurityPolicyYaml:
          type: string
          description: Current SecurityPolicy YAML (if exists)
        proposedSecurityPolicyYaml:
          type: string
          description: Proposed SecurityPolicy YAML (if configured)
        currentBackendTrafficPolicyYaml:
          type: string
          description: Current BackendTrafficPolicy YAML (if exists)
        proposedBackendTrafficPolicyYaml:
          type: string
          description: Proposed BackendTrafficPolicy YAML (if configured)
        currentBackendYaml:
          type: string
          description: Current Backend CRD YAML for external service backends (if exists)
        proposedBackendYaml:
          type: string
          description: Proposed Backend CRD YAML for external service backends (if configured)
        currentEnvoyExtensionPolicyYaml:
          type: string
          description: Current EnvoyExtensionPolicy YAML (if exists)
        proposedEnvoyExtensionPolicyYaml:
          type: string
          description: Proposed EnvoyExtensionPolicy YAML for Lua/Wasm extensions (if configured)
    PreviewDeleteResponse:
      type: object
      required:
        - currentYaml
      properties:
        currentYaml:
          type: string
          description: Current HTTPRoute YAML (will be deleted)
        currentSecurityPolicyYaml:
          type: string
          description: Current SecurityPolicy YAML (will be deleted if exists)
        currentBackendTrafficPolicyYaml:
          type: string
          description: Current BackendTrafficPolicy YAML (will be deleted if exists)
        currentBackendYaml:
          type: string
          description: Current Backend CRD YAML for external service backends (will be deleted if exists)
        currentEnvoyExtensionPolicyYaml:
          type: string
          description: Current EnvoyExtensionPolicy YAML (will be deleted if exists)
    SecurityPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        config:
          $ref: '#/components/schemas/SecurityPolicyConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SecurityPolicyConfig:
      type: object
      properties:
        cors:
          $ref: '#/components/schemas/CORSConfig'
        authorization:
          $ref: '#/components/schemas/AuthorizationConfig'
        apiKeyAuth:
          $ref: '#/components/schemas/APIKeyAuthStoredConfig'
        basicAuth:
          $ref: '#/components/schemas/BasicAuthConfig'
        jwt:
          $ref: '#/components/schemas/JWTStoredConfig'
        oidc:
          $ref: '#/components/schemas/OIDCStoredConfig'
        extAuth:
          $ref: '#/components/schemas/ExtAuthConfig'
    IPAllowlistEntry:
      type: object
      required:
        - cidr
      properties:
        cidr:
          type: string
          description: IP address or CIDR range (e.g., 10.0.0.1/32)
        description:
          type: string
          description: Optional description for this IP entry
    AuthorizationConfig:
      type: object
      description: Authorization configuration computed at deploy time from active client attachments
      properties:
        defaultAction:
          type: string
          enum:
            - Deny
          description: Default action when IP allowlisting is enabled
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationRule'
    AuthorizationRule:
      type: object
      properties:
        action:
          type: string
          enum:
            - Allow
        principal:
          $ref: '#/components/schemas/AuthorizationPrincipal'
    AuthorizationPrincipal:
      type: object
      properties:
        clientCIDRs:
          type: array
          items:
            type: string
          description: List of client CIDRs allowed
        jwt:
          $ref: '#/components/schemas/JWTPrincipal'
    CORSConfig:
      type: object
      properties:
        allowOrigins:
          type: array
          items:
            type: string
          description: Origins allowed (supports wildcards)
        allowMethods:
          type: array
          items:
            type: string
          description: HTTP methods allowed
        allowHeaders:
          type: array
          items:
            type: string
          description: Headers allowed in requests
        exposeHeaders:
          type: array
          items:
            type: string
          description: Headers exposed to the browser
        maxAge:
          type: integer
          description: Max age in seconds for preflight cache
        allowCredentials:
          type: boolean
          description: Whether to allow credentials
    APIKeyAuthStoredConfig:
      type: object
      description: Stored API key auth configuration (K8s-native format)
      properties:
        credentialRefs:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
        extractFrom:
          type: object
          properties:
            headers:
              type: array
              items:
                type: string
    BasicAuthConfig:
      type: object
      description: Basic auth configuration
      properties:
        secretRef:
          type: object
          properties:
            name:
              type: string
            namespace:
              type: string
    JWTStoredConfig:
      type: object
      description: Stored JWT configuration (K8s-native format)
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              issuer:
                type: string
              audiences:
                type: array
                items:
                  type: string
              remoteJWKS:
                type: object
                properties:
                  uri:
                    type: string
              claimToHeaders:
                type: array
                items:
                  type: object
                  properties:
                    claim:
                      type: string
                    header:
                      type: string
    OIDCStoredConfig:
      type: object
      description: Stored OIDC configuration
      properties:
        provider:
          type: object
          properties:
            issuer:
              type: string
            authorizationURL:
              type: string
            tokenURL:
              type: string
        clientId:
          type: string
        clientSecret:
          type: string
        redirectURL:
          type: string
        logoutPath:
          type: string
        scopes:
          type: array
          items:
            type: string
        cookieDomain:
          type: string
    OIDCConfig:
      type: object
      properties:
        issuer:
          type: string
        clientId:
          type: string
        clientSecretName:
          type: string
        redirectURL:
          type: string
        logoutPath:
          type: string
        scopes:
          type: array
          items:
            type: string
        cookieDomain:
          type: string
    JWTPrincipal:
      type: object
      description: JWT principal for authorization rules
      properties:
        provider:
          type: string
          description: JWT provider name
        claims:
          type: array
          items:
            $ref: '#/components/schemas/JWTClaimRule'
    JWTClaimRule:
      type: object
      description: JWT claim matching rule
      properties:
        name:
          type: string
          description: Claim name
        values:
          type: array
          items:
            type: string
          description: Required claim values
        valueType:
          type: string
          enum:
            - Exact
            - StringContains
          description: How to match claim values
    ExtAuthConfig:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - http
            - grpc
          description: External auth service type
        http:
          $ref: '#/components/schemas/ExtAuthHTTPConfig'
        grpc:
          $ref: '#/components/schemas/ExtAuthGRPCConfig'
        failOpen:
          type: boolean
          description: Allow traffic if auth service is unavailable
        headersToExtAuth:
          type: array
          items:
            type: string
          description: Additional client request headers to forward to ext-auth service
        headersToDownstreamOnDeny:
          type: array
          items:
            type: string
          description: Headers to send to client on auth deny
        headersToDownstreamOnAllow:
          type: array
          items:
            type: string
          description: Headers to send to client on auth allow
        headersToUpstreamOnAllow:
          type: array
          items:
            type: string
          description: Headers to send to backend on auth allow
        withRequestBody:
          $ref: '#/components/schemas/ExtAuthRequestBody'
    ExtAuthHTTPConfig:
      type: object
      required:
        - backendRef
        - path
      properties:
        backendRef:
          $ref: '#/components/schemas/ExtAuthBackendRef'
        path:
          type: string
          description: Path on the auth service to call
        headersToBackend:
          type: array
          items:
            type: string
          description: Headers to forward to auth service
    ExtAuthGRPCConfig:
      type: object
      required:
        - backendRef
      properties:
        backendRef:
          $ref: '#/components/schemas/ExtAuthBackendRef'
    ExtAuthBackendRef:
      type: object
      required:
        - name
        - port
      properties:
        name:
          type: string
          description: Service name
        namespace:
          type: string
          description: Namespace (optional, defaults to route namespace)
        port:
          type: integer
          description: Service port
    ExtAuthRequestBody:
      type: object
      required:
        - maxBytes
      properties:
        maxBytes:
          type: integer
          description: Maximum request body bytes to forward
    BackendTrafficPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        config:
          $ref: '#/components/schemas/BackendTrafficPolicyConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BackendTrafficPolicyConfig:
      type: object
      properties:
        compression:
          type: array
          items:
            $ref: '#/components/schemas/CompressionConfig'
          description: List of compression configurations
        retry:
          $ref: '#/components/schemas/RetryConfig'
        loadBalancer:
          $ref: '#/components/schemas/LoadBalancerConfig'
        circuitBreaker:
          $ref: '#/components/schemas/CircuitBreakerConfig'
        healthCheck:
          $ref: '#/components/schemas/HealthCheckConfig'
        faultInjection:
          $ref: '#/components/schemas/FaultInjectionConfig'
        rateLimit:
          $ref: '#/components/schemas/RateLimitConfig'
        requestBuffer:
          $ref: '#/components/schemas/RequestBufferConfig'
        responseOverride:
          type: array
          items:
            $ref: '#/components/schemas/ResponseOverrideRule'
          description: Rules for overriding backend responses based on status codes
        timeout:
          $ref: '#/components/schemas/BTPTimeoutConfig'
    BackendTrafficPolicyInput:
      type: object
      properties:
        compression:
          type: array
          items:
            $ref: '#/components/schemas/CompressionConfig'
          description: List of compression configurations
        retry:
          $ref: '#/components/schemas/RetryConfig'
        loadBalancer:
          $ref: '#/components/schemas/LoadBalancerConfig'
        circuitBreaker:
          $ref: '#/components/schemas/CircuitBreakerConfig'
        healthCheck:
          $ref: '#/components/schemas/HealthCheckConfig'
        faultInjection:
          $ref: '#/components/schemas/FaultInjectionConfig'
        rateLimit:
          $ref: '#/components/schemas/RateLimitConfig'
        requestBuffer:
          $ref: '#/components/schemas/RequestBufferConfig'
        responseOverride:
          type: array
          items:
            $ref: '#/components/schemas/ResponseOverrideRule'
          description: Rules for overriding backend responses based on status codes
        timeout:
          $ref: '#/components/schemas/BTPTimeoutConfig'
    BTPTimeoutConfig:
      type: object
      description: Timeout configuration for BackendTrafficPolicy (works for both HTTP and gRPC routes)
      properties:
        tcp:
          $ref: '#/components/schemas/BTPTCPTimeoutConfig'
        http:
          $ref: '#/components/schemas/BTPHTTPTimeoutConfig'
    BTPTCPTimeoutConfig:
      type: object
      properties:
        connectTimeout:
          type: string
          description: TCP connect timeout (e.g. "10s", "500ms")
    BTPHTTPTimeoutConfig:
      type: object
      properties:
        requestTimeout:
          type: string
          description: Request timeout (e.g. "15s", "1m")
        connectionIdleTimeout:
          type: string
          description: Connection idle timeout (e.g. "1h")
        maxConnectionDuration:
          type: string
          description: Max connection duration (e.g. "0s" for unlimited)
        maxStreamDuration:
          type: string
          description: Max stream duration (e.g. "0s" for unlimited)
    CompressionConfig:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Gzip
            - Brotli
            - Zstd
          description: Compression algorithm type
        gzip:
          type: object
          description: Gzip-specific configuration (currently empty)
        brotli:
          type: object
          description: Brotli-specific configuration (currently empty)
        zstd:
          type: object
          description: Zstd-specific configuration (currently empty)
    RetryConfig:
      type: object
      description: Retry configuration for BackendTrafficPolicy
      properties:
        numRetries:
          type: integer
          minimum: 0
          description: Maximum number of retry attempts. Defaults to 2 if not set.
        retryOn:
          $ref: '#/components/schemas/RetryOn'
        perRetryPolicy:
          $ref: '#/components/schemas/PerRetryPolicy'
    RetryOn:
      type: object
      description: Conditions that trigger a retry
      properties:
        httpStatusCodes:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
          description: HTTP status codes that trigger a retry
        triggers:
          type: array
          items:
            type: string
            enum:
              - 5xx
              - gateway-error
              - connect-failure
              - retriable-status-codes
              - reset
              - reset-before-request
              - retriable-4xx
              - refused-stream
              - cancelled
              - deadline-exceeded
              - internal
              - resource-exhausted
              - unavailable
          description: Envoy retry trigger conditions
    PerRetryPolicy:
      type: object
      description: Per-attempt retry behavior
      properties:
        backOff:
          $ref: '#/components/schemas/BackOffPolicy'
        timeout:
          type: string
          description: Per-attempt timeout (Go duration format, e.g. 250ms, 1s)
    BackOffPolicy:
      type: object
      description: Backoff timing between retries
      properties:
        baseInterval:
          type: string
          description: Initial wait between retries (e.g. 25ms, 100ms)
        maxInterval:
          type: string
          description: Maximum wait between retries (e.g. 250ms, 10s). Must be >= baseInterval.
    LoadBalancerConfig:
      type: object
      required:
        - type
      description: Load balancer configuration for traffic distribution across backends
      properties:
        type:
          type: string
          enum:
            - RoundRobin
            - Random
            - LeastRequest
            - ConsistentHash
          description: Load balancing algorithm type
        consistentHash:
          $ref: '#/components/schemas/ConsistentHashConfig'
    ConsistentHashConfig:
      type: object
      required:
        - type
      description: Consistent hash configuration (required when load balancer type is ConsistentHash)
      properties:
        type:
          type: string
          enum:
            - SourceIP
            - Header
            - Cookie
          description: The hash key type for consistent hashing
        header:
          $ref: '#/components/schemas/ConsistentHashHeader'
        cookie:
          $ref: '#/components/schemas/ConsistentHashCookie'
    ConsistentHashHeader:
      type: object
      required:
        - name
      description: Header-based consistent hashing configuration
      properties:
        name:
          type: string
          description: The HTTP header name to hash on
    ConsistentHashCookie:
      type: object
      required:
        - name
      description: Cookie-based consistent hashing configuration
      properties:
        name:
          type: string
          description: The cookie name to hash on
        ttl:
          type: string
          description: Cookie TTL duration (Go duration format, e.g. "60s", "1h")
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Cookie attributes (e.g. SameSite=Strict, HttpOnly=true)
    CircuitBreakerConfig:
      type: object
      description: Circuit breaker configuration to protect backends from being overwhelmed
      properties:
        maxConnections:
          type: integer
          format: int64
          description: Maximum number of connections to the backend. Default 1024.
        maxPendingRequests:
          type: integer
          format: int64
          description: Maximum number of pending requests queued. Default 1024.
        maxParallelRequests:
          type: integer
          format: int64
          description: Maximum number of parallel requests. Default 1024.
        maxParallelRetries:
          type: integer
          format: int64
          description: Maximum number of parallel retries. Default 1024.
        maxRequestsPerConnection:
          type: integer
          format: int64
          description: Maximum requests per connection. Default unlimited. Set to 1 to disable keep-alive.
    HealthCheckConfig:
      type: object
      description: Health check configuration for backend services
      properties:
        active:
          $ref: '#/components/schemas/ActiveHealthCheckConfig'
        passive:
          $ref: '#/components/schemas/PassiveHealthCheckConfig'
        panicThreshold:
          type: integer
          format: uint32
          description: Panic threshold percentage. Below this, Envoy ignores health status.
    ActiveHealthCheckConfig:
      type: object
      required:
        - type
      description: Active health check - Envoy actively probes backends
      properties:
        timeout:
          type: string
          description: Time to wait for response. Default 1s.
        interval:
          type: string
          description: Time between checks. Default 3s.
        unhealthyThreshold:
          type: integer
          format: uint32
          description: Unhealthy checks to mark backend unhealthy. Default 3.
        healthyThreshold:
          type: integer
          format: uint32
          description: Healthy checks to mark backend healthy. Default 1.
        type:
          type: string
          enum:
            - HTTP
            - TCP
            - GRPC
        http:
          $ref: '#/components/schemas/HTTPActiveHealthCheckConfig'
        tcp:
          $ref: '#/components/schemas/TCPActiveHealthCheckConfig'
        grpc:
          $ref: '#/components/schemas/GRPCActiveHealthCheckConfig'
    HTTPActiveHealthCheckConfig:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: HTTP request path for health checks
        method:
          type: string
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          description: HTTP method. Default GET.
        expectedStatuses:
          type: array
          items:
            type: integer
          description: Expected HTTP status codes. Default [200].
    TCPActiveHealthCheckConfig:
      type: object
      properties:
        send:
          $ref: '#/components/schemas/HealthCheckPayload'
        receive:
          $ref: '#/components/schemas/HealthCheckPayload'
    GRPCActiveHealthCheckConfig:
      type: object
      properties:
        service:
          type: string
          description: gRPC service name for health checks
    HealthCheckPayload:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Text
        text:
          type: string
    PassiveHealthCheckConfig:
      type: object
      description: Passive health check (outlier detection)
      properties:
        consecutiveGatewayErrors:
          type: integer
          format: uint32
          description: Gateway error threshold to eject backend
        consecutive5xxErrors:
          type: integer
          format: uint32
          description: 5xx error threshold to eject backend
        interval:
          type: string
          description: Evaluation interval (e.g. "30s")
        baseEjectionTime:
          type: string
          description: Minimum ejection duration (e.g. "30s")
    FaultInjectionConfig:
      type: object
      description: Fault injection configuration for testing resilience
      properties:
        delay:
          $ref: '#/components/schemas/FaultInjectionDelayConfig'
        abort:
          $ref: '#/components/schemas/FaultInjectionAbortConfig'
    FaultInjectionDelayConfig:
      type: object
      required:
        - fixedDelay
      description: Delay fault injection - adds artificial latency
      properties:
        fixedDelay:
          type: string
          description: Duration to delay (e.g. "2s", "500ms")
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of requests to delay (0-100). Default 100.
    FaultInjectionAbortConfig:
      type: object
      description: Abort fault injection - returns error responses
      properties:
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code to return
        grpcStatus:
          type: integer
          minimum: 0
          maximum: 16
          description: gRPC status code to return
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of requests to abort (0-100). Default 100.
    RateLimitConfig:
      type: object
      description: Rate limit configuration for controlling request volume
      properties:
        global:
          $ref: '#/components/schemas/GlobalRateLimitConfig'
    GlobalRateLimitConfig:
      type: object
      required:
        - rules
      description: Global rate limit configuration
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RateLimitRule'
          minItems: 1
          description: List of rate limit rules
    RateLimitRule:
      type: object
      required:
        - limit
      description: A single rate limit rule
      properties:
        limit:
          $ref: '#/components/schemas/RateLimitValue'
        clientSelectors:
          type: array
          items:
            $ref: '#/components/schemas/RateLimitSelector'
          description: Optional client selectors to scope the rate limit
    RateLimitValue:
      type: object
      required:
        - requests
        - unit
      description: Rate limit value (requests per time unit)
      properties:
        requests:
          type: integer
          minimum: 1
          description: Number of requests allowed
        unit:
          type: string
          enum:
            - Second
            - Minute
            - Hour
            - Day
          description: Time unit for the rate limit
    RateLimitSelector:
      type: object
      description: Client selector criteria for rate limiting
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/RateLimitHeaderMatch'
          description: Header-based matching
        sourceCIDR:
          $ref: '#/components/schemas/RateLimitSourceCIDR'
        path:
          $ref: '#/components/schemas/RateLimitPathMatch'
        methods:
          type: array
          items:
            type: string
          description: HTTP methods to match (e.g., GET, POST)
    RateLimitHeaderMatch:
      type: object
      required:
        - name
      description: Header match for rate limiting
      properties:
        name:
          type: string
          description: Header name to match
        value:
          type: string
          description: Header value to match (optional)
        type:
          type: string
          enum:
            - Exact
            - Distinct
          description: Match type (Exact = match value, Distinct = unique per value)
        invert:
          type: boolean
          default: false
          description: Invert the match condition
    RateLimitSourceCIDR:
      type: object
      required:
        - value
      description: Source CIDR match for rate limiting
      properties:
        value:
          type: string
          description: CIDR notation or IP address (e.g., "192.168.1.0/24")
        type:
          type: string
          enum:
            - Exact
            - Distinct
          description: Match type (Exact = match CIDR, Distinct = unique per IP)
    RateLimitPathMatch:
      type: object
      required:
        - value
        - type
      description: Path match for rate limiting
      properties:
        value:
          type: string
          description: Path value to match
        type:
          type: string
          enum:
            - Exact
            - PathPrefix
            - RegularExpression
          description: Path match type
    RequestBufferConfig:
      type: object
      required:
        - limit
      description: Request buffering configuration
      properties:
        limit:
          type: string
          description: Buffer limit (e.g., "4Ki", "1Mi", "16Ki")
    ResponseOverrideRule:
      type: object
      required:
        - match
        - response
      description: Response override rule
      properties:
        match:
          $ref: '#/components/schemas/ResponseOverrideMatch'
        response:
          $ref: '#/components/schemas/ResponseOverrideResponse'
    ResponseOverrideMatch:
      type: object
      required:
        - statusCodes
      description: Match criteria for response override
      properties:
        statusCodes:
          type: array
          items:
            $ref: '#/components/schemas/StatusCodeMatch'
          description: Status codes to match
    StatusCodeMatch:
      type: object
      required:
        - type
      description: Status code match specification
      properties:
        type:
          type: string
          enum:
            - Value
            - Range
          description: Match type (single value or range)
        value:
          type: integer
          description: Single status code value (when type is Value)
        range:
          $ref: '#/components/schemas/StatusCodeRange'
    StatusCodeRange:
      type: object
      required:
        - start
        - end
      description: Status code range
      properties:
        start:
          type: integer
          description: Start of range (inclusive)
        end:
          type: integer
          description: End of range (inclusive)
    ResponseOverrideResponse:
      type: object
      required:
        - contentType
        - body
      description: Override response configuration
      properties:
        contentType:
          type: string
          description: Content-Type header for the response
        body:
          $ref: '#/components/schemas/ResponseOverrideBody'
    ResponseOverrideBody:
      type: object
      required:
        - type
      description: Response body configuration
      properties:
        type:
          type: string
          enum:
            - Inline
            - ValueRef
          description: Body source type
        inline:
          type: string
          description: Inline body content (when type is Inline)
        valueRef:
          $ref: '#/components/schemas/ValueRef'
    ValueRef:
      type: object
      required:
        - kind
        - name
      description: Reference to a ConfigMap or Secret
      properties:
        group:
          type: string
          description: API group (empty for core resources)
        kind:
          type: string
          enum:
            - ConfigMap
            - Secret
          description: Resource kind
        name:
          type: string
          description: Resource name
        namespace:
          type: string
          description: Resource namespace (optional)
    Client:
