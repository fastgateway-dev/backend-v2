certificates:
  get:
    tags: [Managed Certificates]
    summary: List managed certificates in project (requires cert.view)
    description: Each item is enriched with its resolved issuer name/type, Phase 3a distribution sync state, and the domains referencing it.
    operationId: listManagedCertificates
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/page'
      - $ref: '../components/parameters.yaml#/limit'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, issuing, ready, error]
        description: Filter by certificate status.
      - name: issuerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter by issuer.
      - name: usage
        in: query
        required: false
        schema:
          type: string
          enum: [server, client]
        description: Filter by certificate usage.
      - name: expiresBefore
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filter to certificates expiring before this RFC3339 timestamp.
    responses:
      '200':
        description: List of managed certificates, enriched with issuer, distribution, and domain info
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/EnrichedManagedCertificateList'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

  post:
    tags: [Managed Certificates]
    summary: Create managed certificate (requires cert.create)
    description: Issues a certificate from an issuer granted to this project. Opens an approval when the project has approvals enabled (returns 202 with the pending certificate + approvalId); otherwise issues immediately (201, approvalId null).
    operationId: createManagedCertificate
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/managed-certificate.yaml#/CreateManagedCertificateRequest'
    responses:
      '201':
        description: Certificate issued immediately (approvals disabled for this project)
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/CreateManagedCertificateResponse'
      '202':
        description: Certificate created and pending approval
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/CreateManagedCertificateResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

certificate-issuers:
  get:
    tags: [Managed Certificates]
    summary: List certificate issuers granted to this project (requires cert.view)
    description: Populates a certificate-create form's issuer picker. Never includes key material.
    operationId: listProjectCertificateIssuers
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    responses:
      '200':
        description: Certificate issuers granted to this project
        content:
          application/json:
            schema:
              $ref: '../schemas/certificate-issuer.yaml#/CertificateIssuerList'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

certificates_{certificateId}:
  get:
    tags: [Managed Certificates]
    summary: Get managed certificate (requires cert.view)
    operationId: getManagedCertificate
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '200':
        description: Managed certificate
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/ManagedCertificate'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  delete:
    tags: [Managed Certificates]
    summary: Delete managed certificate (requires cert.delete)
    description: Removes the leaf `Certificate` CRD (and its Secret) from the control cluster.
    operationId: deleteManagedCertificate
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '204':
        description: Certificate deleted
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

certificate-status:
  get:
    tags: [Managed Certificates]
    summary: Get managed certificate issuance status (requires cert.view)
    description: Live cert-manager readiness of the underlying `Certificate` resource (Ready condition + message).
    operationId: getManagedCertificateStatus
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '200':
        description: Managed certificate status
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/ManagedCertificateStatus'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

certificate-distribution:
  get:
    tags: [Managed Certificates]
    summary: Get managed certificate distribution status (requires cert.view)
    description: Phase 3a distribution state -- how far the certdist controller has gotten pushing this certificate's Secret into the project's tenant cluster. Returns a pending placeholder (not a 404) when the controller has not pushed it yet.
    operationId: getManagedCertificateDistribution
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '200':
        description: Certificate distribution status
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/CertificateDistribution'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

certificate-resync:
  post:
    tags: [Managed Certificates]
    summary: Force a certificate distribution resync (requires cert.edit)
    description: Flips the distribution row back to pending so the certdist controller re-pushes the certificate's Secret on its next tick. NOTIFY is not wired up, so this is a ticker-driven nudge rather than an immediate push.
    operationId: resyncManagedCertificateDistribution
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '202':
        description: Resync accepted; the certdist controller will re-push on its next tick.
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

certificate-export:
  post:
    tags: [Managed Certificates]
    summary: Request a certificate export (requires cert.edit)
    description: |
      Opens an approval to export a managed-key certificate's private key material.
      Once approved -- immediately, if the project has approvals disabled -- the
      requesting user gets a short-lived, single-use grant redeemable via
      GET .../export/download. Only applicable to managed-key certificates
      (keyMode: managed): a csr-key-mode certificate's private key never existed
      server-side (only its CSR was handed to cert-manager), so there is nothing
      to export and this returns 409.
    operationId: requestManagedCertificateExport
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '202':
        description: Export approval opened, or (approvals disabled for this project) the grant was minted immediately.
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/RequestExportResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Export is not applicable to this certificate (keyMode is csr -- the caller already holds the private key).
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

certificate-export-download:
  get:
    tags: [Managed Certificates]
    summary: Download the exported certificate + private key bundle (one-time)
    description: |
      Streams the certificate's leaf certificate, private key, and issuer CA chain
      as a single concatenated `application/x-pem-file` attachment. This is the
      ONLY endpoint in the API that ever returns private key material, and only
      when the calling user holds an approved, unconsumed, unexpired export grant
      for this certificate (see POST .../export) -- the grant is consumed
      atomically on this call, so it can be downloaded exactly once.
    operationId: downloadManagedCertificateExport
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '200':
        description: PEM bundle containing the private key, leaf certificate, and CA chain, as an attachment download.
        content:
          application/x-pem-file:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '410':
        description: No approved, unconsumed export grant is available for this user and certificate; request a new export and get it approved.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
