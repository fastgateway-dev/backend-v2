certificates:
  get:
    tags: [Managed Certificates]
    summary: List managed certificates in project
    operationId: listManagedCertificates
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/page'
      - $ref: '../components/parameters.yaml#/limit'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, issuing, ready, error]
        description: Filter by certificate status.
    responses:
      '200':
        description: List of managed certificates
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/ManagedCertificateList'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

  post:
    tags: [Managed Certificates]
    summary: Create managed certificate (requires cert.create)
    description: Issues a certificate from an issuer granted to this project. Opens an approval when the project has approvals enabled (returns 202 with the pending certificate + approvalId); otherwise issues immediately (201, approvalId null).
    operationId: createManagedCertificate
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/managed-certificate.yaml#/CreateManagedCertificateRequest'
    responses:
      '201':
        description: Certificate issued immediately (approvals disabled for this project)
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/CreateManagedCertificateResponse'
      '202':
        description: Certificate created and pending approval
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/CreateManagedCertificateResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

certificate-issuers:
  get:
    tags: [Managed Certificates]
    summary: List certificate issuers granted to this project (requires cert.view)
    description: Populates a certificate-create form's issuer picker. Never includes key material.
    operationId: listProjectCertificateIssuers
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    responses:
      '200':
        description: Certificate issuers granted to this project
        content:
          application/json:
            schema:
              $ref: '../schemas/certificate-issuer.yaml#/CertificateIssuerList'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

certificates_{certificateId}:
  get:
    tags: [Managed Certificates]
    summary: Get managed certificate (requires cert.view)
    operationId: getManagedCertificate
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '200':
        description: Managed certificate
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/ManagedCertificate'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  delete:
    tags: [Managed Certificates]
    summary: Delete managed certificate (requires cert.delete)
    description: Removes the leaf `Certificate` CRD (and its Secret) from the control cluster.
    operationId: deleteManagedCertificate
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '204':
        description: Certificate deleted
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

certificate-status:
  get:
    tags: [Managed Certificates]
    summary: Get managed certificate issuance status (requires cert.view)
    description: Live cert-manager readiness of the underlying `Certificate` resource (Ready condition + message).
    operationId: getManagedCertificateStatus
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '200':
        description: Managed certificate status
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/ManagedCertificateStatus'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

certificate-distribution:
  get:
    tags: [Managed Certificates]
    summary: Get managed certificate distribution status (requires cert.view)
    description: Phase 3a distribution state -- how far the certdist controller has gotten pushing this certificate's Secret into the project's tenant cluster. Returns a pending placeholder (not a 404) when the controller has not pushed it yet.
    operationId: getManagedCertificateDistribution
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '200':
        description: Certificate distribution status
        content:
          application/json:
            schema:
              $ref: '../schemas/managed-certificate.yaml#/CertificateDistribution'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

certificate-resync:
  post:
    tags: [Managed Certificates]
    summary: Force a certificate distribution resync (requires cert.edit)
    description: Flips the distribution row back to pending so the certdist controller re-pushes the certificate's Secret on its next tick. NOTIFY is not wired up, so this is a ticker-driven nudge rather than an immediate push.
    operationId: resyncManagedCertificateDistribution
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/certificateId'
    responses:
      '202':
        description: Resync accepted; the certdist controller will re-push on its next tick.
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
