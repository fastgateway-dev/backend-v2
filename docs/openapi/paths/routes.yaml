routes:
  get:
    tags: [Routes]
    summary: List routes for domain
    operationId: listRoutes
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/page'
      - $ref: '../components/parameters.yaml#/limit'
      - name: teamId
        in: query
        schema:
          type: string
          format: uuid
        description: Filter by team
      - name: status
        in: query
        schema:
          type: string
          enum: [pending_create, pending_update, pending_delete, approved, pending_deploy, active, rejected]
        description: Filter by a single status value (unlike listProjectRoutes, this does not accept a comma-separated list)
      - name: search
        in: query
        schema:
          type: string
        description: Free-text search term
      - name: searchField
        in: query
        schema:
          type: string
          enum: [all, name, path, owner]
        description: Field to restrict the search term to (defaults to searching all fields)
      - name: labels
        in: query
        schema:
          type: string
        description: Label filter expression (e.g. "key=value,key2=value2") matched against the route's labels
    responses:
      '200':
        description: List of routes
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteList'

  post:
    tags: [Routes]
    summary: Create route (submits for approval)
    operationId: createRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/CreateRouteRequest'
    responses:
      '201':
        description: Route created and pending approval
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteResponse'

routes_{routeId}:
  get:
    tags: [Routes]
    summary: Get route by ID
    operationId: getRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route details, including its associated policies (if configured)
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteWithPolicies'

  put:
    tags: [Routes]
    summary: Update route (submits for approval)
    operationId: updateRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/UpdateRouteRequest'
    responses:
      '200':
        description: Route update pending approval
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteResponse'

  delete:
    tags: [Routes]
    summary: Delete route (submits for approval)
    operationId: deleteRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route deletion pending approval
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/Route'

route-yaml:
  get:
    tags: [Routes]
    summary: Get route as Kubernetes YAML (HTTPRoute only)
    operationId: getRouteYaml
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route as YAML
        content:
          text/yaml:
            schema:
              type: string

route-yamls:
  get:
    tags: [Routes]
    summary: Get all Kubernetes YAMLs for route (HTTPRoute, SecurityPolicy, BackendTrafficPolicy)
    operationId: getRouteYamls
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route YAMLs
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteYAMLsResponse'

preview-create:
  post:
    tags: [Routes]
    summary: Preview route creation (generate YAML without creating)
    operationId: previewCreateRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/CreateRouteRequest'
    responses:
      '200':
        description: Preview of route YAML
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/PreviewCreateResponse'

check-conflicts:
  post:
    tags: [Routes]
    summary: Check whether a route matcher conflicts with existing routes in the domain
    operationId: checkRouteConflicts
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/CheckConflictsRequest'
    responses:
      '200':
        description: Routes (if any) whose matcher conflicts with the given matcher
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/CheckConflictsResponse'
      '400':
        description: Invalid request body or domain ID
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

preview-update:
  post:
    tags: [Routes]
    summary: Preview route update (compare current vs proposed YAML)
    operationId: previewUpdateRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/UpdateRouteRequest'
    responses:
      '200':
        description: Preview of route update
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/PreviewUpdateResponse'

preview-delete:
  get:
    tags: [Routes]
    summary: Preview route deletion (show what will be deleted)
    operationId: previewDeleteRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Preview of route deletion
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/PreviewDeleteResponse'

deploy:
  post:
    tags: [Routes]
    summary: Deploy approved route to Kubernetes
    operationId: deployRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route deployed
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/Route'
      '400':
        description: Route not in deployable state
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

route-versions:
  get:
    tags: [Routes]
    summary: List route version history
    operationId: listRouteVersions
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
      - $ref: '../components/parameters.yaml#/page'
      - $ref: '../components/parameters.yaml#/limit'
    responses:
      '200':
        description: Route version history
        content:
          application/json:
            schema:
              $ref: '../schemas/route-version.yaml#/RouteVersionList'

route-version:
  get:
    tags: [Routes]
    summary: Get specific route version
    operationId: getRouteVersion
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Route version details
        content:
          application/json:
            schema:
              $ref: '../schemas/route-version.yaml#/RouteVersion'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

route-version-rollback:
  post:
    tags: [Routes]
    summary: Rollback route to a previous version
    operationId: rollbackRouteVersion
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
      - $ref: '../components/parameters.yaml#/routeId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Route rolled back
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/Route'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

project-routes:
  get:
    tags: [Routes]
    summary: List routes across all domains in a project
    description: |
      Lists routes in a project, optionally filtered by backend service and
      namespace. When `backend_service` and `backend_namespace` are both set,
      only routes whose `config.backends[]` (and optionally `config.mirrors[]`
      when `include_mirrors=true`) contain a Kubernetes backend with that
      service+namespace are returned. Useful for answering "where is this
      service used?".
    operationId: listProjectRoutes
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - name: backend_service
        in: query
        schema:
          type: string
        description: Match routes whose backends contain a Kubernetes backend with this service name. Must be paired with backend_namespace.
      - name: backend_namespace
        in: query
        schema:
          type: string
        description: Match routes whose backends contain a Kubernetes backend in this namespace. Must be paired with backend_service.
      - name: include_mirrors
        in: query
        schema:
          type: boolean
          default: false
        description: When true, also match against config.mirrors[].
      - name: status
        in: query
        schema:
          type: string
        description: Comma-separated list of statuses (pending_create, pending_update, pending_delete, approved, pending_deploy, active, rejected).
      - name: team_id
        in: query
        schema:
          type: string
          format: uuid
      - name: domain_id
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '../components/parameters.yaml#/page'
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
    responses:
      '200':
        description: Paginated list of routes
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteList'
      '400':
        description: Invalid filter (e.g., backend_service without backend_namespace)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

openapi-import:
  post:
    tags: [Routes]
    summary: Import routes from an OpenAPI spec
    description: |
      Parses an uploaded OpenAPI 3.0/3.1 spec and returns a list of candidate
      routes (not yet created) for the caller to review and submit individually
      via createRoute. The request body is capped at 5MB.
    operationId: importOpenAPI
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/openapi-import.yaml#/OpenAPIImportRequest'
    responses:
      '200':
        description: Parsed routes, warnings, renames, and spec metadata
        content:
          application/json:
            schema:
              $ref: '../schemas/openapi-import.yaml#/OpenAPIImportResponse'
      '400':
        description: Invalid request body, invalid defaultBackend, or the spec failed to parse
        content:
          application/json:
            schema:
              $ref: '../schemas/openapi-import.yaml#/ImportError'
      '413':
        description: Spec body exceeded the 5MB limit
        content:
          application/json:
            schema:
              $ref: '../schemas/openapi-import.yaml#/ImportError'
