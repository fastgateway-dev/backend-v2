notifications:
  get:
    tags: [Notifications]
    summary: List notifications for current user
    operationId: listNotifications
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/page'
      - $ref: '../components/parameters.yaml#/limit'
      - name: unread
        in: query
        schema:
          type: string
          enum: ['true']
        description: Filter to unread notifications only
    responses:
      '200':
        description: Paginated notification list
        content:
          application/json:
            schema:
              $ref: '../schemas/notification.yaml#/NotificationList'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

notification-count:
  get:
    tags: [Notifications]
    summary: Get unread notification count
    operationId: getUnreadNotificationCount
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Unread count
        content:
          application/json:
            schema:
              type: object
              properties:
                unread:
                  type: integer
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

notification-read:
  put:
    tags: [Notifications]
    summary: Mark notification as read
    operationId: markNotificationAsRead
    security:
      - bearerAuth: []
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Marked as read
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
      '404':
        $ref: '../components/responses.yaml#/NotFound'

notification-read-all:
  put:
    tags: [Notifications]
    summary: Mark all notifications as read
    operationId: markAllNotificationsAsRead
    security:
      - bearerAuth: []
    responses:
      '200':
        description: All marked as read
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
