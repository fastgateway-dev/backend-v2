stream-routes:
  get:
    tags: [Streams]
    summary: List L4 routes of a stream
    operationId: listStreamRoutes
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/page'
      - $ref: '../components/parameters.yaml#/limit'
      - name: teamId
        in: query
        schema:
          type: string
          format: uuid
        description: Filter by team
      - name: status
        in: query
        schema:
          type: string
          enum: [pending_create, pending_update, pending_delete, approved, pending_deploy, active, rejected]
        description: Filter by a single status value
    responses:
      '200':
        description: List of L4 routes, ordered by name
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteList'
      '404':
        description: Stream not found (including streams of other projects)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  post:
    tags: [Streams]
    summary: Create L4 route (submits for approval)
    description: |
      Creates a TCP or UDP route on the stream's Gateway and submits it through
      the same approval flow as HTTP routes. Requires Owner, Project Admin or
      Editor.
    operationId: createStreamRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/CreateStreamRouteRequest'
    responses:
      '201':
        description: Route created and pending approval
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteResponse'
      '400':
        description: Invalid route (non-L4 protocol, L7 field, external backend, missing listener port or backend, reserved or out-of-range port, duplicate name)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        description: Stream not found (including streams of other projects)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '409':
        description: The listener port is already used by another route on the stream (same protocol), or by a merged Gateway Template's HTTP/HTTPS port
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

stream-routes_{routeId}:
  get:
    tags: [Streams]
    summary: Get L4 route by ID
    operationId: getStreamRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route details
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteWithPolicies'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  put:
    tags: [Streams]
    summary: Update L4 route (submits for approval)
    operationId: updateStreamRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/UpdateRouteRequest'
    responses:
      '200':
        description: Route update pending approval
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteResponse'
      '400':
        description: Invalid route configuration
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: The new listener port is already used by another route on the stream
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  delete:
    tags: [Streams]
    summary: Delete L4 route (submits for approval)
    operationId: deleteStreamRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route deletion pending approval
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/Route'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

stream-route-yaml:
  get:
    tags: [Streams]
    summary: Get L4 route as Kubernetes YAML (TCPRoute or UDPRoute)
    operationId: getStreamRouteYaml
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route as YAML
        content:
          text/yaml:
            schema:
              type: string
      '404':
        $ref: '../components/responses.yaml#/NotFound'

stream-route-deploy:
  post:
    tags: [Streams]
    summary: Deploy approved L4 route to Kubernetes
    description: |
      Applies the stream's Gateway (recomputed from every live route's
      listener) and then the route's TCPRoute/UDPRoute.
    operationId: deployStreamRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route deployed
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/Route'
      '400':
        description: Route not in deployable state
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

stream-route-yamls:
  get:
    tags: [Streams]
    summary: Get an L4 route's manifests (TCPRoute/UDPRoute and BackendTrafficPolicy)
    description: |
      The TCPRoute or UDPRoute is returned in `httpRouteYaml` (the same
      response shape as the domain route endpoint) and the
      BackendTrafficPolicy deploy applies in `backendTrafficPolicyYaml`
      (absent when the route has no policy). Rendered through the deploy
      builders.
    operationId: getStreamRouteYamls
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Route YAMLs
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/RouteYAMLsResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        description: The route's stream or policy could not be read
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

stream-routes-preview:
  post:
    tags: [Streams]
    summary: Preview an L4 route create (TCPRoute/UDPRoute and BackendTrafficPolicy, no write)
    description: |
      Runs the same validation as creating the route (name, tcp/udp
      protocol, listener port validity, reserved ports, template range and
      collisions, protocol-gated policy inputs) and returns the manifests the
      create would produce. Errors are the create's errors with the same
      statuses, so a preview never shows a manifest create would reject.
    operationId: previewCreateStreamRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/CreateStreamRouteRequest'
    responses:
      '200':
        description: Proposed manifests (proposedYaml is the TCPRoute/UDPRoute)
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/PreviewCreateResponse'
      '400':
        description: Invalid route (same cases as create)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '404':
        description: Stream not found (including streams of other projects)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '409':
        description: The listener port is already in use in the stream's scope
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

stream-route-preview:
  post:
    tags: [Streams]
    summary: Preview an L4 route update (current and proposed TCPRoute/UDPRoute and BackendTrafficPolicy)
    description: |
      Runs the same input validation as updating the route, including the
      listener-port re-check with the route itself excluded.
    operationId: previewUpdateStreamRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/route.yaml#/UpdateRouteRequest'
    responses:
      '200':
        description: Current and proposed manifests
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/PreviewUpdateResponse'
      '400':
        description: Invalid route configuration
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: The new listener port is already in use in the stream's scope
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

stream-route-preview-delete:
  get:
    tags: [Streams]
    summary: Preview an L4 route delete (TCPRoute/UDPRoute and BackendTrafficPolicy that will be removed)
    operationId: previewDeleteStreamRoute
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '200':
        description: Manifests that the delete removes
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/PreviewDeleteResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

stream-route-versions:
  get:
    tags: [Streams]
    summary: List an L4 route's version history
    description: A version is recorded on every successful create/update deploy. A route of another stream is 404.
    operationId: listStreamRouteVersions
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
      - $ref: '../components/parameters.yaml#/page'
      - $ref: '../components/parameters.yaml#/limit'
    responses:
      '200':
        description: Route version history
        content:
          application/json:
            schema:
              $ref: '../schemas/route-version.yaml#/RouteVersionList'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

stream-route-version:
  get:
    tags: [Streams]
    summary: Get a specific version of an L4 route
    operationId: getStreamRouteVersion
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Route version details
        content:
          application/json:
            schema:
              $ref: '../schemas/route-version.yaml#/RouteVersion'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

stream-route-version-rollback:
  post:
    tags: [Streams]
    summary: Roll an L4 route back to a previous version (submits for approval)
    operationId: rollbackStreamRouteVersion
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
      - $ref: '../components/parameters.yaml#/routeId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Rollback submitted as a route update
        content:
          application/json:
            schema:
              $ref: '../schemas/route.yaml#/Route'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
