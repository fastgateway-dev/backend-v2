namespaces:
  get:
    tags: [Kubernetes]
    summary: List Kubernetes namespaces
    operationId: listNamespaces
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    responses:
      '200':
        description: List of namespaces
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/kubernetes.yaml#/K8sNamespace'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '500':
        description: Cluster discovery failed
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

gateway-classes:
  get:
    tags: [Kubernetes]
    summary: List Kubernetes GatewayClasses
    operationId: listGatewayClasses
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    responses:
      '200':
        description: List of GatewayClass names
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '500':
        description: Cluster discovery failed
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

services:
  get:
    tags: [Kubernetes]
    summary: List services in namespace
    operationId: listServices
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - name: namespace
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: List of services
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/kubernetes.yaml#/K8sService'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '500':
        description: Cluster discovery failed
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
