namespaces:
  get:
    tags: [Project Namespaces]
    summary: List whitelisted namespaces for project
    operationId: listProjectNamespaces
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    responses:
      '200':
        description: List of project namespaces
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/namespace.yaml#/ProjectNamespace'

  post:
    tags: [Project Namespaces]
    summary: Add namespace to project whitelist
    operationId: addProjectNamespace
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/namespace.yaml#/CreateProjectNamespaceRequest'
    responses:
      '201':
        description: Namespace added
        content:
          application/json:
            schema:
              $ref: '../schemas/namespace.yaml#/ProjectNamespace'

namespaces_{id}:
  get:
    tags: [Project Namespaces]
    summary: Get project namespace by ID
    operationId: getProjectNamespace
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/namespaceId'
    responses:
      '200':
        description: Project namespace details
        content:
          application/json:
            schema:
              $ref: '../schemas/namespace.yaml#/ProjectNamespace'

  patch:
    tags: [Project Namespaces]
    summary: Update capabilities for a project namespace
    operationId: updateProjectNamespace
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/namespaceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/namespace.yaml#/UpdateProjectNamespaceRequest'
    responses:
      '200':
        description: Updated namespace
        content:
          application/json:
            schema:
              $ref: '../schemas/namespace.yaml#/ProjectNamespace'

  delete:
    tags: [Project Namespaces]
    summary: Remove namespace from project whitelist
    operationId: removeProjectNamespace
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/namespaceId'
    responses:
      '204':
        description: Namespace removed

ensure-reference-grant:
  post:
    tags: [Project Namespaces]
    summary: Ensure ReferenceGrant exists for namespace
    operationId: ensureReferenceGrant
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/namespaceId'
    responses:
      '200':
        description: ReferenceGrant ensured
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
