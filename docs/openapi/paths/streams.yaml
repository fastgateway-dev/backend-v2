streams:
  get:
    tags: [Streams]
    summary: List streams in a project
    operationId: listStreams
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    responses:
      '200':
        description: List of streams, ordered by name, each with its entry point mode, template name, route count and port claims
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../schemas/stream.yaml#/StreamListItem'
      '500':
        description: A stream's gateway template or the route counts could not be read (modes are never guessed)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  post:
    tags: [Streams]
    summary: Create a stream
    description: |
      Creates a stream from a Gateway Template that has the stream capability,
      claiming the given ports, and eagerly deploys its Gateway with one
      listener per claim. An apply failure is recorded on the returned stream's
      status, not returned as an error. Requires Owner or Project Admin.
    operationId: createStream
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/stream.yaml#/CreateStreamRequest'
    responses:
      '201':
        description: Stream created
        content:
          application/json:
            schema:
              $ref: '../schemas/stream.yaml#/Stream'
      '400':
        description: Invalid name, namespace not registered for the project or lacking the deploy_gateway capability, the Gateway Template is not enabled for streams, or an invalid claim (no ports, a transport other than TCP/UDP, a port listed twice, reserved or outside the template's range)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        description: Gateway Template not found (including templates of other projects)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '409':
        description: A stream with this name already exists in the project, or a claimed port collides with another stream's claim or a domain's listener on the same merged Gateway Template
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

streams_{streamId}:
  get:
    tags: [Streams]
    summary: Get a stream
    operationId: getStream
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
    responses:
      '200':
        description: Stream details
        content:
          application/json:
            schema:
              $ref: '../schemas/stream.yaml#/Stream'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Streams]
    summary: Rename a stream and/or change its claimed ports
    description: |
      Sending `ports` replaces the claim set (at least one port) and re-applies
      the Gateway. A name-only update does not touch the cluster. Requires
      Owner or Project Admin.
    operationId: updateStream
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/stream.yaml#/UpdateStreamRequest'
    responses:
      '200':
        description: Updated stream
        content:
          application/json:
            schema:
              $ref: '../schemas/stream.yaml#/Stream'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: A stream with this name already exists in the project, the new claim set drops a port a route (or pending route approval) still uses, or a claimed port collides with another stream's claim or a domain's listener on the same merged Gateway Template
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  delete:
    tags: [Streams]
    summary: Delete a stream
    description: Fails with 409 while the stream still has routes. Also deletes the stream's Gateway from the cluster (best effort).
    operationId: deleteStream
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
    responses:
      '204':
        description: Stream deleted
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Stream still has routes
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

streams_{streamId}_entrypoint:
  get:
    tags: [Streams]
    summary: Get a stream's entry point (mode, address, who shares it, port map)
    operationId: getStreamEntrypoint
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
    responses:
      '200':
        description: The stream's entry point
        content:
          application/json:
            schema:
              $ref: '../schemas/stream.yaml#/StreamEntrypoint'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        description: The stream's gateway template, port sources or Gateway could not be read (the mode is never guessed)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

streams_{streamId}_yamls:
  get:
    tags: [Streams]
    summary: Get a stream's manifests (Gateway and every live L4 route)
    description: |
      The Gateway is rendered from the stream's claimed ports through the same
      builders the apply path uses; a stream with no claims has no Gateway, so
      the YAML is empty. Each live route carries its TCPRoute/UDPRoute and
      BackendTrafficPolicy (empty when it has none).
    operationId: getStreamYamls
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/streamId'
    responses:
      '200':
        description: The stream's manifests
        content:
          application/json:
            schema:
              $ref: '../schemas/stream.yaml#/StreamYAMLs'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        description: The stream's routes or policies could not be read (never a partial manifest set)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
