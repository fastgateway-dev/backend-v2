domain-dns-record:
  get:
    tags: [DNS Records]
    summary: Get a domain's DNS record
    description: Requires Owner, Project Admin, or domain-manage permission (the same access level as domain settings). Returns the record's live status, re-resolved on every read.
    operationId: getDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    responses:
      '200':
        description: The domain's DNS record
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/DomainDNSRecord'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        description: No DNS record exists for this domain
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  post:
    tags: [DNS Records]
    summary: Enable DNS management for a domain
    description: |
      Creates the domain's DNS record and performs a best-effort first
      reconcile against external-dns. `providerCredentialId`, if supplied,
      must equal the system-wide active DNS credential -- callers confirm
      the already-active credential, they cannot pick an arbitrary one.
      Requires Owner, Project Admin, or domain-manage permission.
    operationId: enableDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/dns-record.yaml#/CreateDNSRecordRequest'
    responses:
      '201':
        description: DNS record created
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/DomainDNSRecord'
      '400':
        description: No active DNS credential is configured, providerCredentialId does not match it, or recordType is not one of auto/A/AAAA/CNAME
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        description: A DNS record already exists for this domain
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  put:
    tags: [DNS Records]
    summary: Update a domain's DNS record
    description: Changes the record's type/TTL/proxied settings and re-reconciles. Requires Owner, Project Admin, or domain-manage permission.
    operationId: updateDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dns-record.yaml#/UpdateDNSRecordRequest'
    responses:
      '200':
        description: DNS record updated
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/DomainDNSRecord'
      '400':
        description: No active DNS credential is configured, providerCredentialId does not match it, or recordType is not one of auto/A/AAAA/CNAME
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        description: No DNS record exists for this domain
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  delete:
    tags: [DNS Records]
    summary: Delete a domain's DNS record
    description: |
      Removes the live DNSEndpoint (so external-dns tears down the DNS
      record) and the DomainDNSRecord row. Idempotent: deleting when no
      record exists still returns 204. Requires Owner, Project Admin, or
      domain-manage permission.
    operationId: deleteDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    responses:
      '204':
        description: DNS record deleted (or none existed)
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

domain-dns-record-refresh:
  post:
    tags: [DNS Records]
    summary: Re-reconcile a domain's DNS record
    description: Re-runs reconciliation against external-dns and returns the fresh record. Requires Owner, Project Admin, or domain-manage permission.
    operationId: refreshDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    responses:
      '200':
        description: Freshly reconciled DNS record
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/DomainDNSRecord'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        description: No DNS record exists for this domain
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

dns-active-credential:
  get:
    tags: [DNS Credentials]
    summary: Get the active DNS provider credential (Owner only)
    description: Platform-global. There is exactly one active DNS credential at a time, used by every domain's DNS record.
    operationId: getActiveDNSCredential
    security:
      - bearerAuth: []
    responses:
      '200':
        description: The currently active DNS provider credential, or none configured yet
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/ActiveDNSCredential'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

  put:
    tags: [DNS Credentials]
    summary: Set the active DNS provider credential (Owner only)
    description: |
      Validates the credential, renders it into the external-dns Secret, and
      applies that Secret to the control cluster. Only once the apply
      succeeds is the credential persisted as active.
    operationId: setActiveDNSCredential
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dns-record.yaml#/SetActiveDNSCredentialRequest'
    responses:
      '200':
        description: Active DNS provider credential updated
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/ActiveDNSCredential'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
