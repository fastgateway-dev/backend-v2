dns-records-list:
  get:
    tags: [DNS Records]
    summary: List all DNS records in a project
    description: |
      Returns every domain's FastGateway-managed DNS record for the project,
      each enriched with the domain hostname (the record name) and the hosted
      zone name. Read-only aggregation; it does not reconcile against the
      provider, so `status` is the last persisted value. Requires Owner,
      Project Admin, or domain-manage permission.
    operationId: listProjectDNSRecords
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
    responses:
      '200':
        description: The project's DNS records
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/dns-record.yaml#/DNSRecordListItem'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

domain-dns-record:
  get:
    tags: [DNS Records]
    summary: Get a domain's DNS record
    description: Requires Owner, Project Admin, or domain-manage permission (the same access level as domain settings). Returns the record's live status, re-resolved on every read.
    operationId: getDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    responses:
      '200':
        description: The domain's DNS record
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/DomainDNSRecord'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        description: No DNS record exists for this domain
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  post:
    tags: [DNS Records]
    summary: Enable DNS management for a domain
    description: |
      Creates the domain's DNS record in the given registered hosted zone
      and performs a best-effort first reconcile against the zone's
      provider. `hostedZoneId` is required.
      Requires Owner, Project Admin, or domain-manage permission.
    operationId: enableDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/dns-record.yaml#/CreateDNSRecordRequest'
    responses:
      '201':
        description: DNS record created
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/DomainDNSRecord'
      '400':
        description: hostedZoneId is missing, or recordType is not one of auto/A/AAAA/CNAME
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        description: A DNS record already exists for this domain
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  put:
    tags: [DNS Records]
    summary: Update a domain's DNS record
    description: Changes the record's type/TTL/proxied settings and re-reconciles. Requires Owner, Project Admin, or domain-manage permission.
    operationId: updateDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dns-record.yaml#/UpdateDNSRecordRequest'
    responses:
      '200':
        description: DNS record updated
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/DomainDNSRecord'
      '400':
        description: recordType is not one of auto/A/AAAA/CNAME
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        description: No DNS record exists for this domain
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  delete:
    tags: [DNS Records]
    summary: Delete a domain's DNS record
    description: |
      Removes the DomainDNSRecord row. Idempotent: deleting when no record
      exists still returns 204. Requires Owner, Project Admin, or
      domain-manage permission.
    operationId: deleteDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    responses:
      '204':
        description: DNS record deleted (or none existed)
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

domain-dns-record-refresh:
  post:
    tags: [DNS Records]
    summary: Re-reconcile a domain's DNS record
    description: Re-runs reconciliation against the record's hosted-zone provider and returns the fresh record. Requires Owner, Project Admin, or domain-manage permission.
    operationId: refreshDomainDNSRecord
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/projectId'
      - $ref: '../components/parameters.yaml#/domainId'
    responses:
      '200':
        description: Freshly reconciled DNS record
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-record.yaml#/DomainDNSRecord'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        description: No DNS record exists for this domain
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
