dns-credentials:
  get:
    tags: [DNS Credentials]
    summary: List DNS provider credentials (Owner only)
    description: Platform-global. Never includes credential material.
    operationId: listDNSCredentials
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of DNS provider credentials
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-credential.yaml#/DNSProviderCredentialList'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

  post:
    tags: [DNS Credentials]
    summary: Create DNS provider credential (Owner only)
    description: Credentials are encrypted at rest and never returned in any response.
    operationId: createDNSCredential
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dns-credential.yaml#/CreateDNSCredentialRequest'
    responses:
      '201':
        description: DNS provider credential created
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-credential.yaml#/DNSProviderCredential'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

dns-credentials_{dnsCredentialId}:
  get:
    tags: [DNS Credentials]
    summary: Get DNS provider credential (Owner only)
    description: Metadata only, never includes credential material.
    operationId: getDNSCredential
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/dnsCredentialId'
    responses:
      '200':
        description: DNS provider credential
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-credential.yaml#/DNSProviderCredential'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [DNS Credentials]
    summary: Update DNS provider credential (Owner only)
    description: Update the name and/or rotate the credential values. Omitting `credentials` leaves the existing encrypted values untouched.
    operationId: updateDNSCredential
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/dnsCredentialId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dns-credential.yaml#/UpdateDNSCredentialRequest'
    responses:
      '200':
        description: DNS provider credential updated
        content:
          application/json:
            schema:
              $ref: '../schemas/dns-credential.yaml#/DNSProviderCredential'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  delete:
    tags: [DNS Credentials]
    summary: Delete DNS provider credential (Owner only)
    operationId: deleteDNSCredential
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/dnsCredentialId'
    responses:
      '204':
        description: DNS provider credential deleted
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        description: DNS provider credential is referenced by an ACME issuer
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
