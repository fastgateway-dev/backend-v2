Error:
  type: object
  required: [code, message]
  properties:
    code:
      type: string
    message:
      type: string

Pagination:
  type: object
  properties:
    page:
      type: integer
    limit:
      type: integer
    total:
      type: integer
    totalPages:
      type: integer

Labels:
  type: object
  additionalProperties:
    type: string
  description: Arbitrary key/value labels (Kubernetes-style) attached to a resource.
