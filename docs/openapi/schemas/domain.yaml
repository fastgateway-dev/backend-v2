Domain:
  type: object
  properties:
    id:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    domainTemplateId:
      type: string
      format: uuid
    name:
      type: string
    hostname:
      type: string
    httpPort:
      type: integer
    httpsPort:
      type: integer
    tlsMode:
      type: string
      enum: [tls_only, no_tls, both]
    tlsSecretName:
      type: string
    tlsSecretNamespace:
      type: string
      description: Kubernetes namespace containing the TLS secret (defaults to the project's managed namespace)
    tlsPolicy:
      type: string
      enum: [terminate, passthrough]
    namespace:
      type: string
      description: Kubernetes namespace for gateway resources
    k8sGatewayName:
      type: string
      description: Name of the Kubernetes Gateway resource
    k8sGatewayClassName:
      type: string
      description: Name of the GatewayClass
    status:
      type: string
      enum: [pending, active, error]
    statusMessage:
      type: string
    createdBy:
      type: string
      format: uuid
    routeCount:
      type: integer
    labels:
      $ref: './common.yaml#/Labels'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

DomainList:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/Domain'
    pagination:
      $ref: './common.yaml#/Pagination'

CreateDomainRequest:
  type: object
  required: [name, hostname, domainTemplateId]
  properties:
    name:
      type: string
    hostname:
      type: string
    domainTemplateId:
      type: string
      format: uuid
    tlsSecretName:
      type: string
    tlsSecretNamespace:
      type: string
      description: Kubernetes namespace containing the TLS secret. Must be managed by the project unless it is the default FastGateway namespace.
    namespace:
      type: string
      description: Kubernetes namespace to deploy the domain's gateway resources into. Defaults to the default FastGateway namespace; any other value must be registered for this project.
    labels:
      $ref: './common.yaml#/Labels'

UpdateDomainRequest:
  type: object
  properties:
    name:
      type: string
    tlsSecretName:
      type: string
    tlsSecretNamespace:
      type: string
      description: Kubernetes namespace containing the TLS secret. Must be managed by the project unless it is the default FastGateway namespace.
    labels:
      $ref: './common.yaml#/Labels'

DomainSettings:
  type: object
  description: |
    Domain-level settings (gateway-agnostic configuration), plus the domain's
    BackendTrafficPolicy and EnvoyExtensionPolicy configuration. Always returned
    as an object; fields are omitted (not null) when not configured.
  properties:
    id:
      type: string
      format: uuid
    domainId:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    settings:
      $ref: '#/DomainSettingsConfig'
    backendTrafficPolicy:
      $ref: './btp.yaml#/BackendTrafficPolicyConfig'
    extensionPolicy:
      $ref: './extension.yaml#/EnvoyExtensionPolicyConfig'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

DomainSettingsRecord:
  type: object
  description: Stored domain settings record, as returned directly by the mTLS CA endpoints (no BackendTrafficPolicy/EnvoyExtensionPolicy attached).
  properties:
    id:
      type: string
      format: uuid
    domainId:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    settings:
      $ref: '#/DomainSettingsConfig'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

UpdateDomainSettingsResponse:
  type: object
  nullable: true
  description: |
    Domain settings written by updateDomainSettings, with any operator-facing
    warnings generated while applying the change (e.g. mTLS enabled with no CA
    configured). Null when the update disabled every CTP/BTP/extension setting
    for this domain.
  properties:
    id:
      type: string
      format: uuid
    domainId:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    settings:
      $ref: '#/DomainSettingsConfig'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    warnings:
      type: array
      items:
        type: string
      description: Non-fatal, operator-facing warnings generated while writing the settings

DomainSettingsConfig:
  type: object
  description: Gateway-agnostic domain configuration
  properties:
    clientConnection:
      $ref: '#/ClientConnectionConfig'
    clientIPDetection:
      $ref: '#/ClientIPDetectionConfig'
    timeout:
      $ref: '#/DomainTimeoutConfig'
    http3:
      $ref: '#/HTTP3Config'
    tls:
      $ref: '#/TLSSettingsConfig'
    mtls:
      $ref: '#/DomainMTLSConfig'

ClientConnectionConfig:
  type: object
  description: Client connection settings
  properties:
    tcpKeepalive:
      $ref: '#/TCPKeepaliveConfig'
    proxyProtocol:
      $ref: '#/ProxyProtocolConfig'
    connectionLimit:
      $ref: '#/ConnectionLimitConfig'
    bufferLimit:
      type: string
      description: Buffer size limit (e.g., "32Ki")

TCPKeepaliveConfig:
  type: object
  description: TCP keepalive configuration for downstream client connections
  properties:
    probes:
      type: integer
      format: int32
      description: Maximum number of keepalive probes before considering the connection dead
      example: 3
    idleTime:
      type: string
      description: Duration of idle time before keepalive probes start (e.g., "60s")
      example: "60s"
    interval:
      type: string
      description: Duration between keepalive probes (e.g., "10s")
      example: "10s"

ClientIPDetectionConfig:
  type: object
  description: Client IP detection configuration for extracting client IP from HTTP headers
  properties:
    xForwardedFor:
      $ref: '#/XForwardedForConfig'
    customHeader:
      $ref: '#/CustomHeaderConfig'

XForwardedForConfig:
  type: object
  description: Extract client IP from X-Forwarded-For header
  required:
    - numTrustedHops
  properties:
    numTrustedHops:
      type: integer
      minimum: 1
      maximum: 10
      description: Number of trusted proxy hops in the XFF chain

CustomHeaderConfig:
  type: object
  description: Extract client IP from a custom header
  required:
    - name
  properties:
    name:
      type: string
      description: Name of the header containing client IP (e.g., CF-Connecting-IP)
    failClosed:
      type: boolean
      default: false
      description: Reject requests if the header is missing

UpdateDomainSettingsRequest:
  type: object
  description: Request to update domain settings. Omit or null fields to disable features.
  properties:
    clientConnection:
      $ref: '#/ClientConnectionConfig'
    clientIPDetection:
      $ref: '#/ClientIPDetectionConfig'
    timeout:
      $ref: '#/DomainTimeoutConfig'
    http3:
      $ref: '#/HTTP3Config'
    tls:
      $ref: '#/TLSSettingsConfig'
    mtls:
      $ref: '#/DomainMTLSConfig'
    backendTrafficPolicy:
      $ref: './btp.yaml#/BackendTrafficPolicyConfig'
    extensionPolicy:
      $ref: './extension.yaml#/EnvoyExtensionPolicyConfig'

ProxyProtocolConfig:
  type: object
  description: Proxy protocol configuration
  properties:
    enabled:
      type: boolean
      description: Enable proxy protocol

ConnectionLimitConfig:
  type: object
  description: Connection limit configuration
  properties:
    maxConnections:
      type: integer
      description: Maximum number of connections
    closeDelay:
      type: string
      description: Delay before closing connections (e.g., "5s")
    maxConnectionDuration:
      type: string
      description: Maximum connection duration (e.g., "1h")
    maxRequestsPerConnection:
      type: integer
      description: Maximum requests per connection

DomainTimeoutConfig:
  type: object
  description: Domain-level timeout configuration
  properties:
    http:
      $ref: '#/HTTPDomainTimeoutConfig'

HTTPDomainTimeoutConfig:
  type: object
  description: HTTP timeout settings
  properties:
    requestReceivedTimeout:
      type: string
      description: Timeout for receiving the complete request (e.g., "30s")
    idleTimeout:
      type: string
      description: Idle connection timeout (e.g., "120s")

HTTP3Config:
  type: object
  description: HTTP/3 configuration
  properties:
    enabled:
      type: boolean
      description: Enable HTTP/3

TLSSettingsConfig:
  type: object
  description: TLS settings configuration
  properties:
    minVersion:
      type: string
      enum: ["TLS1.0", "TLSv1.0", "TLS1.1", "TLSv1.1", "TLS1.2", "TLSv1.2", "TLS1.3", "TLSv1.3", "Auto", ""]
      description: Minimum TLS version
    maxVersion:
      type: string
      enum: ["TLS1.0", "TLSv1.0", "TLS1.1", "TLSv1.1", "TLS1.2", "TLSv1.2", "TLS1.3", "TLSv1.3", "Auto", ""]
      description: Maximum TLS version
    ciphers:
      type: array
      items:
        type: string
      description: TLS cipher suites
    ecdhCurves:
      type: array
      items:
        type: string
      description: ECDH curves
    signatureAlgorithms:
      type: array
      items:
        type: string
      description: Signature algorithms

DomainMTLSConfig:
  type: object
  description: Domain-level mTLS configuration
  properties:
    enabled:
      type: boolean
      description: Enable mTLS
    optional:
      type: boolean
      description: Make client certificate optional
    caCerts:
      type: array
      items:
        $ref: '#/MTLSCACert'
      description: CA certificates for client verification
    sanWhitelist:
      type: array
      items:
        $ref: '#/MTLSSANEntry'
      description: Subject Alternative Name whitelist
    hashWhitelist:
      type: array
      items:
        type: string
      description: Certificate hash whitelist

MTLSCACert:
  type: object
  description: mTLS CA certificate reference
  properties:
    id:
      type: string
    name:
      type: string
      description: CA certificate display name
    secretName:
      type: string
      description: K8s Secret name containing the CA cert
    secretKey:
      type: string
      description: Key within the Secret

MTLSSANEntry:
  type: object
  description: Subject Alternative Name entry
  properties:
    type:
      type: string
      enum: [DNS, URI]
      description: SAN type
    value:
      type: string
      description: SAN value

AddDomainMTLSCARequest:
  type: object
  required: [caPem, name]
  description: Request to add CA certificate for domain mTLS
  properties:
    caPem:
      type: string
      description: CA certificate PEM content
    name:
      type: string
      description: Display name for the CA

DomainYAMLs:
  type: object
  properties:
    gatewayYaml:
      type: string
    clientTrafficPolicyYaml:
      type: string
    backendTrafficPolicyYaml:
      type: string
    envoyExtensionPolicyYaml:
      type: string

DomainSettingsPreviewInput:
  type: object
  properties:
    clientConnection:
      $ref: '#/ClientConnectionConfig'
    timeout:
      $ref: '#/DomainTimeoutConfig'
    http3:
      $ref: '#/HTTP3Config'
    tls:
      $ref: '#/TLSSettingsConfig'
    clientIPDetection:
      $ref: '#/ClientIPDetectionConfig'
    mtls:
      $ref: '#/DomainMTLSConfig'
    backendTrafficPolicy:
      $ref: './btp.yaml#/BackendTrafficPolicyConfig'
    extensionPolicy:
      $ref: './extension.yaml#/EnvoyExtensionPolicyConfig'
    description:
      type: string
    includeAIReview:
      type: boolean
      description: When true, triggers AI review of the proposed changes

DomainSettingsPreviewResult:
  type: object
  properties:
    currentGatewayYaml:
      type: string
    currentClientTrafficPolicyYaml:
      type: string
    proposedClientTrafficPolicyYaml:
      type: string
    currentBackendTrafficPolicyYaml:
      type: string
    proposedBackendTrafficPolicyYaml:
      type: string
    currentEnvoyExtensionPolicyYaml:
      type: string
    proposedEnvoyExtensionPolicyYaml:
      type: string
    aiReview:
      $ref: './ai.yaml#/AIReviewResult'

DomainCreatePreviewInput:
  type: object
  required: [name, hostname, domainTemplateId]
  properties:
    name:
      type: string
    hostname:
      type: string
    domainTemplateId:
      type: string
      format: uuid
    tlsSecretName:
      type: string
    tlsSecretNamespace:
      type: string
      description: Kubernetes namespace containing the TLS secret. Must be managed by the project unless it is the default FastGateway namespace.
    namespace:
      type: string
      description: Kubernetes namespace to deploy the domain's gateway resources into. Defaults to the default FastGateway namespace; any other value must be registered for this project.
    labels:
      $ref: './common.yaml#/Labels'
    description:
      type: string
    includeAIReview:
      type: boolean
      description: When true, triggers AI review of the proposed domain creation

DomainCreatePreviewResult:
  type: object
  properties:
    proposedGatewayYaml:
      type: string
    aiReview:
      $ref: './ai.yaml#/AIReviewResult'

TLSSecretInfo:
  type: object
  description: A kubernetes.io/tls Secret discovered in the cluster, available for use as a domain's TLS secret
  properties:
    name:
      type: string
    namespace:
      type: string
    managedByFastgateway:
      type: boolean
      description: True when the secret carries the app.kubernetes.io/managed-by=fastgateway label
    labels:
      $ref: './common.yaml#/Labels'
    createdAt:
      type: string
      description: Secret creation timestamp (RFC3339), empty if unknown

ListTLSSecretsResponse:
  type: object
  description: TLS secrets available in a namespace, plus the namespaces available to look up
  properties:
    namespace:
      type: string
      description: Namespace the secrets were listed from
    secrets:
      type: array
      items:
        $ref: '#/TLSSecretInfo'
    availableNamespaces:
      type: array
      items:
        type: string
      description: Namespaces eligible for domain/TLS secret deployment in this project

AvailableNamespacesResponse:
  type: object
  properties:
    namespaces:
      type: array
      items:
        type: string
      description: Namespaces eligible for domain deployment in this project
