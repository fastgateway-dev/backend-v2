TestConnectionResult:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean
    prometheusVersion:
      type: string
      description: Prometheus server version, present when ok is true
    error:
      type: string
      description: Failure reason, present when ok is false

PromPoint:
  type: object
  properties:
    time:
      type: string
      format: date-time
    value:
      type: number

MetricsTimeRange:
  type: object
  properties:
    start:
      type: string
      format: date-time
    end:
      type: string
      format: date-time
    step:
      type: string
      description: Resolved PromQL step (e.g. 15s, 1m)

RpsByClass:
  type: object
  description: Requests-per-second time series bucketed by HTTP status class
  properties:
    '2xx':
      type: array
      items:
        $ref: '#/PromPoint'
    '3xx':
      type: array
      items:
        $ref: '#/PromPoint'
    '4xx':
      type: array
      items:
        $ref: '#/PromPoint'
    '5xx':
      type: array
      items:
        $ref: '#/PromPoint'

LatencyPercentiles:
  type: object
  properties:
    p50:
      type: array
      items:
        $ref: '#/PromPoint'
    p95:
      type: array
      items:
        $ref: '#/PromPoint'
    p99:
      type: array
      items:
        $ref: '#/PromPoint'

RouteMetricsResult:
  type: object
  properties:
    timeRange:
      $ref: '#/MetricsTimeRange'
    totalRequests:
      type: number
    errorRatePercent:
      type: number
    rps:
      $ref: '#/RpsByClass'
    latency:
      $ref: '#/LatencyPercentiles'

TopRouteEntry:
  type: object
  properties:
    routeId:
      type: string
      format: uuid
    routeName:
      type: string
    value:
      type: number

DomainMetricsResult:
  type: object
  properties:
    timeRange:
      $ref: '#/MetricsTimeRange'
    totalRequests:
      type: number
    errorRatePercent:
      type: number
    rps:
      $ref: '#/RpsByClass'
    latency:
      $ref: '#/LatencyPercentiles'
    topRoutesByRps:
      type: array
      items:
        $ref: '#/TopRouteEntry'
    topRoutesByErrorRate:
      type: array
      items:
        $ref: '#/TopRouteEntry'

L4ListenerMetrics:
  type: object
  description: Current L4 throughput of one stream listener (one L4 route is one Gateway listener port)
  required: [routeId, routeName, protocol, port, activeConnections, connectionRate, bytesIn, bytesOut]
  properties:
    routeId:
      type: string
      format: uuid
    routeName:
      type: string
    protocol:
      type: string
      enum: [tcp, udp]
    port:
      type: integer
      description: Gateway listener port
    activeConnections:
      type: number
      description: Open TCP connections, or active UDP sessions for a UDP listener
    connectionRate:
      type: number
      description: New connections (UDP sessions) per second, averaged over 5m
    bytesIn:
      type: number
      description: Bytes per second received from clients, averaged over 5m
    bytesOut:
      type: number
      description: Bytes per second sent to clients, averaged over 5m

L4Metrics:
  type: object
  description: |
    L4 metrics for a stream, per listener and summed. There are no HTTP
    request-rate, latency or error-class series for L4.
  required: [streamId, listeners, activeConnections, connectionRate, bytesIn, bytesOut]
  properties:
    streamId:
      type: string
      format: uuid
    listeners:
      type: array
      items:
        $ref: '#/L4ListenerMetrics'
    activeConnections:
      type: number
    connectionRate:
      type: number
    bytesIn:
      type: number
    bytesOut:
      type: number
