DomainTemplate:
  type: object
  properties:
    id:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    controllerName:
      type: string
    exposureType:
      type: string
      enum: [LoadBalancer, ClusterIP]
    tlsMode:
      type: string
      enum: [tls_only, no_tls, both]
    httpPort:
      type: integer
    httpsPort:
      type: integer
    tlsPolicy:
      type: string
      enum: [terminate, passthrough]
    externalTrafficPolicy:
      type: string
      enum: [Cluster, Local]
    loadBalancerClass:
      type: string
    annotations:
      type: object
      additionalProperties:
        type: string
    podAnnotations:
      type: object
      additionalProperties:
        type: string
      description: Annotations applied to the Envoy proxy pods
    containerResources:
      $ref: '#/ContainerResourcesConfig'
    scalingConfig:
      $ref: '#/ScalingConfig'
    mergeGateways:
      type: boolean
      description: Merge all Gateways using this template into a single Envoy Deployment/Service
    telemetryAccessLog:
      $ref: '#/TelemetryAccessLogConfig'
    telemetryTracing:
      $ref: '#/TelemetryTracingConfig'
    telemetryMetrics:
      $ref: '#/TelemetryMetricsConfig'
    podPlacement:
      $ref: '#/PodPlacementConfig'
    pdbConfig:
      $ref: '#/PDBConfig'
    deploymentStrategy:
      $ref: '#/DeploymentStrategyConfig'
    status:
      type: string
      enum: [pending, active, error]
    statusMessage:
      type: string
    k8sGatewayClassName:
      type: string
    k8sEnvoyProxyName:
      type: string
    createdBy:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

DomainTemplateList:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/DomainTemplate'
    pagination:
      $ref: './common.yaml#/Pagination'

CreateDomainTemplateRequest:
  type: object
  required: [name, exposureType, tlsMode]
  properties:
    name:
      type: string
    description:
      type: string
    controllerName:
      type: string
      default: gateway.envoyproxy.io/gatewayclass-controller
    exposureType:
      type: string
      enum: [LoadBalancer, ClusterIP]
    tlsMode:
      type: string
      enum: [tls_only, no_tls, both]
    httpPort:
      type: integer
      default: 80
    httpsPort:
      type: integer
      default: 443
    tlsPolicy:
      type: string
      enum: [terminate, passthrough]
      default: terminate
    externalTrafficPolicy:
      type: string
      enum: [Cluster, Local]
    loadBalancerClass:
      type: string
    annotations:
      type: object
      additionalProperties:
        type: string
    podAnnotations:
      type: object
      additionalProperties:
        type: string
      description: Annotations applied to the Envoy proxy pods
    containerResources:
      $ref: '#/ContainerResourcesConfig'
    scalingConfig:
      $ref: '#/ScalingConfig'
    mergeGateways:
      type: boolean
      description: Merge all Gateways using this template into a single Envoy Deployment/Service
    telemetryAccessLog:
      $ref: '#/TelemetryAccessLogConfig'
    telemetryTracing:
      $ref: '#/TelemetryTracingConfig'
    telemetryMetrics:
      $ref: '#/TelemetryMetricsConfig'
    podPlacement:
      $ref: '#/PodPlacementConfig'
    pdbConfig:
      $ref: '#/PDBConfig'
    deploymentStrategy:
      $ref: '#/DeploymentStrategyConfig'

UpdateDomainTemplateRequest:
  type: object
  properties:
    description:
      type: string
    externalTrafficPolicy:
      type: string
      enum: [Cluster, Local]
    loadBalancerClass:
      type: string
    annotations:
      type: object
      additionalProperties:
        type: string
    podAnnotations:
      type: object
      additionalProperties:
        type: string
      description: Annotations applied to the Envoy proxy pods
    containerResources:
      $ref: '#/ContainerResourcesConfig'
    scalingConfig:
      $ref: '#/ScalingConfig'
    telemetryAccessLog:
      $ref: '#/TelemetryAccessLogConfig'
    telemetryTracing:
      $ref: '#/TelemetryTracingConfig'
    telemetryMetrics:
      $ref: '#/TelemetryMetricsConfig'
    podPlacement:
      $ref: '#/PodPlacementConfig'
    pdbConfig:
      $ref: '#/PDBConfig'
    deploymentStrategy:
      $ref: '#/DeploymentStrategyConfig'
    clearTelemetryAccessLog:
      type: boolean
      description: When true, clears the stored telemetryAccessLog config (JSON null is indistinguishable from absent)
    clearTelemetryTracing:
      type: boolean
      description: When true, clears the stored telemetryTracing config
    clearTelemetryMetrics:
      type: boolean
      description: When true, clears the stored telemetryMetrics config
    clearPodPlacement:
      type: boolean
      description: When true, clears the stored podPlacement config
    clearPdbConfig:
      type: boolean
      description: When true, clears the stored pdbConfig config
    clearDeploymentStrategy:
      type: boolean
      description: When true, clears the stored deploymentStrategy config

DomainTemplateManifests:
  type: object
  properties:
    gatewayClassYaml:
      type: string
    envoyProxyYaml:
      type: string

