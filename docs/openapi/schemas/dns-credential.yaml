DNSProviderCredential:
  type: object
  description: Platform-global DNS provider credential (owner-only). Never includes credential material.
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    providerType:
      type: string
      description: 'DNS provider identifier (e.g. cloudflare, route53).'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

DNSProviderCredentialList:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/DNSProviderCredential'

CreateDNSCredentialRequest:
  type: object
  required: [name, providerType, credentials]
  properties:
    name:
      type: string
    providerType:
      type: string
      description: 'DNS provider identifier (e.g. cloudflare, route53).'
    credentials:
      type: object
      additionalProperties:
        type: string
      description: 'Provider-specific plaintext credential values (e.g. `{"apiToken": "..."}`). Encrypted at rest; never returned in any response.'

UpdateDNSCredentialRequest:
  type: object
  description: Both fields are optional. Omitting `credentials` leaves the existing encrypted values untouched.
  properties:
    name:
      type: string
    credentials:
      type: object
      additionalProperties:
        type: string
      description: Provider-specific plaintext credential values to rotate. Encrypted at rest; never returned in any response.
