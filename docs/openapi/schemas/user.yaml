User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
    email:
      type: string
      format: email
    role:
      type: string
      enum: [owner, user]
    isActive:
      type: boolean
    authProvider:
      type: string
      description: How the user authenticates (e.g., local, sso)
    providerSubject:
      type: string
      nullable: true
      description: Subject identifier from the SSO provider, if applicable
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CurrentUser:
  description: User profile returned by GET /auth/me, including how the caller authenticated this request
  allOf:
    - $ref: '#/User'
    - type: object
      properties:
        authMethod:
          type: string
          description: How the current request was authenticated (e.g., jwt, api_token)

UserList:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/User'
    pagination:
      $ref: './common.yaml#/Pagination'

CreateUserRequest:
  type: object
  required: [username, email, password, role]
  properties:
    username:
      type: string
    email:
      type: string
      format: email
    password:
      type: string
    role:
      type: string
      enum: [owner, user]

UpdateUserRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    password:
      type: string
    isActive:
      type: boolean
