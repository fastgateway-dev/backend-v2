Permission:
  type: string
  enum:
    - route.view
    - route.create
    - route.edit
    - route.delete
    - route.deploy
    - route.approve
    - client.view
    - client.create
    - client.edit
    - client.delete
    - client.manage_ip
    - client.manage_apikey
    - client.manage_jwt
    - client.attach
    - client.detach
    - client.approve
    - domain.view
    - domain.create
    - domain.edit
    - domain.delete
    - project.settings
    - project.teams
    - project.approval_policy
    - audit.view

PermissionPreset:
  type: object
  properties:
    id:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    permissions:
      type: array
      items:
        $ref: '#/Permission'
    isBuiltin:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreatePresetRequest:
  type: object
  required: [name, permissions]
  properties:
    name:
      type: string
    description:
      type: string
    permissions:
      type: array
      items:
        $ref: '#/Permission'

UpdatePresetRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    permissions:
      type: array
      items:
        $ref: '#/Permission'
