EnvoyExtensionPolicy:
  type: object
  description: Envoy Gateway EnvoyExtensionPolicy resource (Lua, Wasm, and/or ext_proc extensions configured on a route)
  properties:
    id:
      type: string
      format: uuid
    routeId:
      type: string
      format: uuid
    domainId:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    config:
      $ref: '#/EnvoyExtensionPolicyConfig'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

EnvoyExtensionPolicyConfig:
  type: object
  description: Lua, Wasm, and ext_proc extension configuration stored for a route
  properties:
    lua:
      $ref: '#/LuaExtensionConfig'
    wasm:
      $ref: '#/WasmExtensionConfig'
    extProc:
      $ref: '#/ExtProcExtensionConfig'

EnvoyExtensionPolicyInput:
  type: object
  description: Envoy extension policy input for Lua, Wasm, and ext_proc extensions
  properties:
    lua:
      $ref: '#/LuaExtensionConfig'
    wasm:
      $ref: '#/WasmExtensionConfig'
    extProc:
      $ref: '#/ExtProcExtensionConfig'

LuaExtensionConfig:
  type: object
  required: [type]
  description: Lua extension configuration
  properties:
    type:
      type: string
      enum: [Inline, ValueRef]
      description: Lua script source type
    inline:
      type: string
      description: Inline Lua script (when type is Inline)
    valueRef:
      $ref: './btp.yaml#/ValueRef'

WasmExtensionConfig:
  type: object
  required: [name, code]
  description: Wasm extension configuration
  properties:
    name:
      type: string
      description: Wasm filter name
    rootID:
      type: string
      description: Wasm root ID (optional)
    code:
      $ref: '#/WasmCodeSource'
    config:
      type: string
      description: JSON configuration for the Wasm module

WasmCodeSource:
  type: object
  required: [type]
  description: Wasm code source
  properties:
    type:
      type: string
      enum: [HTTP, Image]
      description: Source type
    http:
      $ref: '#/WasmHTTPSource'
    image:
      $ref: '#/WasmImageSource'

WasmHTTPSource:
  type: object
  required: [url, sha256]
  description: HTTP source for Wasm module
  properties:
    url:
      type: string
      description: URL to download the Wasm module
    sha256:
      type: string
      description: SHA256 checksum of the module (64-character hex string)

WasmImageSource:
  type: object
  required: [url]
  description: OCI image source for Wasm module
  properties:
    url:
      type: string
      description: OCI image URL (e.g., "oci://ghcr.io/example/wasm:v1.0")
    sha256:
      type: string
      description: SHA256 checksum (optional for images)
    pullSecret:
      $ref: './btp.yaml#/ValueRef'
      description: Reference to Secret containing registry credentials

ExtProcExtensionConfig:
  type: object
  required: [backendRef]
  description: External processing (ext_proc) extension configuration - sends request/response traffic to a gRPC processor service
  properties:
    backendRef:
      $ref: '#/ExtProcBackendRef'
    processingMode:
      $ref: '#/ExtProcProcessingMode'
    failOpen:
      type: boolean
      default: false
      description: If true, traffic is allowed through when the ext_proc server is unavailable

ExtProcBackendRef:
  type: object
  required: [name, namespace, port]
  description: gRPC service to send request/response traffic to for ext_proc processing
  properties:
    name:
      type: string
      description: Service name of the ext_proc gRPC backend
    namespace:
      type: string
      description: Namespace of the ext_proc gRPC backend
    port:
      type: integer
      minimum: 1
      maximum: 65535
      description: Port of the ext_proc gRPC backend

ExtProcProcessingMode:
  type: object
  description: Controls which request/response parts are sent to the ext_proc processor
  properties:
    request:
      $ref: '#/ExtProcBodyMode'
    response:
      $ref: '#/ExtProcBodyMode'

ExtProcBodyMode:
  type: object
  description: Body processing mode for a request or response phase
  properties:
    body:
      type: string
      enum: [None, Buffered, Streamed]
      description: How the body is sent to the ext_proc processor
