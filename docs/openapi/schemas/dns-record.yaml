DomainDNSRecord:
  type: object
  description: |
    The one FastGateway-managed DNS record for a domain. `hostname` is always
    the domain's own hostname (not stored on this row). Status is
    resolved on every read (status-on-read) rather than by a background
    reconciler, so `status`/`statusMessage`/`resolvedTarget` always reflect
    the last reconcile attempt made by this request.
  properties:
    id:
      type: string
      format: uuid
    domainId:
      type: string
      format: uuid
    hostedZoneId:
      type: string
      format: uuid
      description: The registered hosted zone this record is written into.
    recordType:
      type: string
      enum: [auto, A, AAAA, CNAME]
      description: '`auto` resolves to A or AAAA from the gateway''s load-balancer address; the others pin a specific record type.'
    ttl:
      type: integer
      nullable: true
      description: DNS record TTL in seconds. Omitted/null uses the provider's default.
    proxied:
      type: boolean
      description: Cloudflare-specific proxy flag; ignored by other providers.
    resolvedTarget:
      type: string
      description: The gateway load-balancer address (IP or hostname) last resolved for this record, if any.
    status:
      type: string
      enum: [pending, ready, error]
    statusMessage:
      type: string
      description: Human-readable detail for the current status.
    createdBy:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

DNSRecordListItem:
  description: |
    A row in the project-wide DNS records list: a domain's managed DNS record
    plus the domain hostname (the record's name) and the name of the hosted
    zone it lives in. This is a read-only aggregation and is not reconciled, so
    `status` reflects the last persisted value.
  allOf:
    - $ref: '#/DomainDNSRecord'
    - type: object
      properties:
        domainHostname:
          type: string
          description: The record's name — the domain's hostname.
        zoneName:
          type: string
          description: The name of the hosted zone the record lives in (empty if the zone row is gone).

CreateDNSRecordRequest:
  type: object
  required: [hostedZoneId]
  properties:
    hostedZoneId:
      type: string
      format: uuid
      description: The registered hosted zone to write this record into. Required.
    recordType:
      type: string
      enum: [auto, A, AAAA, CNAME]
      default: auto
    ttl:
      type: integer
      nullable: true
    proxied:
      type: boolean
      default: false

UpdateDNSRecordRequest:
  type: object
  properties:
    recordType:
      type: string
      enum: [auto, A, AAAA, CNAME]
    ttl:
      type: integer
      nullable: true
    proxied:
      type: boolean
