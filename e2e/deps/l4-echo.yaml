# Echo backends for the L4 (stream) e2e suite. Built from e2e/servers/l4-echo
# and loaded into kind. Each Service is SINGLE-PROTOCOL: Envoy Gateway's
# backendRef port resolution is unreliable for a Service that mixes TCP and UDP
# ports, so TCP routes target the TCP-only Services (l4-echo-a / l4-echo-b) and
# UDP routes target the UDP-only Service (l4-echo-udp). Two TCP Services (not
# one with two replicas) let the health-check test fail one backend while the
# other stays up. The l4-echo container always listens on both ports; the
# Services just expose one each.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: l4-echo-a
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: l4-echo-a
  template:
    metadata:
      labels:
        app: l4-echo-a
    spec:
      containers:
        - name: l4-echo
          image: fastgateway-l4-echo:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9100
              protocol: TCP
            - containerPort: 9101
              protocol: UDP
          env:
            - name: TCP_PORT
              value: "9100"
            - name: UDP_PORT
              value: "9101"
---
apiVersion: v1
kind: Service
metadata:
  name: l4-echo-a
  namespace: default
spec:
  selector:
    app: l4-echo-a
  ports:
    - name: tcp
      protocol: TCP
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: l4-echo-b
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: l4-echo-b
  template:
    metadata:
      labels:
        app: l4-echo-b
    spec:
      containers:
        - name: l4-echo
          image: fastgateway-l4-echo:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9100
              protocol: TCP
            - containerPort: 9101
              protocol: UDP
          env:
            - name: TCP_PORT
              value: "9100"
            - name: UDP_PORT
              value: "9101"
---
apiVersion: v1
kind: Service
metadata:
  name: l4-echo-b
  namespace: default
spec:
  selector:
    app: l4-echo-b
  ports:
    - name: tcp
      protocol: TCP
      port: 9100
      targetPort: 9100
---
# UDP-only Service over the l4-echo-a pods, for UDP routes.
apiVersion: v1
kind: Service
metadata:
  name: l4-echo-udp
  namespace: default
spec:
  selector:
    app: l4-echo-a
  ports:
    - name: udp
      protocol: UDP
      port: 9101
      targetPort: 9101
