apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-external-auth
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-external-auth
  template:
    metadata:
      labels:
        app: grpc-external-auth
    spec:
      containers:
        - name: grpc-external-auth
          image: fastgateway-grpc-external-auth:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9003
          env:
            - name: PORT
              value: "9003"
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-external-auth
  namespace: default
spec:
  selector:
    app: grpc-external-auth
  ports:
    - protocol: TCP
      port: 9003
      targetPort: 9003
