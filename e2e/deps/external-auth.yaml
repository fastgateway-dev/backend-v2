apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-auth
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-auth
  template:
    metadata:
      labels:
        app: external-auth
    spec:
      containers:
        - name: external-auth
          image: fastgateway-external-auth:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9001
          env:
            - name: PORT
              value: "9001"
---
apiVersion: v1
kind: Service
metadata:
  name: external-auth
  namespace: default
spec:
  selector:
    app: external-auth
  ports:
    - protocol: TCP
      port: 9001
      targetPort: 9001
