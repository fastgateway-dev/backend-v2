apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-proc-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-proc-server
  template:
    metadata:
      labels:
        app: ext-proc-server
    spec:
      containers:
        - name: ext-proc-server
          image: fastgateway-ext-proc-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9004
          env:
            - name: PORT
              value: "9004"
---
apiVersion: v1
kind: Service
metadata:
  name: ext-proc-server
  namespace: default
spec:
  selector:
    app: ext-proc-server
  ports:
    - protocol: TCP
      port: 9004
      targetPort: 9004
