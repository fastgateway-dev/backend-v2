apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:latest
          command:
            - ./podinfo
            - --grpc-port=9999
          ports:
            - name: http
              containerPort: 9898
            - name: grpc
              containerPort: 9999
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: default
spec:
  selector:
    app: podinfo
  ports:
    - name: http
      protocol: TCP
      port: 9898
      targetPort: 9898
    - name: grpc
      protocol: TCP
      port: 9999
      targetPort: 9999
